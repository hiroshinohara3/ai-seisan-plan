<header><div class="title">AI生産計画 v32（v30基準・再計画エンジン再構築）</div><div>日別能力・段取り・製品能力を考慮した生産計画版</div></header><main id="app"></main>
<script>
"use strict";
var app=document.getElementById("app"),days=["月","火","水","木","金","土","日"];
function parse(k){try{var r=localStorage.getItem(k);return r?JSON.parse(r):null}catch(e){return null}}
function arr(keys){for(var i=0;i<keys.length;i++){var v=parse(keys[i]);if(Array.isArray(v))return v}return[]}
function norm(x){x=x||{};return{name:String(x.name||x.lineName||""),capacity:+(x.capacity!=null?x.capacity:x.hourCapacity)||0,lot:+(x.lot!=null?x.lot:x.minLot)||0,workers:+(x.workers!=null?x.workers:x.personnel)||0,standardStart:x.standardStart||"08:00",standardEnd:x.standardEnd||"17:00",standardBreak:+(x.standardBreak!=null?x.standardBreak:60)}}
var raw=arr(["aiSeisan_lines","aiSeisanV19_lines","aiSeisanV18_lines","aiSeisanV17_lines","aiSeisanV16_lines","aiSeisanV15_lines"]);
var lines=[];raw.forEach(function(x){var n=norm(x);if(n.name&&!lines.some(function(y){return y.name===n.name}))lines.push(n)});
var schedules=arr(["aiSeisan_schedules","aiSeisanV19_schedules","aiSeisanV18_schedules","aiSeisanV17_schedules"]);
function save(){localStorage.setItem("aiSeisan_lines",JSON.stringify(lines));localStorage.setItem("aiSeisan_schedules",JSON.stringify(schedules));localStorage.setItem("aiSeisanV20_lines",JSON.stringify(lines));localStorage.setItem("aiSeisanV20_schedules",JSON.stringify(schedules))}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function mins(t){var p=(t||"").split(":");return p.length==2?+p[0]*60+ +p[1]:0}
function calc(d){if(!d.enabled)return 0;var n=mins(d.end)-mins(d.start);if(n<0)n+=1440;return Math.max(0,n-(+d.breakMin||0))}
function defaults(l){return days.map(function(d){return{day:d,enabled:["月","火","水","木","金"].indexOf(d)>=0,start:l.standardStart,end:l.standardEnd,breakMin:l.standardBreak}})}
function getSc(i){for(var j=0;j<schedules.length;j++)if(+schedules[j].lineId===i)return schedules[j];var x={lineId:i,days:defaults(lines[i])};schedules.push(x);save();return x}
function hoursForDay(sc,d){if(!sc||!sc.days||!sc.days[d])return 0;return calc(sc.days[d])/60}
save();
function home(){app.innerHTML='<div class="card"><h2>マスター管理</h2><div class="ok">ライン：'+lines.length+'件</div><button id="l">ラインを登録・修正</button><button class="orange" id="w">曜日別稼働時間を設定</button></div><div class="card"><div class="hint">標準稼働時間を変更すると、曜日別稼働時間も標準値に更新されます。その後、曜日ごとに個別修正できます。</div></div>';document.getElementById("l").onclick=linesPage;document.getElementById("w").onclick=lineSelect}
function linesPage(){var s='<div class="card"><h2>ライン登録・修正</h2><div class="hint">標準稼働時間を変更して保存すると、そのラインの曜日別設定を標準値へ更新します。</div>';lines.forEach(function(x,i){s+='<div class="item"><b>'+esc(x.name)+'</b><div class="small">能力 '+x.capacity+'個/h　最低ロット '+x.lot+'個　人員 '+x.workers+'人</div><div class="small">標準：'+x.standardStart+'〜'+x.standardEnd+'　休憩 '+x.standardBreak+'分</div><div class="actions"><button data-e="'+i+'">編集</button><button class="red" data-d="'+i+'">削除</button></div></div>'});s+='<button class="green" id="n">＋新規登録</button><button class="gray" id="b">戻る</button></div>';app.innerHTML=s;document.getElementById("n").onclick=function(){editLine(-1)};document.getElementById("b").onclick=home;document.querySelectorAll("[data-e]").forEach(function(b){b.onclick=function(){editLine(+this.dataset.e)}});document.querySelectorAll("[data-d]").forEach(function(b){b.onclick=function(){var i=+this.dataset.d;if(confirm("削除しますか？")){lines.splice(i,1);schedules=schedules.filter(function(x){return +x.lineId!==i});save();linesPage()}}})}
function editLine(i){var x=i>=0?lines[i]:{standardStart:"08:00",standardEnd:"17:00",standardBreak:60};app.innerHTML='<div class="card"><h2>ライン'+(i<0?"新規登録":"編集")+'</h2><label>ライン名<input id="n" value="'+esc(x.name)+'"></label><label>標準1時間能力（個）<input id="c" type="number" value="'+x.capacity+'"></label><label>標準最低ロット（個）<input id="l" type="number" value="'+x.lot+'"></label><label>必要人員（人）<input id="w" type="number" value="'+x.workers+'"></label><h3>標準稼働時間</h3><div class="row"><div><label>標準開始</label><input id="st" type="time" value="'+x.standardStart+'"></div><div><label>標準終了</label><input id="ed" type="time" value="'+x.standardEnd+'"></div></div><label>標準休憩（分）<input id="br" type="number" value="'+x.standardBreak+'"></label><div class="hint">保存すると、既存の曜日別設定もこの標準値に更新されます。</div><button class="green" id="s">保存</button><button class="gray" id="b">キャンセル</button></div>';document.getElementById("s").onclick=function(){var n=document.getElementById("n").value.trim();if(!n){alert("ライン名を入力してください");return}var o={name:n,capacity:+document.getElementById("c").value||0,lot:+document.getElementById("l").value||0,workers:+document.getElementById("w").value||0,standardStart:document.getElementById("st").value||"08:00",standardEnd:document.getElementById("ed").value||"17:00",standardBreak:+document.getElementById("br").value||0};if(i<0)lines.push(o);else{lines[i]=o;schedules.forEach(function(sc){if(+sc.lineId===i)sc.days=defaults(o)})}save();linesPage()};document.getElementById("b").onclick=linesPage}

function scheduleEdit(i){var sc=getSc(i),s='<div class="card"><h2>'+esc(lines[i].name)+' の稼働設定</h2>';sc.days.forEach(function(d,j){s+='<div class="day"><b>'+d.day+'曜日</b><label><input type="checkbox" data-en="'+j+'" style="width:auto" '+(d.enabled?"checked":"")+'> 稼働する</label><div class="row"><div><label>開始</label><input type="time" data-st="'+j+'" value="'+d.start+'"></div><div><label>終了</label><input type="time" data-ed="'+j+'" value="'+d.end+'"></div></div><label>休憩（分）</label><input type="number" data-br="'+j+'" value="'+d.breakMin+'"><div class="small" data-t="'+j+'">実働：'+(calc(d)/60).toFixed(2)+'時間</div></div>'});s+='<div class="total" id="sum">週間実働：'+(sc.days.reduce(function(a,d){return a+calc(d)},0)/60).toFixed(2)+'時間</div><button class="green" id="s">保存</button><button class="gray" id="b">戻る</button></div>';app.innerHTML=s;function refresh(){var t=0;sc.days.forEach(function(d,j){d.enabled=document.querySelector('[data-en="'+j+'"]').checked;d.start=document.querySelector('[data-st="'+j+'"]').value;d.end=document.querySelector('[data-ed="'+j+'"]').value;d.breakMin=+document.querySelector('[data-br="'+j+'"]').value||0;document.querySelector('[data-t="'+j+'"]').textContent="実働："+(calc(d)/60).toFixed(2)+"時間";t+=calc(d)});document.getElementById("sum").textContent="週間実働："+(t/60).toFixed(2)+"時間"}app.querySelectorAll("input").forEach(function(x){x.oninput=refresh;x.onchange=refresh});document.getElementById("s").onclick=function(){refresh();save();lineSelect()};document.getElementById("b").onclick=lineSelect}

/* v22: 製品能力・最低ロット・原料/製品切替段取りを考慮した生産計画 */
var productMaster=arr(["aiSeisan_products","aiSeisanV21_products","aiSeisanV20_products"]);
var transitionRules=arr(["aiSeisan_transitionRules","aiSeisanV21_transitionRules","aiSeisanV20_transitionRules"]);
var planItems=arr(["aiSeisan_planItems","aiSeisanV21_planItems"]);

function saveV22(){
 localStorage.setItem("aiSeisan_products",JSON.stringify(productMaster));
 localStorage.setItem("aiSeisan_transitionRules",JSON.stringify(transitionRules));
 localStorage.setItem("aiSeisan_planItems",JSON.stringify(planItems));
 save();
}
function findProduct(name){
 for(var i=0;i<productMaster.length;i++) if(productMaster[i].name===name) return productMaster[i];
 return null;
}
function productFor(name){
 var p=findProduct(name);
 return p||{name:name,raw:"",capacityOverride:0,minLotOverride:0};
}
function effectiveCapacity(line,p){
 return Number(p.capacityOverride)>0?Number(p.capacityOverride):Number(line.capacity)||0;
}
function effectiveLot(line,p){
 return Number(p.minLotOverride)>0?Number(p.minLotOverride):Number(line.lot)||0;
}
function transition(lineName,fromName,toName){
 if(!fromName || fromName===toName) return {time:0,impossible:false};
 for(var i=0;i<transitionRules.length;i++){
   var r=transitionRules[i];
   if((!r.line || r.line===lineName) && r.from===fromName && r.to===toName)
     return {time:Number(r.time)||0,impossible:!!r.impossible};
 }
 return {time:0,impossible:false};
}

}

 });

 document.querySelectorAll("[data-te]").forEach(function(b){b.onclick=function(){transitionEdit(+this.dataset.te)}});
 document.querySelectorAll("[data-td]").forEach(function(b){b.onclick=function(){var i=+this.dataset.td;if(confirm("削除しますか？")){transitionRules.splice(i,1);saveV22();transitionPage()}}});
}
function transitionEdit(i){
 var r=i>=0?transitionRules[i]:{line:"",from:"",to:"",time:0,impossible:false};
 app.innerHTML='<div class="card"><h2>切替ルール'+(i<0?"登録":"編集")+'</h2>'+
 '<label>ライン名（空欄＝全ライン）<input id="l" value="'+esc(r.line||"")+'"></label>'+
 '<label>切替前の製品名<input id="f" value="'+esc(r.from||"")+'"></label>'+

 document.getElementById("s").onclick=function(){

  if(!o.from||!o.to){alert("切替前後の製品名を入力してください");return}
  if(i<0)transitionRules.push(o);else transitionRules[i]=o;saveV22();transitionPage();
 };
 document.getElementById("b").onclick=transitionPage;
}
function planHome(){
 var s='<div class="card"><h2>今週の生産計画</h2><div class="hint">必要数量を入力し、登録済みのライン能力・曜日別稼働時間・最低ロット・製品切替段取りを考慮して計画案を作成します。</div>';
 if(!planItems.length)s+='<div class="hint">まだ需要が登録されていません。</div>';
 planItems.forEach(function(p,i){s+='<div class="item"><b>'+esc(p.name)+'</b><div class="small">必要数量：'+p.qty+'個</div><div class="actions"><button data-pe="'+i+'">編集</button><button class="red" data-pd="'+i+'">削除</button></div></div>'});
 s+='<button class="green" id="pn">＋今週の需要を登録</button>';
 if(planItems.length)s+='<button class="orange" id="calc">段取りを考慮して生産案を作成</button>';
 s+='<button class="gray" id="back">戻る</button></div>';
 s+='<div class="card"><div class="hint"><b>最低ロットの考え方</b><br>最低ロットは「最低生産数量」です。最低ロットを超えた数量は倍数にそろえません。需要を複数日に分けた結果、最終日の数量が最低ロット未満になる場合は、最低ロットまで生産した案と余剰数量を表示します。</div></div>';
 app.innerHTML=s;
 document.getElementById("pn").onclick=function(){planEdit(-1)};
 document.getElementById("back").onclick=home;
 if(document.getElementById("calc"))document.getElementById("calc").onclick=planResult;
 document.querySelectorAll("[data-pe]").forEach(function(b){b.onclick=function(){planEdit(+b.dataset.pe)}});
 document.querySelectorAll("[data-pd]").forEach(function(b){b.onclick=function(){if(confirm("削除しますか？")){planItems.splice(+b.dataset.pd,1);saveV22();planHome()}}});
}

 var p=i>=0?planItems[i]:{name:"",qty:0};
 var opts='<option value="">製品を選択してください</option>';

 app.innerHTML='<div class="card"><h2>今週の需要'+(i<0?"登録":"編集")+'</h2>'+

 '<div class="hint">製品設定に登録済みの商品から選択できます。登録がない場合は「製品設定」から先に登録してください。</div>'+

 document.getElementById("ps").onclick=function(){var n=document.getElementById("pn").value.trim(),q=+document.getElementById("pq").value||0;if(!n||q<=0){alert("製品を選択し、必要数量を入力してください");return}var o={name:n,qty:q};if(i<0)planItems.push(o);else planItems[i]=o;saveV22();planHome()};document.getElementById("pb").onclick=planHome;

function parseAdjustmentComment(txt){
 var blocked=[],preferred={},surplusTarget="";
 var ds={"月":"月","火":"火","水":"水","木":"木","金":"金","土":"土","日":"日"};
 var m, re=/([月火水木金土日])曜日?[^。,\n]*?(?:生産しない|生産なし|休止|停止)/g;
 while((m=re.exec(txt))) if(blocked.indexOf(ds[m[1]])<0) blocked.push(ds[m[1]]);
 var re2=/([^\s、,。]+)\s*(?:を|は)\s*([月火水木金土日])曜日?(?:に|へ)(?:回す|移す|まとめる|寄せる)/g;
 while((m=re2.exec(txt))) preferred[m[1]]=ds[m[2]];
 // 「余剰分はaを生産して」「余剰分をaに」など、最低ロットによる余剰を指定製品の追加生産へ振り替える。
 var re3=/余剰分(?:は|を)?\s*([^\s、,。]+)\s*(?:を|で)?\s*(?:生産|作る|追加)/;
 m=re3.exec(txt); if(m) surplusTarget=m[1];
 return {blockedDays:blocked,preferred:preferred,surplusTarget:surplusTarget};
}
function makePlan(adjustText){
 var adj=parseAdjustmentComment(adjustText||"");
 if(!lines.length)return {html:'<div class="card"><div class="hint">先にラインを登録してください。</div></div>'};
 var remain=planItems.map(function(p){return{name:p.name,remain:+p.qty,original:+p.qty}});
 var rows=[],warnings=[],daySummary=[];
 var dayOrder=days.filter(function(d){return adj.blockedDays.indexOf(d)<0});
 // Preferred-day products are attempted on the requested day first.
 dayOrder.sort(function(a,b){
   var pa=0,pb=0;
   remain.forEach(function(x){if(adj.preferred[x.name]===a)pa++;if(adj.preferred[x.name]===b)pb++});
   return pb-pa;
 });
 dayOrder.forEach(function(day){
  var d=days.indexOf(day);
  for(var li=0;li<lines.length;li++){
   var line=lines[li],sc=getSc(li),available=hoursForDay(sc,d)*60,last="",dayStartAvailable=available;
   if(available<=0)continue;
   for(var pi=0;pi<remain.length;pi++){
    var x=remain[pi]; if(x.remain<=0)continue;
    if(adj.preferred[x.name] && adj.preferred[x.name]!==day)continue;
    var p=findProduct(x.name);
    if(!p){warnings.push(x.name+"：製品設定がありません");continue}
    var cap=effectiveCapacity(line,p),lot=effectiveLot(line,p);
    if(cap<=0){warnings.push(p.name+"："+line.name+"の能力が未設定");continue}
    var tr=transition(line.name,last,p.name); if(tr.impossible)continue;
    var setup=last?Number(tr.time)||0:0; if(setup>=available)continue;
    var maxQty=Math.floor((available-setup)*cap/60);

 for(var d=0;d<7;d++){
  for(var li=0;li<lines.length;li++){
   var line=lines[li],sc=getSc(li),available=hoursForDay(sc,d)*60,last="";

function renderPlan(rows,title,comment){
 var stats=calcStats(rows),need={};planItems.forEach(function(p){need[p.name]={need:Number(p.qty)||0,prod:0}});rows.forEach(function(r){if(!need[r.product])need[r.product]={need:0,prod:0};need[r.product].prod+=Number(r.qty)||0});
 var s='<div class="card"><h2>'+esc(title)+'</h2>';
 if(comment)s+='<div class="hint"><b>反映したコメント</b><br>'+esc(comment)+'</div>';
 stats.forEach(function(x){s+='<div class="item"><b>'+x.day+'曜日｜'+esc(x.line)+'</b><div class="small">実働可能 '+(x.available/60).toFixed(2)+'時間　計画 '+(x.used/60).toFixed(2)+'時間　残余 '+(x.left/60).toFixed(2)+'時間　段取り '+x.setups+'回</div></div>'});
 rows.sort(function(a,b){var d=days.indexOf(a.day)-days.indexOf(b.day);if(d)return d;return a.line.localeCompare(b.line)}).forEach(function(r){s+='<div class="item"><b>'+r.day+'曜日｜'+esc(r.line)+'</b><div>'+esc(r.product)+'：'+Math.round(r.qty).toLocaleString()+'個</div><div class="small">生産 '+(r.run/60).toFixed(2)+'時間　段取り '+(Number(r.setup)||0)+'分</div></div>'});
 s+='<h3>需要との差</h3>';Object.keys(need).forEach(function(k){var v=need[k],dif=v.prod-v.need;s+='<div class="item"><b>'+esc(k)+'</b>　需要 '+v.need.toLocaleString()+'個　生産 '+Math.round(v.prod).toLocaleString()+'個　差 '+Math.round(dif).toLocaleString()+'個'+(dif>0?'　⚠余剰':'')+'</div>'});
 return s+'</div>';
}

 s+='<div class="card" id="adjustmentPanel"><h2>最終調整</h2><div class="hint"><b>優先順位：</b>需要充足 → 稼働時間最大活用 → 余剰最小化 → 切替・段取り最小化 → 同一製品の連続生産</div><textarea id="adjustmentComment" placeholder="例：木曜日のaを増やして、bを金曜日にずらして"></textarea><button class="orange" id="applyAdjustment">コメントを反映して再計画</button><div id="adjustmentResult"></div></div><button class="gray" id="b">戻る</button></div>';
 app.innerHTML=s;document.getElementById('b').onclick=planHome;document.getElementById('applyAdjustment').onclick=function(){var c=document.getElementById('adjustmentComment').value.trim(),r=document.getElementById('adjustmentResult');if(!c){r.innerHTML='<div class="small">コメントを入力してください。</div>';return}var before=cloneRows(window.__v31BaseRows||[]),res=applyReplan(before,c);var html=renderPlan(before,'変更前の計画')+renderPlan(res.rows,'変更後の計画',c);html+='<div class="card"><h3>再計画結果</h3>';html+=res.changes.length?res.changes.map(function(x){return '<div class="ok">'+esc(x)+'</div>'}).join(''):'<div class="warn">コメントから数量・曜日を変更できる条件を特定できませんでした。</div>';html+='<div class="hint">最低生産数量は倍数制約ではありません。再計画は需要充足・稼働時間・余剰・切替を比較して配置しています。</div></div>';r.innerHTML=html};
};
