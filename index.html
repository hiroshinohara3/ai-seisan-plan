<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb"><title>AI生産計画 v6</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#2563eb;color:#fff;padding:calc(16px + env(safe-area-inset-top)) 16px 16px;position:sticky;top:0;z-index:5}
h1{font-size:21px;margin:0 0 3px}.sub{font-size:12px;opacity:.9}main{max-width:820px;margin:auto;padding:12px 12px 90px}
.card{background:#fff;border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 2px 9px #0000000d}
h2{font-size:18px;margin:0 0 8px}h3{font-size:15px;margin:14px 0 7px}.small{font-size:12px;color:#6b7280}
label{display:block;font-size:12px;font-weight:700;margin:9px 0 4px}input,select{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;background:#fff}
button{width:100%;border:0;border-radius:10px;padding:12px;margin-top:8px;font-size:15px;font-weight:700;background:#2563eb;color:#fff}
button.secondary{background:#e5e7eb;color:#111827}button.green{background:#16a34a}button.danger{background:#dc2626}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.item{border:1px solid #e5e7eb;border-radius:12px;padding:11px;margin:7px 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.actions button{margin:0;padding:9px;font-size:13px}
.day{display:grid;grid-template-columns:48px 1fr 1fr 78px;gap:7px;align-items:end;margin:7px 0}.day b{padding:12px 0}.day input{min-width:0}.check{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600}.check input{width:auto}
.badge{display:inline-block;padding:4px 7px;border-radius:999px;font-size:11px;margin:2px}.blue{background:#dbeafe;color:#1d4ed8}.greenb{background:#dcfce7;color:#166534}.red{background:#fee2e2;color:#991b1b}.yellow{background:#fef3c7;color:#92400e}
.result{font-size:17px;font-weight:800}.bar{height:12px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:#2563eb}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:7px 4px;border-bottom:1px solid #eee;text-align:left}.stickyBottom{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:8px 12px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -2px 10px #0002;z-index:4}
</style></head>
<body><header><h1>AI生産計画 v6</h1><div class="sub">標準値を活用して、週次計画の入力を最小限に</div></header><main id="app"></main>
<script>
const DAYS=["月","火","水","木","金","土","日"];
const defaultWeek=DAYS.map((d,i)=>({day:d,on:i<5,start:"08:00",end:"17:00",break:60,overtime:false}));
const S={page:"home",materials:[],products:[],lines:[],rules:[],overrides:[],pairOverrides:[],week:defaultWeek,demand:[],inventory:{},plan:null};
const app=document.getElementById("app");
function save(){localStorage.setItem("aiSeisanV6",JSON.stringify(S))}
function load(){try{
 let x=JSON.parse(localStorage.getItem("aiSeisanV6")||"null");
 if(!x){let old=JSON.parse(localStorage.getItem("aiSeisanV5")||"null");if(old){Object.assign(S,old);S.week=defaultWeek;S.demand=[];S.inventory={};S.plan=null}}
 else Object.assign(S,x)
 if(!S.week)S.week=defaultWeek;if(!S.demand)S.demand=[];if(!S.inventory)S.inventory={};
}catch(e){}}
function go(p){S.page=p;render()}function render(){save();({home,master,week,demand,inventory,plan,help}[S.page]||home)()}
function home(){app.innerHTML=`<div class="card"><h2>今週の計画</h2><p class="small">前回までの登録情報をそのまま使い、週次計画に必要な項目だけ入力します。</p>
<button onclick="go('week')">① 稼働時間を設定</button><button onclick="go('demand')">② 需要予測を入力</button><button onclick="go('inventory')">③ 在庫を入力</button><button class="green" onclick="makePlan()">④ 計画を作成</button></div>
<div class="card"><h2>マスター</h2><button class="secondary" onclick="go('master')">登録情報を確認・変更</button></div>
<div class="card"><h2>入力をラクにする機能</h2><div class="small">・平日の設定をまとめて適用<br>・前週の需要をコピーして変更分だけ修正<br>・ライン標準値を自動適用<br>・商品×ラインの例外だけ個別設定<br>・不足時は残業・休日・ライン振替の候補を提示</div></div>`}
function master(){app.innerHTML=`<div class="card"><h2>マスター確認</h2><div class="item">原料：${S.materials.length}件</div><div class="item">商品：${S.products.length}件</div><div class="item">ライン：${S.lines.length}件</div><div class="item">原料切替ルール：${S.rules.length}件</div><div class="item">商品別段取り例外：${S.overrides.length}件</div><div class="item">商品×ライン個別設定：${S.pairOverrides.length}件</div><button class="secondary" onclick="go('home')">戻る</button></div>`}
function week(){
 let w=S.week||defaultWeek;
 app.innerHTML=`<div class="card"><h2>① 曜日ごとの稼働時間</h2><p class="small">前回設定を初期値として使用。平日一括設定もできます。</p>
 <div class="grid2"><button onclick="applyWeekday()">平日をまとめて設定</button><button class="secondary" onclick="resetWeek()">標準設定に戻す</button></div>
 ${w.map((x,i)=>`<div class="day"><b>${x.day}</b><label>開始<input type="time" value="${x.start}" onchange="setDay(${i},'start',this.value)"></label><label>終了<input type="time" value="${x.end}" onchange="setDay(${i},'end',this.value)"></label><label class="check"><input type="checkbox" ${x.on?'checked':''} onchange="setDay(${i},'on',this.checked)">稼働</label></div>
 <div class="grid2"><label>休憩（分）<input type="number" inputmode="numeric" value="${x.break}" onchange="setDay(${i},'break',+this.value||0)"></label><label class="check"><input type="checkbox" ${x.overtime?'checked':''} onchange="setDay(${i},'overtime',this.checked)">延長候補にする</label></div>`).join("")}
 <button class="green" onclick="go('demand')">次へ：需要予測</button><button class="secondary" onclick="go('home')">戻る</button></div>`}
function setDay(i,k,v){S.week[i][k]=v;save()}
function applyWeekday(){let st=prompt("平日の開始時刻","08:00");if(st===null)return;let en=prompt("平日の終了時刻","17:00");if(en===null)return;let br=prompt("平日の休憩時間（分）","60");if(br===null)return;S.week.forEach((x,i)=>{if(i<5){x.on=true;x.start=st;x.end=en;x.break=+br||0}});render()}
function resetWeek(){S.week=JSON.parse(JSON.stringify(defaultWeek));render()}
function demand(){
 let rows=S.products.map(p=>{let d=S.demand.find(x=>x.product===p.name);return `<div class="item"><b>${p.name}</b><label>今週の需要予測（個）<input id="d_${encodeURIComponent(p.name)}" type="number" inputmode="numeric" value="${d?d.qty:0}" onchange="setDemand('${esc(p.name)}',this.value)"></label></div>`}).join("");
 app.innerHTML=`<div class="card"><h2>② 週次需要予測</h2><p class="small">前回値を残しているので、変更がある商品だけ直せます。未入力は0として扱います。</p>${rows||'<div class="box">商品を先に登録してください。</div>'}
 <button class="secondary" onclick="copyLastWeek()">前週の需要をコピー</button><button class="green" onclick="go('inventory')">次へ：在庫</button><button class="secondary" onclick="go('home')">戻る</button></div>`}
function esc(s){return s.replace(/\\/g,"\\\\").replace(/'/g,"\\'")}
function setDemand(p,v){let i=S.demand.findIndex(x=>x.product===p),o={product:p,qty:+v||0};if(i>=0)S.demand[i]=o;else S.demand.push(o);save()}
function copyLastWeek(){alert("この試作版では、直前に保存した需要値をそのまま再利用できます。必要な商品だけ修正してください。")}
function inventory(){
 let rows=S.products.map(p=>`<div class="item"><b>${p.name}</b><label>現在庫（個）<input type="number" inputmode="numeric" value="${S.inventory[p.name]||0}" onchange="setInv('${esc(p.name)}',this.value)"></label></div>`).join("");
 app.innerHTML=`<div class="card"><h2>③ 現在庫</h2><p class="small">需要から在庫を差し引いて必要生産数を計算します。</p>${rows||'<div class="box">商品を先に登録してください。</div>'}
 <button class="green" onclick="makePlan()">計画を作成</button><button class="secondary" onclick="go('home')">戻る</button></div>`}
function setInv(p,v){S.inventory[p]=+v||0;save()}
function hoursForDay(x){if(!x.on)return 0;let a=x.start.split(":").map(Number),b=x.end.split(":").map(Number);let mins=(b[0]*60+b[1])-(a[0]*60+a[1])-x.break;return Math.max(0,mins)/60}
function capacityFor(p,line){let o=S.pairOverrides.find(x=>x.product===p&&x.line===line),l=S.lines.find(x=>x.name===line);return o?o.capacity:(l?l.capacity:0)}
function lotFor(p,line){let o=S.pairOverrides.find(x=>x.product===p&&x.line===line),l=S.lines.find(x=>x.name===line);return o?o.lot:(l?l.lot:0)}
function makePlan(){
 if(!S.products.length||!S.lines.length){alert("商品とラインを登録してください。");return}
 let need=S.products.map(p=>{let d=(S.demand.find(x=>x.product===p.name)||{}).qty||0,inv=S.inventory[p.name]||0;return {product:p.name,demand:d,inventory:inv,need:Math.max(0,d-inv)}}).filter(x=>x.need>0);
 let totalHours=0, assignments=[], remaining=need.map(x=>({...x}));
 // Greedy assignment: highest capacity eligible line, respecting minimum lot.
 for(const r of remaining){
   let opts=S.lines.map(l=>({line:l.name,cap:capacityFor(r.product,l.name),lot:lotFor(r.product,l.name)})).filter(x=>x.cap>0);
   if(!opts.length){assignments.push({product:r.product,line:"未割当",qty:r.need,hours:0,reason:"生産可能ラインなし"});continue}
   opts.sort((a,b)=>b.cap-a.cap);let o=opts[0],qty=Math.max(r.need,o.lot||0),h=qty/o.cap;assignments.push({product:r.product,line:o.line,qty,hours:h,reason:"標準/個別能力を適用"});totalHours+=h;
 }
 let avail=S.week.reduce((a,x)=>a+hoursForDay(x),0)*S.lines.length;
 let gap=totalHours-avail;
 S.plan={need,assignments,totalHours,avail,gap};go('plan')
}
function plan(){
 if(!S.plan)return makePlan();let p=S.plan,ratio=p.avail?p.totalHours/p.avail:0;
 let advice=[];
 if(p.gap>0){
   advice.push(`不足：約${p.gap.toFixed(1)}時間`);
   let ext=S.week.filter(x=>x.overtime).length;
   if(ext)advice.push(`延長候補の曜日：${S.week.filter(x=>x.overtime).map(x=>x.day).join("・")}`);
   let off=S.week.filter(x=>!x.on).length;if(off)advice.push(`休日稼働候補：${S.week.filter(x=>!x.on).map(x=>x.day).join("・")}`);
   advice.push("能力の高いラインへの振替、稼働時間延長、休日稼働、需要の前倒しを比較してください。");
 }else advice.push(`余力：約${Math.abs(p.gap).toFixed(1)}時間`);
 app.innerHTML=`<div class="card"><h2>④ 週次計画結果</h2><div class="result">${p.gap>0?'⚠️ 現在条件では不足':'✅ 現在条件で対応可能'}</div><div class="box">必要生産時間：${p.totalHours.toFixed(1)}時間<br>全ラインの稼働可能時間：${p.avail.toFixed(1)}時間<br>${p.gap>0?'不足':'余力'}：${Math.abs(p.gap).toFixed(1)}時間</div>
 <div class="bar"><i style="width:${Math.min(100,ratio*100)}%"></i></div><div class="small">必要時間 ÷ 利用可能時間：${(ratio*100).toFixed(0)}%</div></div>
 <div class="card"><h2>生産候補</h2><table class="table"><tr><th>商品</th><th>必要数</th><th>割当ライン</th><th>時間</th></tr>${p.assignments.map(a=>`<tr><td>${a.product}</td><td>${a.qty}</td><td>${a.line}</td><td>${a.hours.toFixed(1)}h</td></tr>`).join("")}</table></div>
 <div class="card"><h2>改善・確認ポイント</h2>${advice.map(x=>`<div class="item">${x}</div>`).join("")}<p class="small">※このv6は計画エンジンの初版です。段取り時間を含む日別・ライン別の最適順序は次の段階で精度を上げます。</p>
 <button onclick="go('week')">稼働条件を変更</button><button onclick="go('demand')">需要予測を修正</button><button onclick="go('inventory')">在庫を修正</button><button class="secondary" onclick="go('home')">ホーム</button></div>`}
function help(){app.innerHTML=`<div class="card"><h2>使い方</h2><p>1. マスターを登録 → 2. 稼働時間 → 3. 需要 → 4. 在庫 → 5. 計画作成。</p><p class="small">標準値は繰り返し入力せず、商品ごとの例外だけ変更する設計です。</p><button onclick="go('home')">戻る</button></div>`}
load();render();
</script></main>
<script>
/* ===== v7 enhancements ===== */
function masterEdit(){
 app.innerHTML=`<div class="card"><h2>マスター管理</h2>
 <p class="small">登録後もいつでも修正できます。既存データを消さずに変更する設計です。</p>
 <button onclick="go('materials')">原料を編集</button>
 <button onclick="go('products')">商品を編集</button>
 <button onclick="go('lines')">ラインを編集</button>
 <button onclick="go('rules')">原料切替ルールを編集</button>
 <button onclick="go('setupTable')">商品間の段取りを編集</button>
 <button onclick="go('pairSettings')">商品×ライン能力・ロット</button>
 <button class="secondary" onclick="go('home')">戻る</button></div>`;
}
function v7Home(){
 app.innerHTML=`<div class="card"><h2>今週の生産計画</h2>
 <p class="small">毎週の入力は「需要・在庫・変更された稼働条件」だけ。登録済みの標準値を自動利用します。</p>
 <button onclick="go('week')">① 稼働時間を確認</button>
 <button onclick="go('demand')">② 需要予測を入力</button>
 <button onclick="go('inventory')">③ 在庫を入力</button>
 <button class="green" onclick="makeDetailedPlan()">④ 日別計画を作成</button></div>
 <div class="card"><h2>マスター</h2><button class="secondary" onclick="masterEdit()">マスターを修正・追加</button></div>
 <div class="card"><h2>今回の計画ロジック</h2>
 <div class="small">①必要生産数を計算 → ②生産可能ラインを判定 → ③最低ロットを考慮 → ④同じ原料の商品をまとめる → ⑤禁止されている切替を避ける → ⑥段取り時間を差し引く → ⑦日別・ライン別に割り付け → ⑧不足なら改善案を提示</div></div>`;
}
function materialRule(from,to){
 if(from===to)return {mode:"time",minutes:0};
 return S.rules.find(x=>x.from===from&&x.to===to)||{mode:"conditional",minutes:0};
}
function setupTime(a,b){
 if(a===b)return {mode:"time",minutes:0,source:"同一商品"};
 let ov=S.overrides.find(x=>x.from===a&&x.to===b);
 if(ov)return {...ov,source:"商品別修正"};
 let pa=S.products.find(x=>x.name===a),pb=S.products.find(x=>x.name===b);
 if(!pa||!pb)return {mode:"conditional",minutes:0,source:"情報不足"};
 let r=materialRule(pa.material,pb.material);
 return {...r,source:"原料ルール"};
}
function productOptions(product){
 return S.lines.map(l=>{
   let cap=capacityFor(product,l.name),lot=lotFor(product,l.name);
   return {line:l.name,cap,lot,workers:l.workers};
 }).filter(x=>x.cap>0);
}
function makeDetailedPlan(){
 if(!S.products.length||!S.lines.length){alert("商品とラインを登録してください。");return}
 let needs=S.products.map(p=>{
   let d=(S.demand.find(x=>x.product===p.name)||{}).qty||0, inv=S.inventory[p.name]||0;
   return {product:p.name,demand:d,inventory:inv,need:Math.max(0,d-inv),material:p.material};
 }).filter(x=>x.need>0);
 if(!needs.length){S.plan={days:[],needs:[],totalHours:0,avail:0,gap:0,advice:["今週は在庫で需要を満たせるため、生産不要です。"]};go('plan');return}
 let days=S.week.map(x=>({...x,free:hoursForDay(x),slots:[]})).filter(x=>x.on&&x.free>0);
 if(!days.length){alert("稼働可能な曜日がありません。");return}
 let remaining=needs.map(x=>({...x}));
 // 商品を「同じ原料」でまとめるため、原料→商品群の順に処理
 let groups=[];
 for(const r of remaining){
   let g=groups.find(x=>x.material===r.material); if(g)g.items.push(r); else groups.push({material:r.material,items:[r]});
 }
 let assignments=[], warnings=[];
 for(const g of groups){
   for(const r of g.items){
     let opts=productOptions(r.product).sort((a,b)=>b.cap-a.cap);
     if(!opts.length){warnings.push(`${r.product}：生産可能ラインがありません`);continue}
     let o=opts[0], qty=Math.max(r.need,o.lot||0), hours=qty/o.cap;
     let left=hours;
     while(left>0.0001){
       let d=days.find(x=>x.free>0);
       if(!d){warnings.push(`${r.product}：${left.toFixed(1)}時間分を割り付けできません`);break}
       let prev=d.slots.length?d.slots[d.slots.length-1]:null;
       let st=prev?setupTime(prev.product,r.product):{mode:"time",minutes:0,source:""};
       if(st.mode==="impossible"){
         // 次の稼働日へ
         let idx=days.indexOf(d), nd=days.slice(idx+1).find(x=>x.free>0);
         if(nd){d=nd;prev=d.slots.length?d.slots[d.slots.length-1]:null;st=prev?setupTime(prev.product,r.product):{mode:"time",minutes:0};}
         else {warnings.push(`${r.product}：${st.source||"禁止された切替"}のため順序を組めません`);break}
       }
       let setupH=(st.minutes||0)/60;
       if(setupH>=d.free && d.slots.length){
         let idx=days.indexOf(d),nd=days.slice(idx+1).find(x=>x.free>0);
         if(!nd){warnings.push(`${r.product}：段取り時間を確保できません`);break}
         d=nd;prev=d.slots.length?d.slots[d.slots.length-1]:null;st=prev?setupTime(prev.product,r.product):{mode:"time",minutes:0};setupH=(st.minutes||0)/60;
       }
       let usable=Math.max(0,d.free-setupH),run=Math.min(left,usable);
       if(run<=0){d.free=0;continue}
       let qtyPart=Math.round(run*o.cap);
       if(qtyPart<=0){d.free=0;continue}
       d.slots.push({product:r.product,line:o.line,qty:qtyPart,hours:run,setup:st.minutes||0,source:st.source||""});
       d.free-=run+setupH; left-=run;
     }
   }
 }
 let avail=S.week.reduce((a,x)=>a+hoursForDay(x),0)*S.lines.length;
 let used=days.reduce((a,d)=>a+(d.slots||[]).reduce((b,s)=>b+s.hours+(s.setup||0)/60,0),0);
 let needH=remaining.reduce((a,r)=>{let o=productOptions(r.product)[0];return a+(o?r.need/o.cap:0)},0);
 let gap=needH-used;
 let advice=[];
 if(warnings.length)advice.push(...warnings);
 if(gap>0.01){
   let ext=S.week.filter(x=>x.overtime).map(x=>x.day);
   if(ext.length)advice.push(`延長候補：${ext.join("・")}曜日。約${gap.toFixed(1)}時間の追加余力が必要です。`);
   let off=S.week.filter(x=>!x.on).map(x=>x.day);if(off.length)advice.push(`休日稼働候補：${off.join("・")}曜日。`);
   advice.push("生産能力の高いラインへの振替、稼働時間延長、休日稼働、需要の前倒しを比較してください。");
 }else if(gap<0)advice.push(`約${Math.abs(gap).toFixed(1)}時間の余力があります。前倒し生産や追加生産を検討できます。`);
 S.plan={days,needs,needH,used,avail,gap,advice};
 go('plan');
}
function plan(){
 if(!S.plan){makeDetailedPlan();return}
 let p=S.plan;
 let dayHtml=p.days.map(d=>`<div class="card"><h3>${d.day}曜日 <span class="badge ${d.free>=0?'greenb':'red'}">残り${Math.max(0,d.free).toFixed(1)}h</span></h3>
 ${d.slots.length?`<table class="table"><tr><th>順番</th><th>ライン</th><th>商品</th><th>数量</th><th>段取り</th><th>稼働</th></tr>${d.slots.map((s,i)=>`<tr><td>${i+1}</td><td>${s.line}</td><td>${s.product}</td><td>${s.qty}</td><td>${s.setup?s.setup+'分':'-'}</td><td>${s.hours.toFixed(1)}h</td></tr>`).join("")}</table>`:'<div class="small">生産なし</div>'}</div>`).join("");
