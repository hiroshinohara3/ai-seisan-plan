<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb"><title>AI生産計画 v3</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#2563eb;color:white;padding:calc(18px + env(safe-area-inset-top)) 18px 18px;position:sticky;top:0;z-index:5}
h1{font-size:22px;margin:0 0 4px}.sub{font-size:13px;opacity:.9}main{max-width:760px;margin:auto;padding:14px 14px 100px}
.card{background:#fff;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 2px 10px #00000010}
h2{font-size:19px;margin:0 0 10px}h3{font-size:16px;margin:16px 0 8px}.small{font-size:12px;color:#6b7280}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 5px}
input,select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;background:#fff}
button{width:100%;border:0;border-radius:11px;padding:13px 16px;margin-top:10px;font-size:16px;font-weight:600;background:#2563eb;color:#fff}
button.secondary{background:#e5e7eb;color:#111827}button.danger{background:#dc2626}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.box{background:#f9fafb;border-radius:12px;padding:12px;margin-top:9px}.item{border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin:8px 0}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.actions button{margin:0;padding:10px;font-size:14px}
.checkgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check{border:1px solid #ddd;border-radius:10px;padding:10px}.check input{width:auto}
</style></head>
<body><header><h1>AI生産計画 v3</h1><div class="sub">工場の生産能力を登録・編集する</div></header><main id="app"></main>
<script>
const S={page:"home",products:[],lines:[],pairs:[],setups:[]};
const app=document.getElementById("app");
function save(){localStorage.setItem("aiSeisanV3",JSON.stringify(S))}
function load(){try{const x=JSON.parse(localStorage.getItem("aiSeisanV3")||"null");if(x)Object.assign(S,x)}catch(e){}}
function go(p){S.page=p;render()}
function render(){save();({home,products,lines,pairs,setups}[S.page]||home)()}
function home(){app.innerHTML=`<div class="card"><h2>登録情報</h2><p class="small">登録した情報はこのiPhoneのブラウザに保存されます。</p><button onclick="go('products')">① アイテム登録・編集</button><button onclick="go('lines')">② ライン登録・編集</button><button onclick="go('pairs')">③ アイテム×ライン能力</button><button onclick="go('setups')">④ 段取り替え時間</button></div><div class="card"><b>登録状況</b><div class="box">アイテム：${S.products.length}件<br>ライン：${S.lines.length}件<br>組み合わせ：${S.pairs.length}件<br>段取り：${S.setups.length}件</div></div>`}
function products(){app.innerHTML=`<div class="card"><h2>① アイテム登録・編集</h2>${S.products.map((p,i)=>`<div class="item"><b>${p.name}</b><div class="small">最低生産ロット：${p.lot||"未設定"}個</div><div class="actions"><button onclick="editP(${i})">✏️ 編集</button><button class="danger" onclick="delP(${i})">🗑️ 削除</button></div></div>`).join("")}<h3>新しいアイテム</h3><label>アイテム名</label><input id="pn" placeholder="例：唐揚げ弁当"><label>最低生産ロット（任意）</label><input id="pl" type="number" inputmode="numeric" placeholder="例：1000"><button onclick="addP()">登録</button><button class="secondary" onclick="go('home')">戻る</button></div>`}
function addP(){let n=pn.value.trim(),l=+pl.value||0;if(!n)return alert("アイテム名を入力してください");S.products.push({name:n,lot:l});render()}
function editP(i){let p=S.products[i],n=prompt("アイテム名",p.name);if(n===null)return;let l=prompt("最低生産ロット（個）",p.lot||"");if(l===null)return;p.name=n.trim()||p.name;p.lot=+l||0;S.pairs.forEach(x=>{if(x.product===arguments[0]){}});render()}
function delP(i){if(!confirm("このアイテムを削除しますか？関連する能力・段取り登録も削除されます。"))return;let n=S.products[i].name;S.products.splice(i,1);S.pairs=S.pairs.filter(x=>x.product!==n);S.setups=S.setups.filter(x=>x.from!==n&&x.to!==n);render()}
function lines(){app.innerHTML=`<div class="card"><h2>② ライン登録・編集</h2>${S.lines.map((l,i)=>`<div class="item"><b>${l.name}</b><div class="small">基本必要人数：${l.workers}人</div><div class="actions"><button onclick="editL(${i})">✏️ 編集</button><button class="danger" onclick="delL(${i})">🗑️ 削除</button></div></div>`).join("")}<h3>新しいライン</h3><label>ライン名</label><input id="ln" placeholder="例：1号ライン"><label>基本必要人数</label><input id="lw" type="number" inputmode="numeric" placeholder="例：4"><button onclick="addL()">登録</button><button class="secondary" onclick="go('home')">戻る</button></div>`}
function addL(){let n=ln.value.trim(),w=+lw.value;if(!n||!w)return alert("ライン名と人数を入力してください");S.lines.push({name:n,workers:w});render()}
function editL(i){let l=S.lines[i],n=prompt("ライン名",l.name);if(n===null)return;let w=prompt("基本必要人数",l.workers);if(w===null)return;l.name=n.trim()||l.name;l.workers=+w||l.workers;render()}
function delL(i){if(!confirm("このラインを削除しますか？関連する能力登録も削除されます。"))return;let n=S.lines[i].name;S.lines.splice(i,1);S.pairs=S.pairs.filter(x=>x.line!==n);render()}
function pairs(){app.innerHTML=`<div class="card"><h2>③ アイテム×ライン能力</h2><p class="small">「このアイテムを、このラインで作れるか」と、そのラインでの能力を登録します。</p>${S.pairs.map((x,i)=>`<div class="item"><b>${x.product} × ${x.line}</b><div class="small">${x.capacity} 個/時</div><div class="actions"><button onclick="editPair(${i})">✏️ 編集</button><button class="danger" onclick="delPair(${i})">🗑️ 削除</button></div></div>`).join("")}<h3>組み合わせを追加</h3><label>アイテム</label><select id="pp">${S.products.map(p=>`<option>${p.name}</option>`).join("")}</select><label>ライン</label><select id="ll">${S.lines.map(l=>`<option>${l.name}</option>`).join("")}</select><label>生産能力（個/時）</label><input id="pc" type="number" inputmode="decimal" placeholder="例：500"><button onclick="addPair()">登録</button><button class="secondary" onclick="go('home')">戻る</button></div>`}
function addPair(){if(!S.products.length||!S.lines.length)return alert("先にアイテムとラインを登録してください");let p=pp.value,l=ll.value,c=+pc.value;if(!c)return alert("生産能力を入力してください");if(S.pairs.some(x=>x.product===p&&x.line===l))return alert("その組み合わせは登録済みです");S.pairs.push({product:p,line:l,capacity:c});render()}
function editPair(i){let x=S.pairs[i],c=prompt("生産能力（個/時）",x.capacity);if(c===null)return;x.capacity=+c||x.capacity;render()}
function delPair(i){if(confirm("この能力登録を削除しますか？")){S.pairs.splice(i,1);render()}}
function setups(){app.innerHTML=`<div class="card"><h2>④ 段取り替え時間</h2><p class="small">商品を切り替えるときに必要な時間を登録します。後から編集・削除できます。</p>${S.setups.map((x,i)=>`<div class="item"><b>${x.from} → ${x.to}</b><div class="small">${x.minutes}分</div><div class="actions"><button onclick="editSetup(${i})">✏️ 編集</button><button class="danger" onclick="delSetup(${i})">🗑️ 削除</button></div></div>`).join("")}<h3>段取りを追加</h3><div class="row"><div><label>変更前</label><select id="sf">${S.products.map(p=>`<option>${p.name}</option>`).join("")}</select></div><div><label>変更後</label><select id="st">${S.products.map(p=>`<option>${p.name}</option>`).join("")}</select></div></div><label>段取り時間（分）</label><input id="sm" type="number" inputmode="numeric" placeholder="例：30"><button onclick="addSetup()">登録</button><button class="secondary" onclick="go('home')">戻る</button></div>`}
function addSetup(){let f=sf.value,t=st.value,m=+sm.value;if(!f||!t||!m)return alert("入力してください");if(f===t)return alert("変更前と変更後は別のアイテムにしてください");S.setups.push({from:f,to:t,minutes:m});render()}
function editSetup(i){let m=prompt("段取り時間（分）",S.setups[i].minutes);if(m===null)return;S.setups[i].minutes=+m||S.setups[i].minutes;render()}
function delSetup(i){if(confirm("この段取り登録を削除しますか？")){S.setups.splice(i,1);render()}}
load();render();
</script></body></html>
