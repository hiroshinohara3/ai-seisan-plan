<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI生産計画 v13</title>
<style>
body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
header{background:#1d4ed8;color:#fff;padding:20px 16px}.title{font-size:22px;font-weight:800}.sub{font-size:12px}
main{max-width:820px;margin:auto;padding:12px 12px 80px}.card{background:#fff;border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 2px 8px rgba(0,0,0,.06)}
button{display:block;width:100%;border:0;border-radius:11px;padding:14px;margin:8px 0;background:#2563eb;color:#fff;font-size:16px;font-weight:700}
.gray{background:#e5e7eb;color:#111827}.green{background:#16a34a}.red{background:#dc2626}
input,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;background:#fff}
label{display:block;font-size:13px;font-weight:700;margin:10px 0 4px}.item{border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin:8px 0}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions button{margin:0;padding:10px;font-size:14px}
.small{font-size:12px;color:#6b7280}.hint{background:#f9fafb;border-radius:10px;padding:10px;font-size:12px;color:#4b5563}
</style>
</head>
<body>
<header><div class="title">AI生産計画 v13</div><div class="sub">原料登録を確実に動かす確認版</div></header>
<main id="app"></main>
<script>
"use strict";
var app=document.getElementById("app");
var materials=[];
try{materials=JSON.parse(localStorage.getItem("aiSeisanV13_materials")||"[]");if(!Array.isArray(materials))materials=[];}catch(e){materials=[];}

function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function home(){
app.innerHTML=
'<div class="card"><h2>マスター管理</h2>'+
'<p class="hint">まず「原料」の新規登録が正常に動くことを確認します。</p>'+
'<button id="materialBtn">原料を登録・修正</button>'+
'<button class="gray" id="futureBtn">商品・ラインなど（次の段階）</button></div>'+
'<div class="card"><h2>今週の生産計画</h2><p class="small">マスター登録確認後に機能を戻していきます。</p></div>';
document.getElementById("materialBtn").addEventListener("click",function(){materialsPage();});
document.getElementById("futureBtn").addEventListener("click",function(){alert("まず原料登録を完成させます。");});
}

function materialsPage(){
var html='<div class="card"><h2>原料</h2>';
if(materials.length===0)html+='<p class="small">まだ原料が登録されていません。</p>';
for(var i=0;i<materials.length;i++){
html+='<div class="item"><b>'+esc(materials[i].name)+'</b>'+
'<div class="actions"><button data-edit="'+i+'">編集</button><button class="red" data-del="'+i+'">削除</button></div></div>';
}
html+='<button class="green" id="newMaterial">＋新規登録</button><button class="gray" id="backHome">戻る</button></div>';
app.innerHTML=html;

document.getElementById("newMaterial").addEventListener("click",function(){newMaterial();});
document.getElementById("backHome").addEventListener("click",function(){home();});
var edits=document.querySelectorAll("[data-edit]");
for(var j=0;j<edits.length;j++)edits[j].addEventListener("click",function(){editMaterial(Number(this.getAttribute("data-edit")));});
var dels=document.querySelectorAll("[data-del]");
for(var k=0;k<dels.length;k++)dels[k].addEventListener("click",function(){deleteMaterial(Number(this.getAttribute("data-del")));});
}

function newMaterial(){editMaterial(-1);}
function editMaterial(index){
var value=index>=0?materials[index].name:"";
app.innerHTML='<div class="card"><h2>'+(index<0?"原料を新規登録":"原料を編集")+'</h2>'+
'<label>原料名<input id="materialName" type="text" value="'+esc(value)+'" placeholder="例：A原料"></label>'+
'<button class="green" id="saveMaterial">保存</button>'+
'<button class="gray" id="cancelMaterial">キャンセル</button></div>';
document.getElementById("saveMaterial").addEventListener("click",function(){
var name=document.getElementById("materialName").value.trim();
if(!name){alert("原料名を入力してください。");return;}
if(index<0)materials.push({name:name});else materials[index]={name:name};
try{localStorage.setItem("aiSeisanV13_materials",JSON.stringify(materials));}catch(e){}
materialsPage();
});
document.getElementById("cancelMaterial").addEventListener("click",function(){materialsPage();});
setTimeout(function(){document.getElementById("materialName").focus();},50);
}

function deleteMaterial(index){
if(!confirm("「"+materials[index].name+"」を削除しますか？"))return;
materials.splice(index,1);
try{localStorage.setItem("aiSeisanV13_materials",JSON.stringify(materials));}catch(e){}
materialsPage();
}

home();
</script>
</body>
</html>
