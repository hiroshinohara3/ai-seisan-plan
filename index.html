<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>AI生産計画 v10</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#2563eb;color:#fff;padding:calc(16px + env(safe-area-inset-top)) 16px 16px}
h1{font-size:21px;margin:0 0 3px}.sub{font-size:12px;opacity:.9}
main{max-width:820px;margin:auto;padding:12px 12px 100px}
.card{background:#fff;border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 2px 9px #0000000d}
h2{font-size:18px;margin:0 0 8px}h3{font-size:15px;margin:14px 0 7px}
.small{font-size:12px;color:#6b7280}.hint{font-size:12px;color:#4b5563;background:#f9fafb;border-radius:10px;padding:10px;margin:8px 0}
label{display:block;font-size:12px;font-weight:700;margin:9px 0 4px}
input,select{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;background:#fff}
button{width:100%;border:0;border-radius:10px;padding:12px;margin-top:8px;font-size:15px;font-weight:700;background:#2563eb;color:#fff}
button.secondary{background:#e5e7eb;color:#111827}button.green{background:#16a34a}button.danger{background:#dc2626}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.day{display:grid;grid-template-columns:38px 1fr 1fr 70px;gap:7px;align-items:end;margin:7px 0}
.day b{padding:12px 0}.day input{min-width:0}
.check{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600}.check input{width:auto}
.item{border:1px solid #e5e7eb;border-radius:12px;padding:11px;margin:7px 0}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.actions button{margin:0;padding:9px;font-size:13px}
.badge{display:inline-block;padding:4px 7px;border-radius:999px;font-size:11px}.greenb{background:#dcfce7;color:#166534}.red{background:#fee2e2;color:#991b1b}
.result{font-size:17px;font-weight:800}.table{width:100%;border-collapse:collapse;font-size:12px}
.table th,.table td{padding:7px 4px;border-bottom:1px solid #eee;text-align:left}
.notice{padding:10px;border-radius:10px;background:#fff7ed;margin:8px 0;font-size:13px}
.ok{padding:10px;border-radius:10px;background:#ecfdf5;margin:8px 0;font-size:13px}
</style>
</head>
<body>
<header><h1>AI生産計画 v10</h1><div class="sub">需要・在庫・稼働条件から、日別・ライン別の生産計画を提案</div></header>
<main id="app"></main>
<script>
"use strict";

const DAYS=["月","火","水","木","金","土","日"];
const DEFAULT_WEEK=DAYS.map((day,i)=>({day,on:i<5,start:"08:00",end:"17:00",breakMin:60,overtime:false}));

const app=document.getElementById("app");
const emptyState=()=>({
  materials:[], products:[], lines:[], rules:[], setupOverrides:[], pairOverrides:[],
  week:JSON.parse(JSON.stringify(DEFAULT_WEEK)), demand:{}, inventory:{}, plan:null
});
let S=emptyState();

function deepMerge(old){
  const n=emptyState();
  if(!old || typeof old!=="object") return n;
  Object.assign(n,old);
  n.materials=Array.isArray(old.materials)?old.materials:[];
  n.products=Array.isArray(old.products)?old.products:[];
  n.lines=Array.isArray(old.lines)?old.lines:[];
  n.rules=Array.isArray(old.rules)?old.rules:[];
  n.setupOverrides=Array.isArray(old.setupOverrides)?old.setupOverrides:(Array.isArray(old.overrides)?old.overrides:[]);
  n.pairOverrides=Array.isArray(old.pairOverrides)?old.pairOverrides:[];
  n.week=Array.isArray(old.week)?old.week.map((x,i)=>Object.assign({},DEFAULT_WEEK[i],x)):n.week;
  n.demand=Array.isArray(old.demand)?Object.fromEntries(old.demand.map(x=>[x.product,Number(x.qty)||0])):(old.demand&&typeof old.demand==="object"?old.demand:{});
  n.inventory=old.inventory&&typeof old.inventory==="object"?old.inventory:{};
  return n;
}

function loadData(){
  try{
    const keys=["aiSeisanV10","aiSeisanV9","aiSeisanV8","aiSeisanV6","aiSeisanV5"];
    for(const k of keys){
      const raw=localStorage.getItem(k);
      if(raw){S=deepMerge(JSON.parse(raw));break;}
    }
  }catch(e){S=emptyState();}
}
function saveData(){
  try{localStorage.setItem("aiSeisanV10",JSON.stringify(S));}catch(e){}
}
function go(page){S.page=page;render();}
function esc(v){
  return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function render(){
  saveData();
  const pages={home,week,demand,inventory,plan,master,materials,products,lines,rules,setup, pairs};
  const fn=pages[S.page]||home;
  fn();
}
function back(page="home"){go(page)}

function home(){
  app.innerHTML=`
  <div class="card">
    <h2>今週の生産計画</h2>
    <p class="small">最初に今週の稼働条件を確認し、需要・在庫を入力してから計画を作成します。</p>
    <button onclick="go('week')">① 稼働時間を設定</button>
    <button onclick="go('demand')">② 需要予測を入力</button>
    <button onclick="go('inventory')">③ 在庫を入力</button>
    <button class="green" onclick="go('plan')">④ 日別の生産計画を見る・作成</button>
  </div>
  <div class="card">
    <h2>マスター</h2>
    <p class="small">原料・商品・ライン・原料切替・商品別段取り・商品×ライン設定を後から修正できます。</p>
    <button class="secondary" onclick="go('master')">マスターを修正・追加</button>
  </div>`;
}

function master(){
  app.innerHTML=`
  <div class="card"><h2>マスター管理</h2>
    <button onclick="go('materials')">原料を登録・修正</button>
    <button onclick="go('products')">商品を登録・修正</button>
    <button onclick="go('lines')">ラインを登録・修正</button>
    <button onclick="go('rules')">原料切替ルールを登録・修正</button>
    <button onclick="go('setup')">商品間の段取りを登録・修正</button>
    <button onclick="go('pairs')">商品×ライン能力・最低ロット</button>
    <button class="secondary" onclick="back()">戻る</button>
  </div>`;
}

function week(){
  app.innerHTML=`
  <div class="card"><h2>① 曜日ごとの稼働条件</h2>
  <div class="hint">開始・終了・休憩・稼働／休みを入力します。前回の設定は次回も残ります。</div>
  <div class="grid2"><button onclick="setWeekdays()">平日をまとめて設定</button><button class="secondary" onclick="resetWeek()">標準に戻す</button></div>
  ${S.week.map((d,i)=>`
    <div class="day">
      <b>${d.day}</b>
      <label>開始<input type="time" value="${esc(d.start)}" onchange="daySet(${i},'start',this.value)"></label>
      <label>終了<input type="time" value="${esc(d.end)}" onchange="daySet(${i},'end',this.value)"></label>
      <label class="check"><input type="checkbox" ${d.on?"checked":""} onchange="daySet(${i},'on',this.checked)">稼働</label>
    </div>
    <div class="grid2">
      <label>休憩（分）<input type="number" min="0" value="${Number(d.breakMin)||0}" onchange="daySet(${i},'breakMin',this.value)"></label>
      <label class="check"><input type="checkbox" ${d.overtime?"checked":""} onchange="daySet(${i},'overtime',this.checked)">延長候補</label>
    </div>`).join("")}
  <button class="green" onclick="go('demand')">次へ：需要予測</button>
  <button class="secondary" onclick="back()">戻る</button></div>`;
}
function daySet(i,k,v){S.week[i][k]=(k==="breakMin"?Math.max(0,Number(v)||0):v);saveData();}
function setWeekdays(){
  const st=prompt("平日の開始時刻","08:00"); if(st===null)return;
  const en=prompt("平日の終了時刻","17:00"); if(en===null)return;
  const br=prompt("平日の休憩時間（分）","60"); if(br===null)return;
  for(let i=0;i<5;i++){S.week[i].on=true;S.week[i].start=st;S.week[i].end=en;S.week[i].breakMin=Math.max(0,Number(br)||0);}
  render();
}
function resetWeek(){S.week=JSON.parse(JSON.stringify(DEFAULT_WEEK));render();}

function demand(){
  const rows=S.products.map(p=>`
    <div class="item"><b>${esc(p.name)}</b>
      <label>今週の需要予測（個）
        <input type="number" min="0" inputmode="numeric" value="${Number(S.demand[p.name])||0}" onchange="setDemand('${esc(p.name)}',this.value)">
      </label>
    </div>`).join("");
  app.innerHTML=`
  <div class="card"><h2>② 週次需要予測</h2>
  <div class="hint">商品を追加すると、ここにも自動で入力欄が増えます。前回値を残すので変更した商品だけ修正できます。</div>
  ${rows||'<div class="notice">商品がまだありません。先にマスターで商品を登録してください。</div>'}
  <button class="green" onclick="go('inventory')">次へ：在庫</button>
  <button class="secondary" onclick="back()">戻る</button></div>`;
}
function setDemand(p,v){S.demand[p]=Math.max(0,Number(v)||0);saveData();}

function inventory(){
  const rows=S.products.map(p=>`
    <div class="item"><b>${esc(p.name)}</b>
      <label>現在庫（個）
        <input type="number" min="0" inputmode="numeric" value="${Number(S.inventory[p.name])||0}" onchange="setInventory('${esc(p.name)}',this.value)">
      </label>
    </div>`).join("");
  app.innerHTML=`
  <div class="card"><h2>③ 現在庫</h2>
  <div class="hint">必要生産数＝需要予測－現在庫。0未満にはしません。</div>
  ${rows||'<div class="notice">商品がまだありません。先にマスターで商品を登録してください。</div>'}
  <button class="green" onclick="createPlan()">④ 日別の生産計画を作成</button>
  <button class="secondary" onclick="back()">戻る</button></div>`;
}
function setInventory(p,v){S.inventory[p]=Math.max(0,Number(v)||0);saveData();}

function hours(d){
  if(!d.on)return 0;
  const a=(d.start||"08:00").split(":").map(Number), b=(d.end||"17:00").split(":").map(Number);
  const mins=(b[0]*60+b[1])-(a[0]*60+a[1])-Number(d.breakMin||0);
  return Math.max(0,mins/60);
}
function lineCapacity(product,line){
  const ov=S.pairOverrides.find(x=>x.product===product&&x.line===line);
  if(ov && Number(ov.capacity)>0)return Number(ov.capacity);
  const l=S.lines.find(x=>x.name===line);
  return l?Number(l.capacity)||0:0;
}
function lineLot(product,line){
  const ov=S.pairOverrides.find(x=>x.product===product&&x.line===line);
  if(ov && Number(ov.lot)>0)return Number(ov.lot);
  const l=S.lines.find(x=>x.name===line);
  return l?Number(l.lot)||0:0;
}
function productLines(product){
  return S.lines.map(l=>({line:l.name,cap:lineCapacity(product,l.name),lot:lineLot(product,l.name)})).filter(x=>x.cap>0);
}
function setupBetween(from,to){
  if(!from||from===to)return {mode:"time",minutes:0};
  const ov=S.setupOverrides.find(x=>x.from===from&&x.to===to);
  if(ov)return ov;
  const a=S.products.find(x=>x.name===from), b=S.products.find(x=>x.name===to);
  if(!a||!b||a.material===b.material)return {mode:"time",minutes:0};
  return S.rules.find(x=>x.from===a.material&&x.to===b.material)||{mode:"time",minutes:0};
}
function createPlan(){
  if(!S.products.length){alert("商品を1件以上登録してください。");go("products");return;}
  if(!S.lines.length){alert("ラインを1件以上登録してください。");go("lines");return;}
  const needs=S.products.map(p=>({product:p.name,material:p.material,need:Math.max(0,(Number(S.demand[p.name])||0)-(Number(S.inventory[p.name])||0))})).filter(x=>x.need>0);
  if(!needs.length){S.plan={days:[],needs:[],needHours:0,usedHours:0,availableHours:0,gap:0,advice:["今週は在庫で需要を満たせるため、生産不要です。"]};render();return;}
  const days=S.week.filter(d=>d.on&&hours(d)>0).map(d=>Object.assign({},d,{free:hours(d),slots:[]}));
  if(!days.length){alert("稼働可能な曜日がありません。");go("week");return;}
  const warnings=[];
  // 同じ原料をまとめるため、原料ごとに処理
  needs.sort((a,b)=>String(a.material).localeCompare(String(b.material),"ja"));
  for(const n of needs){
    const opts=productLines(n.product).sort((a,b)=>b.cap-a.cap);
    if(!opts.length){warnings.push(`${n.product}：生産可能なラインがありません。`);continue;}
    const o=opts[0];
    let remaining=Math.max(n.need,n.need<o.lot?o.lot:n.need);
    while(remaining>0){
      let placed=false;
      for(const d of days){
        if(d.free<=0)continue;
        const prev=d.slots.length?d.slots[d.slots.length-1]:null;
        const st=prev?setupBetween(prev.product,n.product):{mode:"time",minutes:0};
        if(st.mode==="impossible")continue;
        const setupH=(Number(st.minutes)||0)/60;
        const usable=d.free-setupH;
        if(usable<=0)continue;
        const qty=Math.min(remaining,Math.max(1,Math.floor(usable*o.cap)));
        const run=qty/o.cap;
        if(run<=0)continue;
        d.slots.push({product:n.product,line:o.line,qty,hours:run,setup:Number(st.minutes)||0});
        d.free-=run+setupH;
        remaining-=qty;
        placed=true;
        break;
      }
      if(!placed){warnings.push(`${n.product}：残り${Math.ceil(remaining)}個を今週に割り付けできません。`);break;}
    }
  }
  const needHours=needs.reduce((a,n)=>{const o=productLines(n.product)[0];return a+(o?n.need/o.cap:0);},0);
  const availableHours=S.week.reduce((a,d)=>a+hours(d),0)*Math.max(1,S.lines.length);
  const usedHours=days.reduce((a,d)=>a+d.slots.reduce((b,s)=>b+s.hours+s.setup/60,0),0);
  const gap=needHours-usedHours;
  const advice=[...warnings];
  if(gap>0.05){
    const ext=S.week.filter(d=>d.overtime).map(d=>d.day);
    if(ext.length)advice.push(`延長候補：${ext.join("・")}曜日。約${gap.toFixed(1)}時間の追加余力が必要です。`);
    advice.push("能力の高いラインへの振替、稼働時間延長、休日稼働、需要の前倒しを比較してください。");
  }else if(gap<-0.05){
    advice.push(`約${Math.abs(gap).toFixed(1)}時間の余力があります。前倒し生産や追加生産を検討できます。`);
  }else advice.push("現在の条件で、おおむね計画可能です。");
  S.plan={days,needs,needHours,usedHours,availableHours,gap,advice};
  S.page="plan";render();
}

function plan(){
  if(!S.plan){
    app.innerHTML=`<div class="card"><h2>④ 日別・ライン別 生産計画</h2><p class="small">需要・在庫・稼働条件を入力してから作成します。</p><button class="green" onclick="createPlan()">計画を作成</button><button class="secondary" onclick="back()">戻る</button></div>`;
    return;
  }
  const p=S.plan;
  const status=p.gap>0.05?"⚠️ 現在条件では不足の可能性":"✅ 現在条件で計画可能";
  const days=p.days.map(d=>`
    <div class="card"><h3>${d.day}曜日 <span class="badge greenb">残り${Math.max(0,d.free).toFixed(1)}h</span></h3>
    ${d.slots.length?`<table class="table"><tr><th>順</th><th>ライン</th><th>商品</th><th>数量</th><th>段取り</th><th>稼働</th></tr>
    ${d.slots.map((s,i)=>`<tr><td>${i+1}</td><td>${esc(s.line)}</td><td>${esc(s.product)}</td><td>${s.qty}</td><td>${s.setup?s.setup+"分":"-"}</td><td>${s.hours.toFixed(1)}h</td></tr>`).join("")}</table>`:"<div class='small'>生産なし</div>"}
    </div>`).join("");
  app.innerHTML=`
  <div class="card"><h2>④ 日別・ライン別 生産計画案</h2>
    <div class="result">${status}</div>
    <div class="hint">必要生産時間：約${p.needHours.toFixed(1)}時間<br>計画使用時間：約${p.usedHours.toFixed(1)}時間<br>全ライン稼働可能時間：約${p.availableHours.toFixed(1)}時間</div>
  </div>${days}
  <div class="card"><h2>改善・確認ポイント</h2>${p.advice.map(x=>`<div class="item">${esc(x)}</div>`).join("")}
    <button onclick="go('week')">稼働条件を修正</button><button onclick="go('demand')">需要予測を修正</button><button onclick="go('inventory')">在庫を修正</button>
    <button class="green" onclick="createPlan()">計画を再作成</button><button class="secondary" onclick="back()">ホーム</button>
  </div>`;
}

/* ---- Master editors ---- */
function listPage(kind,title){
  const arr=S[kind]||[];
  let rows=arr.map((o,i)=>{
    let desc="";
    if(kind==="materials")desc="原料";
    if(kind==="products")desc="使用原料："+(o.material||"未設定");
    if(kind==="lines")desc=`能力：${o.capacity||0}個/h　最低ロット：${o.lot||0}個　必要人員：${o.workers||0}人`;
    if(kind==="rules")desc=`${o.mode==="impossible"?"切替不可":"切替可能・"+(o.minutes||0)+"分"}`;
    return `<div class="item"><b>${esc(kind==="rules"?o.from+" → "+o.to:o.name||"登録")}</b><div class="small">${desc}</div>
      <div class="actions"><button onclick="editMaster('${kind}',${i})">編集</button><button class="danger" onclick="removeMaster('${kind}',${i})">削除</button></div></div>`;
  }).join("");
  app.innerHTML=`<div class="card"><h2>${title}</h2>${rows||"<p class='small'>登録がありません。</p>"}
    <button class="green" onclick="editMaster('${kind}',-1)">＋新規登録</button><button class="secondary" onclick="go('master')">戻る</button></div>`;
}
function materials(){listPage("materials","原料");}
function products(){listPage("products","商品");}
function lines(){listPage("lines","ライン");}
function rules(){listPage("rules","原料切替ルール");}

function fields(kind){
  if(kind==="materials")return[{k:"name",l:"原料名",type:"text"}];
  if(kind==="products")return[{k:"name",l:"商品名",type:"text"},{k:"material",l:"使用原料",type:"select",opts:S.materials.map(x=>x.name)}];
  if(kind==="lines")return[{k:"name",l:"ライン名",type:"text"},{k:"capacity",l:"標準1時間能力（個/h）",type:"number"},{k:"lot",l:"標準最低ロット（個）",type:"number"},{k:"workers",l:"必要人員（人）",type:"number"}];
  if(kind==="rules")return[{k:"from",l:"切替元原料",type:"select",opts:S.materials.map(x=>x.name)},{k:"to",l:"切替先原料",type:"select",opts:S.materials.map(x=>x.name)},{k:"mode",l:"切替可否",type:"select",opts:["time","impossible"],labels:["切替可能","切替不可"]},{k:"minutes",l:"段取り時間（分）",type:"number"}];
  return [];
}
function editMaster(kind,idx){
  const old=idx>=0?(S[kind][idx]||{}):{};
  const fs=fields(kind);
  if(kind==="products" && !S.materials.length){alert("先に原料を登録してください。");return;}
  if(kind==="rules" && S.materials.length<2){alert("切替ルールには原料が2種類以上必要です。");return;}
  app.innerHTML=`<div class="card"><h2>${idx<0?"新規登録":"編集"}</h2>
  ${fs.map(f=>{
    const v=old[f.k]??"";
    if(f.type==="select")return `<label>${f.l}<select id="f_${f.k}">${f.opts.map((x,j)=>`<option value="${esc(x)}" ${String(x)===String(v)?"selected":""}>${f.labels?f.labels[j]:esc(x)}</option>`).join("")}</select></label>`;
    return `<label>${f.l}<input id="f_${f.k}" type="${f.type}" min="0" value="${esc(v)}"></label>`;
  }).join("")}
  ${kind==="rules"?'<div class="hint">「切替不可」を選ぶと、この原料間の切替は週間計画に入れません。</div>':""}
  <button class="green" onclick="saveMaster('${kind}',${idx})">保存</button><button class="secondary" onclick="go('${kind==="rules"?"rules":kind}')">キャンセル</button></div>`;
}
function saveMaster(kind,idx){
  const o={};
  for(const f of fields(kind)){
    const e=document.getElementById("f_"+f.k);
    o[f.k]=f.type==="number"?Math.max(0,Number(e.value)||0):e.value;
  }
  if(["materials","products","lines"].includes(kind) && !o.name){alert("名前を入力してください。");return;}
  if(kind==="rules" && o.from===o.to){alert("切替元と切替先は別の原料にしてください。");return;}
  if(kind==="rules" && o.mode==="impossible")o.minutes=0;
  if(idx<0)S[kind].push(o);else S[kind][idx]=o;
  saveData();go(kind);
}
function removeMaster(kind,i){
  if(confirm("この登録を削除しますか？")){S[kind].splice(i,1);saveData();go(kind);}
}

function setup(){
  const rows=S.setupOverrides.map((o,i)=>`<div class="item"><b>${esc(o.from)} → ${esc(o.to)}</b><div class="small">${o.mode==="impossible"?"切替不可":"切替可能・"+(o.minutes||0)+"分"}</div>
    <div class="actions"><button onclick="editSetup(${i})">編集</button><button class="danger" onclick="removeSetup(${i})">削除</button></div></div>`).join("");
  app.innerHTML=`<div class="card"><h2>商品間の段取り</h2><div class="hint">原料切替ルールを標準値として使い、特定の商品間だけ違う場合にここで上書きします。</div>
  ${rows||"<p class='small'>商品別の例外登録はありません。</p>"}
  <button class="green" onclick="editSetup(-1)">＋商品別段取りを登録</button><button class="secondary" onclick="go('master')">戻る</button></div>`;
}
function editSetup(idx){
  if(S.products.length<2){alert("商品を2種類以上登録してください。");return;}
  const o=idx>=0?S.setupOverrides[idx]:{};
  app.innerHTML=`<div class="card"><h2>商品別段取り</h2>
  <label>切替元商品<select id="sf">${S.products.map(p=>`<option ${p.name===o.from?"selected":""}>${esc(p.name)}</option>`).join("")}</select></label>
  <label>切替先商品<select id="st">${S.products.map(p=>`<option ${p.name===o.to?"selected":""}>${esc(p.name)}</option>`).join("")}</select></label>
  <label>切替可否<select id="sm"><option value="time" ${o.mode!=="impossible"?"selected":""}>切替可能</option><option value="impossible" ${o.mode==="impossible"?"selected":""}>切替不可</option></select></label>
  <label>段取り時間（分）<input id="smin" type="number" min="0" value="${Number(o.minutes)||0}"></label>
  <button class="green" onclick="saveSetup(${idx})">保存</button><button class="secondary" onclick="go('setup')">キャンセル</button></div>`;
}
function saveSetup(idx){
  const o={from:document.getElementById("sf").value,to:document.getElementById("st").value,mode:document.getElementById("sm").value,minutes:Math.max(0,Number(document.getElementById("smin").value)||0)};
  if(o.from===o.to){alert("切替元と切替先は別の商品にしてください。");return;}
  if(o.mode==="impossible")o.minutes=0;
  if(idx<0)S.setupOverrides.push(o);else S.setupOverrides[idx]=o;
  saveData();go("setup");
}
function removeSetup(i){if(confirm("この商品別段取りを削除しますか？")){S.setupOverrides.splice(i,1);saveData();go("setup");}}

function pairs(){
  const rows=S.pairOverrides.map((o,i)=>`<div class="item"><b>${esc(o.product)} × ${esc(o.line)}</b><div class="small">能力：${o.capacity||0}個/h　最低ロット：${o.lot||0}個</div>
  <div class="actions"><button onclick="editPair(${i})">編集</button><button class="danger" onclick="removePair(${i})">削除</button></div></div>`).join("");
  app.innerHTML=`<div class="card"><h2>商品×ライン個別設定</h2><div class="hint">未登録の商品はライン標準値を使用します。修正が必要な商品だけ登録してください。</div>
  ${rows||"<p class='small'>個別設定はありません。</p>"}<button class="green" onclick="editPair(-1)">＋個別設定</button><button class="secondary" onclick="go('master')">戻る</button></div>`;
}
function editPair(idx){
  if(!S.products.length||!S.lines.length){alert("先に商品とラインを登録してください。");return;}
  const o=idx>=0?S.pairOverrides[idx]:{};
  app.innerHTML=`<div class="card"><h2>商品×ライン個別設定</h2>
  <label>商品<select id="pp">${S.products.map(p=>`<option ${p.name===o.product?"selected":""}>${esc(p.name)}</option>`).join("")}</select></label>
  <label>ライン<select id="pl">${S.lines.map(l=>`<option ${l.name===o.line?"selected":""}>${esc(l.name)}</option>`).join("")}</select></label>
  <label>1時間能力（個/h）<input id="pc" type="number" min="0" value="${Number(o.capacity)||0}"></label>
  <label>最低ロット（個）<input id="po" type="number" min="0" value="${Number(o.lot)||0}"></label>
  <button class="green" onclick="savePair(${idx})">保存</button><button class="secondary" onclick="go('pairs')">キャンセル</button></div>`;
}
function savePair(idx){
  const o={product:document.getElementById("pp").value,line:document.getElementById("pl").value,capacity:Math.max(0,Number(document.getElementById("pc").value)||0),lot:Math.max(0,Number(document.getElementById("po").value)||0)};
  if(idx<0)S.pairOverrides.push(o);else S.pairOverrides[idx]=o;
  saveData();go("pairs");
}
function removePair(i){if(confirm("この個別設定を削除しますか？")){S.pairOverrides.splice(i,1);saveData();go("pairs");}}

loadData();
S.page="home";
render();
</script>
</main>
</body>
</html>
