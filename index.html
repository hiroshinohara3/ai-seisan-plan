<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI生産計画 v12</title>
<style>
body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
header{background:#1d4ed8;color:#fff;padding:20px 16px}.title{font-size:22px;font-weight:800}.sub{font-size:12px;margin-top:3px}
main{max-width:820px;margin:auto;padding:12px 12px 80px}.card{background:#fff;border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 2px 8px rgba(0,0,0,.06)}
h2{font-size:18px;margin:0 0 8px}h3{font-size:15px;margin:14px 0 6px}.small{font-size:12px;color:#6b7280}
button{display:block;width:100%;border:0;border-radius:11px;padding:13px;margin:8px 0;background:#2563eb;color:#fff;font-size:15px;font-weight:700}
.gray{background:#e5e7eb;color:#111827}.green{background:#16a34a}.red{background:#dc2626}
input,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;background:#fff}
label{display:block;font-size:12px;font-weight:700;margin:9px 0 4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item{border:1px solid #e5e7eb;border-radius:12px;padding:11px;margin:7px 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.actions button{margin:0;padding:9px;font-size:13px}
.ok{background:#ecfdf5;border-radius:10px;padding:10px;font-size:13px}.hint{background:#f9fafb;border-radius:10px;padding:10px;font-size:12px;color:#4b5563}
</style>
</head>
<body>
<header><div class="title">AI生産計画 v12</div><div class="sub">マスター登録・修正を使いやすくした版</div></header>
<main id="app"></main>
<script>
(function(){
"use strict";
var app=document.getElementById("app");
var days=["月","火","水","木","金","土","日"];
var S={materials:[],products:[],lines:[],rules:[],setups:[],pairs:[],week:[],demand:{},inventory:{}};
for(var i=0;i<7;i++)S.week.push({day:days[i],on:i<5,start:"08:00",end:"17:00",breakMin:60,overtime:false});

function load(){
 try{
  var raw=localStorage.getItem("aiSeisanV11")||localStorage.getItem("aiSeisanV10")||localStorage.getItem("aiSeisanV9");
  if(raw){
   var x=JSON.parse(raw);
   if(x&&typeof x==="object")for(var k in x)if(k in S)S[k]=x[k];
   if(!Array.isArray(S.materials))S.materials=[];
   if(!Array.isArray(S.products))S.products=[];
   if(!Array.isArray(S.lines))S.lines=[];
   if(!Array.isArray(S.rules))S.rules=[];
   if(!Array.isArray(S.setups))S.setups=[];
   if(!Array.isArray(S.pairs))S.pairs=[];
  }
 }catch(e){}
}
function save(){try{localStorage.setItem("aiSeisanV12",JSON.stringify(S));}catch(e){}}
function esc(x){return String(x==null?"":x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
window.go=function(p){render(p);};

function home(){
app.innerHTML='<div class="card"><h2>今週の生産計画</h2><p class="small">マスターを登録してから、稼働条件・需要・在庫を入力します。</p>'+
'<button onclick="go(\'week\')">① 稼働時間を設定</button><button onclick="go(\'demand\')">② 需要予測を入力</button><button onclick="go(\'inventory\')">③ 在庫を入力</button><button class="green" onclick="go(\'plan\')">④ 日別の生産計画</button></div>'+
'<div class="card"><h2>マスター</h2><button class="gray" onclick="go(\'master\')">マスターを修正・追加</button></div>';
}

function master(){
app.innerHTML='<div class="card"><h2>マスター管理</h2><p class="hint">登録後もいつでも修正・削除できます。</p>'+
'<button onclick="go(\'materials\')">原料を登録・修正</button><button onclick="go(\'products\')">商品を登録・修正</button><button onclick="go(\'lines\')">ラインを登録・修正</button><button class="gray" onclick="go(\'home\')">戻る</button></div>';
}

function list(type,title){
var a=S[type],s='<div class="card"><h2>'+title+'</h2>';
if(!a.length)s+='<p class="small">まだ登録されていません。</p>';
for(var i=0;i<a.length;i++){
 var o=a[i],desc="";
 if(type==="materials")desc="原料として登録済み";
 if(type==="products")desc="使用原料："+esc(o.material||"未設定");
 if(type==="lines")desc="能力："+(o.capacity||0)+"個/h　最低ロット："+(o.lot||0)+"個　必要人員："+(o.workers||0)+"人";
 s+='<div class="item"><b>'+esc(o.name)+'</b><div class="small">'+desc+'</div><div class="actions"><button onclick="edit(\''+type+'\','+i+')">編集</button><button class="red" onclick="del(\''+type+'\','+i+')">削除</button></div></div>';
}
s+='<button class="green" onclick="edit(\''+type+'\',-1)">＋新規登録</button><button class="gray" onclick="go(\'master\')">戻る</button></div>';
app.innerHTML=s;
}

function edit(type,idx){
var o=idx>=0?S[type][idx]:{};
var s='<div class="card"><h2>'+(idx<0?"新規登録":"編集")+'</h2>';
if(type==="materials")s+='<label>原料名<input id="name" value="'+esc(o.name||"")+'"></label>';
if(type==="products"){
 s+='<label>商品名<input id="name" value="'+esc(o.name||"")+'"></label>';
 s+='<label>使用原料<select id="material">'+S.materials.map(function(m){return '<option '+(m.name===o.material?'selected':'')+'>'+esc(m.name)+'</option>';}).join("")+'</select></label>';
 if(!S.materials.length)s+='<div class="hint">先に原料を登録してください。</div>';
}
if(type==="lines"){
 s+='<label>ライン名<input id="name" value="'+esc(o.name||"")+'"></label>';
 s+='<label>標準1時間能力（個）<input id="capacity" type="number" min="0" value="'+(o.capacity||0)+'"></label>';
 s+='<label>標準最低ロット（個）<input id="lot" type="number" min="0" value="'+(o.lot||0)+'"></label>';
 s+='<label>必要人員（人）<input id="workers" type="number" min="0" value="'+(o.workers||0)+'"></label>';
}
s+='<button class="green" onclick="saveEdit(\''+type+'\','+idx+')">保存</button><button class="gray" onclick="go(\''+type+'\')">キャンセル</button></div>';
app.innerHTML=s;
}
function saveEdit(type,idx){
var o={name:document.getElementById("name").value.trim()};
if(!o.name){alert("名前を入力してください。");return;}
if(type==="products"){
 if(!S.materials.length){alert("先に原料を登録してください。");return;}
 o.material=document.getElementById("material").value;
}
if(type==="lines"){
 o.capacity=Math.max(0,Number(document.getElementById("capacity").value)||0);
 o.lot=Math.max(0,Number(document.getElementById("lot").value)||0);
 o.workers=Math.max(0,Number(document.getElementById("workers").value)||0);
}
if(idx<0)S[type].push(o);else S[type][idx]=o;
save();go(type);
}
function del(type,i){if(confirm("この登録を削除しますか？")){S[type].splice(i,1);save();go(type);}}

function week(){
var s='<div class="card"><h2>① 稼働時間</h2><p class="small">曜日ごとに開始・終了・休憩を設定できます。</p>';
for(var i=0;i<7;i++){var d=S.week[i];
s+='<div class="item"><b>'+d.day+'曜日</b><label><input type="checkbox" '+(d.on?'checked':'')+' onchange="day('+i+',\'on\',this.checked)"> 稼働</label><div class="grid">'+
'<label>開始<input type="time" value="'+d.start+'" onchange="day('+i+',\'start\',this.value)"></label>'+
'<label>終了<input type="time" value="'+d.end+'" onchange="day('+i+',\'end\',this.value)"></label></div>'+
'<label>休憩（分）<input type="number" value="'+(d.breakMin||0)+'" onchange="day('+i+',\'breakMin\',this.value)"></label></div>';
}
s+='<button class="green" onclick="go(\'demand\')">次へ：需要予測</button><button class="gray" onclick="go(\'home\')">戻る</button></div>';app.innerHTML=s;
}
window.day=function(i,k,v){S.week[i][k]=k==="breakMin"?Number(v)||0:v;save();};

function demand(){
var s='<div class="card"><h2>② 需要予測</h2>';
if(!S.products.length)s+='<div class="hint">商品を先にマスター登録してください。</div>';
for(var i=0;i<S.products.length;i++){var n=S.products[i].name;s+='<div class="item"><b>'+esc(n)+'</b><label>今週の需要予測（個）<input type="number" value="'+(S.demand[n]||0)+'" onchange="setD(\''+esc(n)+'\',this.value)"></label></div>';}
s+='<button class="green" onclick="go(\'inventory\')">次へ：在庫</button><button class="gray" onclick="go(\'home\')">戻る</button></div>';app.innerHTML=s;
}
window.setD=function(n,v){S.demand[n]=Number(v)||0;save();};

function inventory(){
var s='<div class="card"><h2>③ 在庫</h2>';
if(!S.products.length)s+='<div class="hint">商品を先にマスター登録してください。</div>';
for(var i=0;i<S.products.length;i++){var n=S.products[i].name;s+='<div class="item"><b>'+esc(n)+'</b><label>現在庫（個）<input type="number" value="'+(S.inventory[n]||0)+'" onchange="setI(\''+esc(n)+'\',this.value)"></label></div>';}
s+='<button class="green" onclick="go(\'plan\')">④ 日別計画へ</button><button class="gray" onclick="go(\'home\')">戻る</button></div>';app.innerHTML=s;
}
window.setI=function(n,v){S.inventory[n]=Number(v)||0;save();};

function plan(){
var s='<div class="card"><h2>④ 日別・ライン別生産計画</h2><div class="ok">計画画面を開けています。</div>';
if(!S.products.length)s+='<p class="small">商品を登録すると、需要－在庫から必要生産数を計算できるようになります。</p>';
else s+='<p class="small">次の版で、ライン能力・最低ロット・段取り・原料切替を使った自動割付を接続します。</p>';
s+='<button class="gray" onclick="go(\'home\')">ホームへ</button></div>';app.innerHTML=s;
}

window.render=function(p){
if(p==="home")home();else if(p==="master")master();else if(p==="materials")list("materials","原料");else if(p==="products")list("products","商品");else if(p==="lines")list("lines","ライン");else if(p==="week")week();else if(p==="demand")demand();else if(p==="inventory")inventory();else if(p==="plan")plan();else home();
};

load();render("home");
})();
</script>
</body>
</html>
