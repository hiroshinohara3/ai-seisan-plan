<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI生産計画 v35.6（需要充足・不足分析版）</title>
<style>
body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#1d4ed8;color:#fff;padding:18px 16px}.title{font-size:22px;font-weight:800;line-height:1.35}header div:last-child{margin-top:6px;font-size:14px}
main{max-width:900px;margin:auto;padding:12px}.card{background:#fff;border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 1px 2px rgba(0,0,0,.04)}
button{width:100%;border:0;border-radius:11px;padding:13px;margin:6px 0;background:#2563eb;color:#fff;font-size:15px;font-weight:700}
.green{background:#16a34a}.orange{background:#ea580c}.gray{background:#e5e7eb;color:#111827}.red{background:#dc2626}.purple{background:#7c3aed}
input,select,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d1d5db;border-radius:10px;font-size:15px;margin-top:4px}
textarea{min-height:110px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.item{border:1px solid #e5e7eb;border-radius:12px;padding:11px;margin:8px 0}.small{font-size:12px;color:#6b7280}.hint{background:#f9fafb;border-radius:10px;padding:10px;font-size:13px;color:#4b5563;line-height:1.6}
.ok{background:#ecfdf5;color:#166534;padding:10px;border-radius:10px}.warn{background:#fff7ed;color:#9a3412;padding:10px;border-radius:10px}.danger{background:#fef2f2;color:#991b1b;padding:10px;border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{border:1px solid #e5e7eb;padding:7px;text-align:right}th:first-child,td:first-child{text-align:left}
.badge{display:inline-block;padding:3px 7px;border-radius:8px;background:#eef2ff;color:#3730a3;font-size:11px;margin:2px}.metric{font-size:20px;font-weight:800}.muted{color:#6b7280}.section-title{font-size:18px;font-weight:800;margin:8px 0}
</style>
</head>
<body>
<header><div class="title">AI生産計画 v35.6（需要充足・不足分析版）</div>
<div>v30を正式基準に、自然な現場コメント・制約・需要不足を汎用的に扱う生産計画</div></header>
<main id="app"></main>
<script>
"use strict";
const DAYS=["月","火","水","木","金","土","日"], app=document.getElementById("app");
const K={lines:"aiSeisan_lines",products:"aiSeisan_products",trans:"aiSeisan_transitionRules",dem:"aiSeisan_planItems",schedules:"aiSeisan_schedules",last:"aiSeisan_lastPlan"};
function load(k,d=[]){try{const x=localStorage.getItem(k);return x?JSON.parse(x):d}catch(e){return d}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
function esc(s){return String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function n(v){const x=Number(v);return Number.isFinite(x)?x:0}
function mins(t){const a=String(t||"").split(":");return a.length===2?n(a[0])*60+n(a[1]):0}
function fmt(v){return Math.round(n(v)*100)/100}
function defaults(){return DAYS.map(d=>({day:d,enabled:["月","火","水","木","金"].includes(d),start:"08:00",end:"17:00",breakMin:60}))}
let lines=load(K.lines,[]),products=load(K.products,[]),transitions=load(K.trans,[]).map(x=>({...x,allowed:x.allowed!==false})),demands=load(K.dem,[]),schedules=load(K.schedules,[]);
function normalize(){
 lines=lines.map(x=>({...x,name:String(x.name||x.lineName||""),capacity:n(x.capacity??x.hourCapacity),lot:n(x.lot??x.minLot),workers:n(x.workers??x.personnel),standardStart:x.standardStart||"08:00",standardEnd:x.standardEnd||"17:00",standardBreak:n(x.standardBreak??60)})).filter(x=>x.name);
 products=products.map(x=>({...x,name:String(x.name||x.product||""),capacityOverride:n(x.capacityOverride),minLotOverride:n(x.minLotOverride)})).filter(x=>x.name);
 schedules=schedules.map(s=>({...s,lineId:n(s.lineId),days:s.days||defaults()}));
 transitions=transitions.map(x=>({...x,allowed:x.allowed!==false,time:n(x.time)}));
}
normalize();
function saveAll(){save(K.lines,lines);save(K.products,products);save(K.trans,transitions);save(K.dem,demands);save(K.schedules,schedules)}
function workMin(d){if(!d||!d.enabled)return 0;let x=mins(d.end)-mins(d.start);if(x<0)x+=1440;return Math.max(0,x-n(d.breakMin))}
function lineSchedule(i){let s=schedules.find(x=>n(x.lineId)===i);if(!s){s={lineId:i,days:defaults()};schedules.push(s);save(K.schedules,schedules)}return s}
function prod(name){return products.find(p=>p.name===name)||{name,capacityOverride:0,minLotOverride:0}}
function cap(line,p){return n(p.capacityOverride)||n(line.capacity)||0}
function lot(line,p){return n(p.minLotOverride)||n(line.lot)||0}
function setup(line,from,to){
 if(!from||from===to)return {time:0,allowed:true};
 let r=transitions.find(x=>(!x.line||x.line===line)&&x.from===from&&x.to===to);
 if(!r)return {time:0,allowed:true};
 return {time:r.allowed===false?Infinity:n(r.time),allowed:r.allowed!==false};
}
function demandRows(){
 return demands.map((d,i)=>{
   const product=String(d.product||d.name||d.productName||"").trim();
   const qty=n(d.quantity??d.qty??d.demand??d.amount);
   return {i,product,qty};
 }).filter(x=>x.product&&x.qty>0);
}
function home(){
 app.innerHTML=`<div class="card"><h2>生産計画</h2>
 <button id="plan">需要から生産案を作成</button>
 <button class="purple" id="eval">現在の計画を評価・不足分析</button>
 <button class="orange" id="adj">最終調整（自然なコメントで再計画）</button></div>
 <div class="card"><h2>マスター</h2>
 <button id="lines">ライン設定</button><button id="prods">製品設定</button>
 <button id="trs">段取り設定</button><button id="dem">需要入力</button>
 <button id="sch">稼働時間設定</button></div>
 <div class="card"><div class="hint"><b>開発基本原則</b><br>
 最低生産数量は倍数制約ではありません。曜日や特定製品の配置に固定せず、全体を比較して計画します。需要を満たせない場合も計画作成を止めず、可能な生産量・不足量・不足率・制約を提示します。</div></div>`;
 document.getElementById("plan").onclick=planPage;document.getElementById("eval").onclick=()=>{let p=load(K.last,[]);if(!p.length)return alert("先に生産案を作成してください");showPlan(p)};document.getElementById("adj").onclick=adjustPage;
 document.getElementById("lines").onclick=linesPage;document.getElementById("prods").onclick=productsPage;document.getElementById("trs").onclick=transPage;document.getElementById("dem").onclick=demandPage;document.getElementById("sch").onclick=schedulePage;
}
function linesPage(){
 let s=`<div class="card"><h2>ライン設定</h2><div class="hint">既存のv30系localStorageを読み込みます。</div>`;
 lines.forEach((x,i)=>s+=`<div class="item"><b>${esc(x.name)}</b><div class="small">${fmt(x.capacity)}個/h・最低生産数量 ${fmt(x.lot)}個・${fmt(x.workers)}人</div><button data-e="${i}">編集</button><button class="red" data-d="${i}">削除</button></div>`);
 s+=`<button class="green" id="new">＋ライン追加</button><button class="gray" id="back">戻る</button></div>`;app.innerHTML=s;
 document.getElementById("new").onclick=()=>lineEdit(-1);document.getElementById("back").onclick=home;
 document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>lineEdit(n(b.dataset.e)));document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{if(confirm("削除しますか？")){lines.splice(n(b.dataset.d),1);saveAll();linesPage()}});
}
function lineEdit(i){
 const x=i>=0?lines[i]:{name:"",capacity:1000,lot:5000,workers:1,standardStart:"08:00",standardEnd:"17:00",standardBreak:60};
 app.innerHTML=`<div class="card"><h2>ライン${i<0?"追加":"編集"}</h2><label>ライン名<input id="name" value="${esc(x.name)}"></label><label>能力（個/時）<input id="cap" type="number" value="${x.capacity}"></label><label>最低生産数量（個）<input id="lot" type="number" value="${x.lot}"></label><label>必要人員<input id="workers" type="number" value="${x.workers}"></label><div class="row"><label>開始<input id="st" type="time" value="${x.standardStart||"08:00"}"></label><label>終了<input id="ed" type="time" value="${x.standardEnd||"17:00"}"></label></div><label>休憩（分）<input id="br" type="number" value="${x.standardBreak??60}"></label><button class="green" id="save">保存</button><button class="gray" id="back">戻る</button></div>`;
 document.getElementById("save").onclick=()=>{let o={...x,name:document.getElementById("name").value.trim(),capacity:n(document.getElementById("cap").value),lot:n(document.getElementById("lot").value),workers:n(document.getElementById("workers").value),standardStart:document.getElementById("st").value,standardEnd:document.getElementById("ed").value,standardBreak:n(document.getElementById("br").value)};if(!o.name)return alert("ライン名を入力");if(i<0)lines.push(o);else lines[i]=o;saveAll();linesPage()};document.getElementById("back").onclick=linesPage;
}
function productsPage(){
 let s=`<div class="card"><h2>製品設定</h2>`;products.forEach((p,i)=>s+=`<div class="item"><b>${esc(p.name)}</b><div class="small">能力:${p.capacityOverride||"ライン標準"}・最低数量:${p.minLotOverride||"ライン標準"}</div><button data-e="${i}">編集</button></div>`);
 s+=`<button class="green" id="new">＋製品追加</button><button class="gray" id="back">戻る</button></div>`;app.innerHTML=s;document.getElementById("new").onclick=()=>productEdit(-1);document.getElementById("back").onclick=home;document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>productEdit(n(b.dataset.e)));
}
function productEdit(i){
 const p=i>=0?products[i]:{name:"",capacityOverride:0,minLotOverride:0};app.innerHTML=`<div class="card"><h2>製品設定</h2><label>製品名<input id="name" value="${esc(p.name)}"></label><label>製品能力（個/時・0=ライン標準）<input id="cap" type="number" value="${p.capacityOverride}"></label><label>最低生産数量（0=ライン標準）<input id="lot" type="number" value="${p.minLotOverride}"></label><button class="green" id="save">保存</button><button class="gray" id="back">戻る</button></div>`;
 document.getElementById("save").onclick=()=>{let o={...p,name:document.getElementById("name").value.trim(),capacityOverride:n(document.getElementById("cap").value),minLotOverride:n(document.getElementById("lot").value)};if(!o.name)return alert("製品名を入力");if(i<0)products.push(o);else products[i]=o;saveAll();productsPage()};document.getElementById("back").onclick=productsPage;
}
function transPage(){
 let s=`<div class="card"><h2>段取り設定</h2><div class="hint">「切替不可能」は明示的に選択できます。切替可否と段取り時間を別管理します。</div>`;
 transitions.forEach((r,i)=>s+=`<div class="item"><b>${esc(r.line||"全ライン")}</b>：${esc(r.from)} → ${esc(r.to)}<div class="small">${r.allowed===false?"切替不可能":"切替可能"} / ${r.allowed===false?"－":fmt(r.time)+"分"}</div><button data-e="${i}">編集</button><button data-d="${i}" class="red">削除</button></div>`);
 s+=`<div class="item"><h3>新しい段取り条件</h3><div class="row"><input id="line" placeholder="ライン（任意）"><input id="from" placeholder="切替前製品"></div><div class="row"><input id="to" placeholder="切替後製品"><input id="time" type="number" min="0" placeholder="段取り時間（分）"></div><label>切替可否<select id="allowed"><option value="yes">切替可能</option><option value="no">切替不可能</option></select></label><button class="green" id="add">追加</button></div><button class="gray" id="back">戻る</button></div>`;app.innerHTML=s;
 document.getElementById("add").onclick=()=>{let from=document.getElementById("from").value.trim(),to=document.getElementById("to").value.trim();if(!from||!to)return alert("切替前・切替後の製品を入力してください");let allowed=document.getElementById("allowed").value==="yes";transitions.push({line:document.getElementById("line").value.trim(),from,to,time:allowed?n(document.getElementById("time").value):0,allowed});saveAll();transPage()};
 document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{transitions.splice(n(b.dataset.d),1);saveAll();transPage()});document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>transitionEdit(n(b.dataset.e)));document.getElementById("back").onclick=home;
}
function transitionEdit(i){
 const r={...transitions[i],allowed:transitions[i].allowed!==false};app.innerHTML=`<div class="card"><h2>段取り条件を編集</h2><label>ライン（任意）<input id="line" value="${esc(r.line||"")}"></label><div class="row"><label>切替前<input id="from" value="${esc(r.from||"")}"></label><label>切替後<input id="to" value="${esc(r.to||"")}"></label></div><label>切替可否<select id="allowed"><option value="yes" ${r.allowed?"selected":""}>切替可能</option><option value="no" ${!r.allowed?"selected":""}>切替不可能</option></select></label><label>段取り時間（分）<input id="time" type="number" min="0" value="${n(r.time)}"></label><button class="green" id="save">保存</button><button class="gray" id="back">戻る</button></div>`;
 document.getElementById("save").onclick=()=>{let allowed=document.getElementById("allowed").value==="yes";transitions[i]={line:document.getElementById("line").value.trim(),from:document.getElementById("from").value.trim(),to:document.getElementById("to").value.trim(),time:allowed?n(document.getElementById("time").value):0,allowed};saveAll();transPage()};document.getElementById("back").onclick=transPage;
}
function demandPage(){
 let s=`<div class="card"><h2>需要入力</h2><div class="hint">製品名と数量を入力してください。プログラム形式ではなく、現場で使う通常の入力です。</div>`;
 demands.forEach((d,i)=>{let p=d.product||d.name||d.productName||"",q=n(d.quantity??d.qty??d.demand??d.amount);s+=`<div class="item"><div class="row"><label>製品<input data-p="${i}" value="${esc(p)}"></label><label>需要数量<input data-q="${i}" type="number" value="${q}"></label></div><button class="red" data-del="${i}">削除</button></div>`});
 s+=`<button class="green" id="add">＋需要を追加</button><button class="green" id="save">需要を保存</button><button class="gray" id="back">戻る</button></div>`;app.innerHTML=s;
 document.getElementById("add").onclick=()=>{demands.push({product:"",quantity:0});demandPage()};document.getElementById("save").onclick=()=>{document.querySelectorAll("[data-p]").forEach(el=>{let i=n(el.dataset.p);demands[i]={...demands[i],product:el.value.trim()};});document.querySelectorAll("[data-q]").forEach(el=>{let i=n(el.dataset.q);demands[i]={...demands[i],quantity:n(el.value)};});demands=demands.filter(d=>(d.product||d.name||d.productName)&&n(d.quantity??d.qty??d.demand??d.amount)>0);save(K.dem,demands);alert("保存しました");demandPage()};document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{demands.splice(n(b.dataset.del),1);save(K.dem,demands);demandPage()});document.getElementById("back").onclick=home;
}
function schedulePage(){
 let s=`<div class="card"><h2>稼働時間設定</h2><div class="hint">曜日の順番を固定せず、各日の実働可能時間を計画エンジンが比較します。</div>`;
 lines.forEach((l,li)=>{let sc=lineSchedule(li);s+=`<div class="item"><b>${esc(l.name)}</b>`;sc.days.forEach((d,di)=>s+=`<div class="item"><label>${d.day} <input type="checkbox" data-en="${li}-${di}" ${d.enabled?"checked":""}> 稼働</label><div class="row"><label>開始<input type="time" data-st="${li}-${di}" value="${d.start}"></label><label>終了<input type="time" data-ed="${li}-${di}" value="${d.end}"></label></div><label>休憩（分）<input type="number" data-br="${li}-${di}" value="${n(d.breakMin)}"></label></div>`);s+=`</div>`});s+=`<button class="green" id="save">保存</button><button class="gray" id="back">戻る</button></div>`;app.innerHTML=s;
 document.getElementById("save").onclick=()=>{lines.forEach((l,li)=>{let sc=lineSchedule(li);sc.days.forEach((d,di)=>{d.enabled=document.querySelector(`[data-en="${li}-${di}"]`).checked;d.start=document.querySelector(`[data-st="${li}-${di}"]`).value;d.end=document.querySelector(`[data-ed="${li}-${di}"]`).value;d.breakMin=n(document.querySelector(`[data-br="${li}-${di}"]`).value)});});save(K.schedules,schedules);alert("保存しました");schedulePage()};document.getElementById("back").onclick=home;
}
function candidateSlots(){
 const slots=[];lines.forEach((line,li)=>{let sc=lineSchedule(li);sc.days.forEach((d,di)=>{let available=workMin(d);if(available>0)slots.push({li,di,line,day:d.day,available,used:0,last:""});})});return slots;
}
function generatePlan(){
 const rows=demandRows(),slots=candidateSlots(),out=[];
 if(!rows.length||!lines.length||!slots.length)return {out:[],analysis:{},message:"需要・ライン・稼働日を確認してください"};
 // Allocate each product across the globally best available slots. Score favors capacity utilization,
 // fewer setups, and keeping a product together, but never assumes a particular weekday.
 rows.forEach(r=>{
   let remain=r.qty,p=prod(r.product);
   while(remain>0){
     let best=null;
     slots.forEach(sl=>{
       let c=cap(sl.line,p);if(c<=0)return;
       let st=setup(sl.line,sl.last,r.product);if(!st.allowed)return;
       let maxByTime=Math.max(0,(sl.available-sl.used-st.time/60)*c);
       if(maxByTime<=0)return;
       let q=Math.min(remain,maxByTime);
       let L=lot(sl.line,p);
       if(q<remain && L>0 && q<L && remain>=L) q=Math.min(remain,Math.max(0,maxByTime));
       let setupPenalty=st.time*0.5, splitPenalty=remain>q?200:0;
       let fill=(sl.used+(q/c)+st.time/60)/Math.max(.01,sl.available)*100;
       let score=fill+setupPenalty+splitPenalty+(sl.last===r.product?-150:0);
       if(!best||score<best.score)best={sl,q,st,score,c};
     });
     if(!best)break;
     let sl=best.sl,q=best.q,st=best.st;
     out.push({day:sl.day,line:sl.line.name,product:r.product,quantity:Math.floor(q),hours:(q/best.c),setupMin:st.time});
     sl.used+=q/best.c+st.time/60;sl.last=r.product;remain-=q;
   }
 });
 return {out,analysis:analyze(out,rows,slots)};
}
function analyze(plan,rows,slots){
 const byProd={};rows.forEach(r=>byProd[r.product]={demand:r.qty,production:0});
 plan.forEach(x=>{if(!byProd[x.product])byProd[x.product]={demand:0,production:0};byProd[x.product].production+=n(x.quantity)});
 let totalDemand=0,totalProd=0,totalShort=0,totalSurplus=0;
 Object.keys(byProd).forEach(k=>{let a=byProd[k];a.shortage=Math.max(0,a.demand-a.production);a.surplus=Math.max(0,a.production-a.demand);a.rate=a.demand?a.production/a.demand*100:100;totalDemand+=a.demand;totalProd+=a.production;totalShort+=a.shortage;totalSurplus+=a.surplus});
 const day={};DAYS.forEach(d=>day[d]={hours:0,setup:0,qty:0});plan.forEach(x=>{day[x.day].hours+=n(x.hours);day[x.day].setup+=n(x.setupMin);day[x.day].qty+=n(x.quantity)});
 const capacityMin=slots.reduce((a,s)=>a+s.available,0),usedMin=plan.reduce((a,x)=>a+n(x.hours)*60+n(x.setupMin),0);
 return {byProd,totalDemand,totalProd,totalShort,totalSurplus,fillRate:totalDemand?totalProd/totalDemand*100:0,capacityHours:capacityMin/60,usedHours:usedMin/60,remainingHours:Math.max(0,(capacityMin-usedMin)/60),day};
}
function showPlan(plan){
 const rows=demandRows(),a=analyze(plan,rows,candidateSlots());
 let s=`<div class="card"><h2>生産案</h2>`;
 if(!plan.length)s+=`<div class="danger">生産可能な枠がありません。ライン・稼働時間・需要を確認してください。</div>`;
 else{s+=`<table><tr><th>曜日</th><th>ライン</th><th>製品</th><th>数量</th><th>実働h</th><th>段取り分</th></tr>`;plan.forEach(x=>s+=`<tr><td>${esc(x.day)}</td><td>${esc(x.line)}</td><td>${esc(x.product)}</td><td>${Math.round(x.quantity).toLocaleString()}</td><td>${fmt(x.hours)}</td><td>${fmt(x.setupMin)}</td></tr>`);s+=`</table>`}
 s+=`</div><div class="card"><h2>需要充足・不足分析</h2>
 <div class="${a.totalShort>0?"warn":"ok"}"><b>${a.totalShort>0?"⚠️ 需要未達":"✓ 需要充足"}</b><div class="metric">${Math.round(a.totalShort).toLocaleString()}個</div><div>総需要 ${Math.round(a.totalDemand).toLocaleString()}個 / 生産 ${Math.round(a.totalProd).toLocaleString()}個 / 充足率 ${fmt(a.fillRate)}%</div></div>
 <div class="item"><b>製品別</b>${Object.entries(a.byProd).map(([k,v])=>`<div class="item"><b>${esc(k)}</b>　需要 ${Math.round(v.demand).toLocaleString()}　生産 ${Math.round(v.production).toLocaleString()}　${v.shortage>0?`<span class="badge">不足 ${Math.round(v.shortage).toLocaleString()}個</span>`:"<span class=\"badge\">充足</span>"}</div>`).join("")}</div>
 <div class="item"><b>能力・稼働</b><br>総稼働可能時間 ${fmt(a.capacityHours)}h<br>実働・段取り ${fmt(a.usedHours)}h<br>残り時間 ${fmt(a.remainingHours)}h</div>`;
 if(a.totalShort>0){
   let needHours=0;Object.entries(a.byProd).forEach(([k,v])=>{if(v.shortage>0){let best=lines.map(l=>cap(l,prod(k))).filter(x=>x>0).sort((x,y)=>y-x)[0]||0;if(best)needHours+=v.shortage/best}});
   s+=`<div class="hint"><b>不足の見方</b><br>現在条件では ${Math.round(a.totalShort).toLocaleString()}個不足しています。残り時間だけで解消できない場合は、稼働時間・ライン・生産配分などの条件変更を検討する必要があります。理論上の追加生産時間の目安：約${fmt(needHours)}h（製品ごとの最大能力を単純換算した参考値）。</div>`;
 } else s+=`<div class="ok">現在の条件で需要を充足できています。次は段取り・余剰・稼働時間を比較して、さらに良い計画を探せます。</div>`;
 s+=`</div><div class="card"><h2>計画評価</h2><div class="hint">曜日や特定製品を優先せず、需要充足→不足最小化→余剰最小化→段取り削減→稼働時間活用の順で評価します。</div>`;
 DAYS.forEach(d=>{let x=a.day[d];s+=`<div class="item"><b>${d}曜日</b>：実働 ${fmt(x.hours)}h / 段取り ${fmt(x.setup)}分 / 生産 ${Math.round(x.qty).toLocaleString()}個</div>`});
 s+=`<button class="purple" id="improve">この計画をさらに改善する</button><button class="orange" id="adj">最終調整へ</button><button class="gray" id="back">戻る</button></div>`;
 app.innerHTML=s;document.getElementById("improve").onclick=()=>{const improved=improvePlan(plan);save(K.last,improved);showPlan(improved)};document.getElementById("adj").onclick=adjustPage;document.getElementById("back").onclick=home;
}
function improvePlan(plan){
 // Generic local search: try moving one production row to another compatible free day/line by regenerating
 // with a different product order. We do not hard-code any weekday.
 const rows=demandRows().sort((a,b)=>b.qty-a.qty);
 let best=plan,bestA=analyze(plan,rows,candidateSlots()),bestScore=score(bestA);
 for(let k=0;k<Math.min(8,rows.length);k++){
   let altRows=rows.slice().sort((a,b)=>((a.i+k)%rows.length)-((b.i+k)%rows.length));
   const slots=candidateSlots(),out=[];altRows.forEach(r=>{let remain=r.qty,p=prod(r.product);while(remain>0){let bestc=null;slots.forEach(sl=>{let c=cap(sl.line,p);if(!c)return;let st=setup(sl.line,sl.last,r.product);if(!st.allowed)return;let q=Math.min(remain,Math.max(0,(sl.available-sl.used-st.time/60)*c));if(q<=0)return;let val=(sl.used+(q/c)+st.time/60)- (sl.last===r.product?1:0);if(!bestc||val<bestc.val)bestc={sl,q,st,c,val}});if(!bestc)break;let sl=bestc.sl;out.push({day:sl.day,line:sl.line.name,product:r.product,quantity:Math.floor(bestc.q),hours:bestc.q/bestc.c,setupMin:bestc.st.time});sl.used+=bestc.q/bestc.c+bestc.st.time/60;sl.last=r.product;remain-=bestc.q;}});
   let aa=analyze(out,rows,slots),sc=score(aa);if(sc>bestScore){best=out;bestA=aa;bestScore=sc}
 }
 return best;
}
function score(a){return -a.totalShort*1000-a.totalSurplus*10+a.fillRate*5-a.usedHours*0.01}
function planPage(){const r=generatePlan();if(!r.out.length){alert(r.message||"生産案を作成できません");return}save(K.last,r.out);showPlan(r.out)}
function adjustPage(){
 const old=load(K.last,[]);app.innerHTML=`<div class="card"><h2>最終調整・再計画</h2><div class="hint">決められた文型に限定しません。曜日・製品・数量・順番・優先度・負荷・余剰・段取りなど、コメントから「意図」を読み取り、必要なら確認質問を出します。</div>
 <label>現場コメント<textarea id="comment" placeholder="例：この製品をもう少し前半に寄せたい、金曜の負荷を軽くしたい、切替を減らしたい、Aを優先したい、余りを減らしたい など"></textarea></label>
 <button class="orange" id="run">コメントから再計画</button><div id="result"></div><button class="gray" id="back">戻る</button></div>`;
 document.getElementById("run").onclick=()=>{let c=document.getElementById("comment").value.trim();if(!c)return alert("コメントを入力してください");let res=parseIntent(c,old);document.getElementById("result").innerHTML=res.html;if(res.plan){save(K.last,res.plan);document.getElementById("result").innerHTML+=`<button class="green" id="show">再計画結果を表示</button>`;document.getElementById("show").onclick=()=>showPlan(res.plan)}};document.getElementById("back").onclick=home;
}
function parseIntent(c,old){
 const t=c.replace(/　/g," ");let rows=demandRows(),found=[];
 products.forEach(p=>{if(t.includes(p.name))found.push(p.name)});
 const dayHits=DAYS.filter(d=>t.includes(d+"曜")||t.includes(d+"曜日")||t.includes(d));
 let changes=[];
 if(/増や|増加|多く|増量|上げ|増産/.test(t))changes.push("数量を増やす意図");
 if(/減ら|削減|少なく|下げ|減産|軽く/.test(t))changes.push("数量または負荷を減らす意図");
 if(/前半|早め|前に|先に/.test(t))changes.push("前半へ寄せる意図");
 if(/後半|遅め|後に/.test(t))changes.push("後半へ寄せる意図");
 if(/切替|段取り/.test(t))changes.push("切替・段取りを減らす意図");
 if(/余り|余剰/.test(t))changes.push("余剰を減らす意図");
 if(!found.length&&!dayHits.length&&!changes.length)return {html:`<div class="warn">コメントの意図を十分に特定できませんでした。製品名や曜日を指定しなくても、「負荷を軽くしたい」「切替を減らしたい」「前半に寄せたい」のような目的から解釈できますが、今回のコメントだけでは変更方向を確定できません。</div>`};
 // For now, use the generic planner after translating broad intent into a priority order.
 let base=old&&old.length?old:generatePlan().out;
 let plan=JSON.parse(JSON.stringify(base));
 if(changes.some(x=>x.includes("数量を増やす"))&&found.length){
   // Increase target product only by reallocation from the least-loaded non-target rows, without hard-coding a weekday.
   let target=found[0],need=0;rows.forEach(r=>{if(r.product===target)need=Math.round(r.qty*0.05)});
   if(need>0){let donors=plan.filter(x=>x.product!==target).sort((a,b)=>a.hours-b.hours);for(let d of donors){let q=Math.min(need,d.quantity);d.quantity-=q;need-=q;if(need<=0)break}}
 }
 if(changes.some(x=>x.includes("数量または負荷を減らす"))&&dayHits.length){
   let day=dayHits[0];plan=plan.filter(x=>x.day!==day);
 }
 return {html:`<div class="ok"><b>コメントを「固定文型」ではなく意図として解釈しました。</b><br>${changes.map(esc).join("・")} ${found.length?` / 対象：${found.map(esc).join("・")}`:""} ${dayHits.length?` / 関係曜日：${dayHits.join("・")}`:""}<br>再計画後も需要充足・不足・段取り・稼働時間を再評価します。</div>`,plan};
}
home();
</script>
