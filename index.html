<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb"><title>AI生産計画</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#2563eb;color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 18px;position:sticky;top:0;z-index:5}h1{font-size:22px;margin:0 0 4px}.sub{font-size:13px;opacity:.9}
main{max-width:720px;margin:auto;padding:14px 14px 100px}.card{background:#fff;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 2px 10px #0001}
h2{font-size:19px;margin:0 0 10px}h3{font-size:16px;margin:16px 0 8px}label{display:block;font-size:13px;font-weight:600;margin:10px 0 5px}
input,select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;background:#fff}
button{width:100%;border:0;border-radius:11px;padding:13px 16px;margin-top:10px;font-size:16px;font-weight:600;background:#2563eb;color:#fff}button.secondary{background:#e5e7eb;color:#111827}
.days{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.day{border:1px solid #ddd;border-radius:12px;padding:10px}.day b{display:block;margin-bottom:7px}.day input{margin-bottom:5px}
.box{background:#f9fafb;border-radius:12px;padding:12px;margin-top:9px}.small{font-size:12px;color:#6b7280}.ok{color:#15803d;font-weight:700}.warn{color:#b45309;font-weight:700}.metric{font-size:24px;font-weight:800}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px 5px;border-bottom:1px solid #eee;text-align:left}
.badge{display:inline-block;background:#dbeafe;color:#1d4ed8;padding:4px 8px;border-radius:999px;font-size:12px;margin:2px}
</style></head><body><header><h1>AI生産計画</h1><div class="sub">需要・能力・稼働条件から週間計画を作成</div></header><main id="app"></main>
<script>
const DAYS=["月","火","水","木","金","土","日"];
const S={step:0,products:[],lines:[],demand:{},schedule:DAYS.map((d,i)=>({day:d,on:i<5,start:"08:00",end:"17:00",break:60})),options:{inv:"no",person:"no",ot:"no"}};
const app=document.getElementById("app");
function save(){localStorage.setItem("aiSeisanV2",JSON.stringify(S))}
function load(){try{const x=JSON.parse(localStorage.getItem("aiSeisanV2")||"null");if(x)Object.assign(S,x)}catch(e){}}
function render(){save();[home,products,lines,conditions,demand,plan][S.step]()}
function home(){app.innerHTML=`<div class="card"><h2>週間生産計画を作成</h2><p>最初に、現時点で対応可能な稼働時間を登録します。その後、需要に間に合うか、キャパが余るかを診断します。</p><button onclick="S.step=3;render()">計画条件を設定して開始</button></div><div class="card"><span class="badge">商品 ${S.products.length}件</span><span class="badge">ライン ${S.lines.length}件</span></div>`}
function products(){app.innerHTML=`<div class="card"><h2>商品情報</h2>${S.products.map(p=>`<div class="box"><b>${p.name}</b><div class="small">${p.min}分/個</div></div>`).join("")}<label>商品名</label><input id="pn" placeholder="例：唐揚げ弁当"><label>生産時間（分/個）</label><input id="pm" type="number" inputmode="decimal" placeholder="例：0.5"><button onclick="addP()">商品を追加</button><button class="secondary" onclick="S.step=2;render()">次へ：ライン</button></div>`}
function addP(){let n=pn.value.trim(),m=+pm.value;if(!n||!m)return alert("入力してください");S.products.push({name:n,min:m});render()}
function lines(){app.innerHTML=`<div class="card"><h2>ライン情報</h2>${S.lines.map(l=>`<div class="box"><b>${l.name}</b><div class="small">基本 ${l.workers}人</div></div>`).join("")}<label>ライン名</label><input id="ln" placeholder="例：1号ライン"><label>基本必要人数</label><input id="lw" type="number" inputmode="numeric" placeholder="例：4"><button onclick="addL()">ラインを追加</button><button class="secondary" onclick="S.step=3;render()">次へ：稼働条件</button></div>`}
function addL(){let n=ln.value.trim(),w=+lw.value;if(!n||!w)return alert("入力してください");S.lines.push({name:n,workers:w});render()}
function conditions(){
app.innerHTML=`<div class="card"><h2>計画開始条件</h2><p class="small">今回対応できる稼働時間を最初に決めます。曜日ごとに開始・終了・休憩を設定できます。</p>
<h3>稼働日・時間・休憩</h3><div class="days">${S.schedule.map((x,i)=>`<div class="day"><b><input type="checkbox" id="on${i}" ${x.on?"checked":""} style="width:auto"> ${x.day}曜日</b><label>開始</label><input id="st${i}" type="time" value="${x.start}"><label>終了</label><input id="en${i}" type="time" value="${x.end}"><label>休憩（分）</label><input id="br${i}" type="number" inputmode="numeric" value="${x.break}"></div>`).join("")}</div>
<h3>計画条件</h3><label>在庫を考慮</label><select id="inv"><option value="no">しない</option><option value="yes">する</option></select>
<label>人員制約を考慮</label><select id="person"><option value="no">しない</option><option value="yes">する</option></select>
<label>残業を許可</label><select id="ot"><option value="no">しない</option><option value="yes">する</option></select>
<button onclick="saveSchedule();S.step=1;render()">条件を保存して商品設定へ</button></div>`}
function saveSchedule(){S.schedule.forEach((x,i)=>{x.on=document.getElementById("on"+i).checked;x.start=document.getElementById("st"+i).value;x.end=document.getElementById("en"+i).value;x.break=+document.getElementById("br"+i).value||0});S.options={inv:document.getElementById("inv").value,person:document.getElementById("person").value,ot:document.getElementById("ot").value}}
function demand(){app.innerHTML=`<div class="card"><h2>来週の需要予測</h2>${S.products.map(p=>`<label>${p.name}</label><input id="dq_${p.name}" type="number" inputmode="numeric" value="${S.demand[p.name]||""}" placeholder="必要数量">`).join("")}<button onclick="S.products.forEach(p=>S.demand[p.name]=+(document.getElementById('dq_'+p.name).value)||0);S.step=5;render()">計画を作成する</button></div>`}
function min(t){let a=t.split(":").map(Number);return a[0]*60+a[1]}
function plan(){
let active=S.schedule.filter(x=>x.on), daily=active.map(x=>Math.max(0,min(x.end)-min(x.start)-x.break)), totalMin=daily.reduce((a,b)=>a+b,0);
let totalNeed=S.products.reduce((a,p)=>a+(S.demand[p.name]||0)*p.min,0), cap=totalMin*S.lines.length, gap=cap-totalNeed;
let status=gap>=0?`✓ 現在の稼働条件で対応可能です。キャパは約 ${Math.floor(gap/60)}時間 ${Math.floor(gap%60)}分余ります。`:`⚠ 現在の稼働条件では不足します。約 ${Math.ceil(-gap/60)}時間 ${Math.ceil(-gap%60)}分の生産時間が不足します。`;
let suggestion=gap<0?`不足分を埋めるには、まず「稼働時間を延長」「休日を追加」「別ラインへ振替」「ライン能力を上げる」「残業を許可」などを検討します。どれを使うかは次版でAIが条件を聞いて提案します。`:`余剰キャパを、追加注文・安全在庫の積み増し・メンテナンス・突発対応用の余力として使える可能性があります。`;
app.innerHTML=`<div class="card"><h2>計画診断</h2><p class="${gap>=0?'ok':'warn'}">${status}</p><div class="box"><div class="small">対応可能時間（全ライン合計）</div><div class="metric">${Math.floor(cap/60)}時間 ${cap%60}分</div></div><div class="box"><div class="small">必要生産時間</div><div class="metric">${Math.floor(totalNeed/60)}時間 ${Math.ceil(totalNeed%60)}分</div></div><div class="box"><b>💡 AIからの提案</b><p>${suggestion}</p></div></div>
<div class="card"><h2>設定した稼働時間</h2>${S.schedule.filter(x=>x.on).map((x,i)=>{let d=Math.max(0,min(x.end)-min(x.start)-x.break);return `<div class="box">${x.day}：${x.start}〜${x.end}（休憩${x.break}分）→ 実働 ${Math.floor(d/60)}時間${d%60}分</div>`}).join("")}<button onclick="S.step=3;render()">稼働条件を変更</button><button class="secondary" onclick="S.step=4;render()">需要予測を変更</button><button class="secondary" onclick="S.step=0;render()">ホームへ</button></div>
<div class="card"><p class="small">※現在は「稼働可能時間から必要生産時間を診断する」第2試作です。次版で商品×ライン能力、段取り時間、最低ロット、在庫、人員制約を計画計算へ統合します。</p></div>`}
load();render();
</script></main></body></html>
