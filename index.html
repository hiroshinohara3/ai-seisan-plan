<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI生産計画 v16</title>
<style>
body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
header{background:#1d4ed8;color:#fff;padding:20px 16px}.title{font-size:22px;font-weight:800}.sub{font-size:12px}
main{max-width:820px;margin:auto;padding:12px 12px 80px}
.card{background:#fff;border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 2px 8px rgba(0,0,0,.06)}
button{display:block;width:100%;border:0;border-radius:11px;padding:14px;margin:8px 0;background:#2563eb;color:#fff;font-size:16px;font-weight:700}
.gray{background:#e5e7eb;color:#111827}.green{background:#16a34a}.red{background:#dc2626}.orange{background:#ea580c}
input,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;background:#fff}
label{display:block;font-size:13px;font-weight:700;margin:10px 0 4px}
.item{border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin:8px 0}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions button{margin:0;padding:10px;font-size:14px}
.small{font-size:12px;color:#6b7280}.hint{background:#f9fafb;border-radius:10px;padding:10px;font-size:12px;color:#4b5563}
.ok{background:#ecfdf5;border-radius:10px;padding:10px;font-size:13px}
</style>
</head>
<body>
<header><div class="title">AI生産計画 v16</div><div class="sub">原料切替＋製品切替の段取り設定</div></header>
<main id="app"></main>
<script>
"use strict";
var app=document.getElementById("app");

function read(key, oldKey){
  try{
    var raw=localStorage.getItem(key);
    if(!raw && oldKey) raw=localStorage.getItem(oldKey);
    var x=raw?JSON.parse(raw):[];
    return Array.isArray(x)?x:[];
  }catch(e){return [];}
}
var materials=read("aiSeisanV15_materials","aiSeisanV14_materials");
var products=read("aiSeisanV14_products");
var lines=read("aiSeisanV15_lines");
var materialRules=read("aiSeisanV16_materialRules");
var productRules=read("aiSeisanV16_productRules");

function save(){
  try{
    localStorage.setItem("aiSeisanV16_materials",JSON.stringify(materials));
    localStorage.setItem("aiSeisanV16_products",JSON.stringify(products));
    localStorage.setItem("aiSeisanV16_lines",JSON.stringify(lines));
    localStorage.setItem("aiSeisanV16_materialRules",JSON.stringify(materialRules));
    localStorage.setItem("aiSeisanV16_productRules",JSON.stringify(productRules));
  }catch(e){}
}
function esc(s){
  return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function names(a){return a.map(function(x){return x.name;});}

function home(){
  app.innerHTML=
  '<div class="card"><h2>マスター管理</h2>'+
  '<button id="m">原料を登録・修正</button>'+
  '<button id="p">商品を登録・修正</button>'+
  '<button id="l">ラインを登録・修正</button>'+
  '<button class="orange" id="s">段取り設定</button></div>'+
  '<div class="card"><h2>段取りの考え方</h2>'+
  '<p class="small">原料が変わる段取りと、同じ原料でも製品・包装資材が変わる段取りを別々に管理します。</p></div>';
  document.getElementById("m").onclick=function(){simple("原料",materials)};
  document.getElementById("p").onclick=function(){simple("商品",products)};
  document.getElementById("l").onclick=function(){simple("ライン",lines)};
  document.getElementById("s").onclick=setupHome;
}

function simple(title,data){
  var s='<div class="card"><h2>'+title+'</h2>';
  if(!data.length)s+='<p class="small">まだ登録されていません。</p>';
  for(var i=0;i<data.length;i++)s+='<div class="item"><b>'+esc(data[i].name)+'</b></div>';
  s+='<button class="gray" id="b">戻る</button></div>';
  app.innerHTML=s;
  document.getElementById("b").onclick=home;
}

function setupHome(){
  app.innerHTML=
  '<div class="card"><h2>段取り設定</h2>'+
  '<div class="hint">原料切替時間と製品切替時間を別々に設定します。生産計画では必要な段取りを合算します。</div>'+
  '<button id="mr">原料切替ルール</button>'+
  '<button id="pr">製品切替ルール</button>'+
  '<button class="gray" id="b">戻る</button></div>';
  document.getElementById("mr").onclick=materialRuleList;
  document.getElementById("pr").onclick=productRuleList;
  document.getElementById("b").onclick=home;
}

function materialRuleList(){
  var s='<div class="card"><h2>原料切替ルール</h2>'+
    '<p class="small">例：A→Bは30分、B→Aは切替不可。</p>';
  if(!materials.length)s+='<div class="hint">原料を先に登録してください。</div>';
  for(var i=0;i<materialRules.length;i++){
    var r=materialRules[i];
    s+='<div class="item"><b>'+esc(r.from)+' → '+esc(r.to)+'</b>'+
      '<div class="small">'+(r.impossible?'切替不可':r.minutes+'分')+
      '</div><div class="actions"><button data-e="'+i+'">編集</button>'+
      '<button class="red" data-d="'+i+'">削除</button></div></div>';
  }
  s+='<button class="green" id="n">＋新規登録</button>'+
    '<button class="gray" id="b">戻る</button></div>';
  app.innerHTML=s;
  document.getElementById("n").onclick=function(){materialRuleEdit(-1)};
  document.getElementById("b").onclick=setupHome;
  document.querySelectorAll("[data-e]").forEach(function(b){
    b.onclick=function(){materialRuleEdit(Number(this.dataset.e));};
  });
  document.querySelectorAll("[data-d]").forEach(function(b){
    b.onclick=function(){
      var i=Number(this.dataset.d);
      if(confirm("このルールを削除しますか？")){
        materialRules.splice(i,1);save();materialRuleList();
      }
    };
  });
}

function materialRuleEdit(i){
  if(materials.length<2){
    alert("原料を2つ以上登録してください。");
    return;
  }
  var r=i>=0?materialRules[i]:{};
  var ns=names(materials);
  var a=ns.map(function(n){return '<option '+(n===r.from?'selected':'')+'>'+esc(n)+'</option>';}).join("");
  var b=ns.map(function(n){return '<option '+(n===r.to?'selected':'')+'>'+esc(n)+'</option>';}).join("");
  app.innerHTML=
    '<div class="card"><h2>'+(i<0?'原料切替ルールを新規登録':'原料切替ルールを編集')+'</h2>'+
    '<label>切替元<select id="from">'+a+'</select></label>'+
    '<label>切替先<select id="to">'+b+'</select></label>'+
    '<label><input id="imp" type="checkbox" style="width:auto" '+(r.impossible?'checked':'')+'> 切替不可</label>'+
    '<label>標準段取り時間（分）<input id="min" type="number" min="0" value="'+(r.minutes||0)+'"></label>'+
    '<div class="hint">切替不可の場合、この順番は生産計画で使いません。</div>'+
    '<button class="green" id="save">保存</button>'+
    '<button class="gray" id="cancel">キャンセル</button></div>';
  document.getElementById("save").onclick=function(){
    var from=document.getElementById("from").value;
    var to=document.getElementById("to").value;
    if(from===to){alert("切替元と切替先を変えてください。");return;}
    var o={from:from,to:to,minutes:Number(document.getElementById("min").value)||0,
      impossible:document.getElementById("imp").checked};
    if(i<0)materialRules.push(o);else materialRules[i]=o;
    save();materialRuleList();
  };
  document.getElementById("cancel").onclick=materialRuleList;
}

function productRuleList(){
  var s='<div class="card"><h2>製品切替ルール</h2>'+
    '<div class="hint">同じ原料でも、包装資材交換・機械調整などで発生する段取り時間です。標準時間を登録し、商品ペアごとに個別修正できます。</div>';
  if(!products.length)s+='<div class="hint">商品を先に登録してください。</div>';
  for(var i=0;i<productRules.length;i++){
    var r=productRules[i];
    s+='<div class="item"><b>'+esc(r.from)+' → '+esc(r.to)+'</b>'+
      '<div class="small">段取り時間：'+r.minutes+'分</div>'+
      '<div class="actions"><button data-e="'+i+'">編集</button>'+
      '<button class="red" data-d="'+i+'">削除</button></div></div>';
  }
  s+='<button class="green" id="n">＋新規登録</button>'+
    '<button class="gray" id="b">戻る</button></div>';
  app.innerHTML=s;
  document.getElementById("n").onclick=function(){productRuleEdit(-1)};
  document.getElementById("b").onclick=setupHome;
  document.querySelectorAll("[data-e]").forEach(function(b){
    b.onclick=function(){productRuleEdit(Number(this.dataset.e));};
  });
  document.querySelectorAll("[data-d]").forEach(function(b){
    b.onclick=function(){
      var i=Number(this.dataset.d);
      if(confirm("このルールを削除しますか？")){
        productRules.splice(i,1);save();productRuleList();
      }
    };
  });
}

function productRuleEdit(i){
  if(products.length<2){
    alert("商品を2つ以上登録してください。");
    return;
  }
  var r=i>=0?productRules[i]:{};
  var ns=names(products);
  var a=ns.map(function(n){return '<option '+(n===r.from?'selected':'')+'>'+esc(n)+'</option>';}).join("");
  var b=ns.map(function(n){return '<option '+(n===r.to?'selected':'')+'>'+esc(n)+'</option>';}).join("");
  app.innerHTML=
    '<div class="card"><h2>'+(i<0?'製品切替ルールを新規登録':'製品切替ルールを編集')+'</h2>'+
    '<label>切替元の商品<select id="from">'+a+'</select></label>'+
    '<label>切替先の商品<select id="to">'+b+'</select></label>'+
    '<label>標準段取り時間（分）<input id="min" type="number" min="0" value="'+(r.minutes||0)+'"></label>'+
    '<div class="hint">包装資材交換など、同じ原料でも発生する時間をここに入力します。後から商品ペアごとに変更できます。</div>'+
    '<button class="green" id="save">保存</button>'+
    '<button class="gray" id="cancel">キャンセル</button></div>';
  document.getElementById("save").onclick=function(){
    var from=document.getElementById("from").value;
    var to=document.getElementById("to").value;
    if(from===to){alert("切替元と切替先を変えてください。");return;}
    var o={from:from,to:to,minutes:Number(document.getElementById("min").value)||0};
    if(i<0)productRules.push(o);else productRules[i]=o;
    save();productRuleList();
  };
  document.getElementById("cancel").onclick=productRuleList;
}
home();
</script>
</body>
</html>
