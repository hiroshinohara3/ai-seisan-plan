<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb"><title>AI生産計画 v5</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#2563eb;color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 18px;position:sticky;top:0;z-index:5}h1{font-size:22px;margin:0 0 4px}.sub{font-size:13px;opacity:.9}
main{max-width:780px;margin:auto;padding:14px 14px 100px}.card{background:#fff;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 2px 10px #00000010}
h2{font-size:19px;margin:0 0 10px}h3{font-size:16px;margin:16px 0 8px}.small{font-size:12px;color:#6b7280}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 5px}input,select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;background:#fff}
button{width:100%;border:0;border-radius:11px;padding:13px 16px;margin-top:10px;font-size:16px;font-weight:600;background:#2563eb;color:#fff}
button.secondary{background:#e5e7eb;color:#111827}button.danger{background:#dc2626}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.item{border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin:8px 0}.box{background:#f9fafb;border-radius:12px;padding:12px;margin-top:9px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.actions button{margin:0;padding:10px;font-size:14px}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;margin:2px}.green{background:#dcfce7;color:#166534}.red{background:#fee2e2;color:#991b1b}.blue{background:#dbeafe;color:#1d4ed8}
</style></head>
<body><header><h1>AI生産計画 v5</h1><div class="sub">標準値を先に設定し、必要なものだけ個別修正</div></header><main id="app"></main>
<script>
const S={page:"home",materials:[],products:[],lines:[],rules:[],overrides:[],pairOverrides:[]};
const app=document.getElementById("app");
function save(){localStorage.setItem("aiSeisanV5",JSON.stringify(S))}
function load(){try{const x=JSON.parse(localStorage.getItem("aiSeisanV5")||"null");if(x)Object.assign(S,x)}catch(e){}}
function go(p){S.page=p;render()}function render(){save();({home,materials,products,lines,rules,setupTable,pairSettings}[S.page]||home)()}
function home(){app.innerHTML=`<div class="card"><h2>生産計画マスター</h2><p class="small">標準値を登録し、必要な商品だけ例外設定します。</p>
<button onclick="go('materials')">① 原料マスター</button><button onclick="go('products')">② 商品登録・編集</button><button onclick="go('lines')">③ ライン標準値</button><button onclick="go('pairSettings')">④ 商品×ライン個別設定</button><button onclick="go('rules')">⑤ 原料切替ルール</button><button onclick="go('setupTable')">⑥ 自動段取り表</button></div>
<div class="card"><b>登録状況</b><div class="box">原料 ${S.materials.length}件 ／ 商品 ${S.products.length}件 ／ ライン ${S.lines.length}件 ／ 原料ルール ${S.rules.length}件 ／ 個別段取り ${S.overrides.length}件 ／ 能力・ロット個別設定 ${S.pairOverrides.length}件</div></div>`}
function materials(){app.innerHTML=`<div class="card"><h2>① 原料マスター</h2>${S.materials.map((m,i)=>`<div class="item"><b>${m.name}</b><div class="actions"><button onclick="editM(${i})">✏️ 編集</button><button class="danger" onclick="delM(${i})">🗑️ 削除</button></div></div>`).join("")}<label>原料名</label><input id="mn" placeholder="例：原料a"><button onclick="addM()">登録</button><button class="secondary" onclick="go('home')">戻る</button></div>`}
function addM(){let n=mn.value.trim();if(!n)return alert("原料名を入力してください");if(S.materials.some(x=>x.name===n))return alert("同じ原料があります");S.materials.push({name:n});render()}
function editM(i){let n=prompt("原料名",S.materials[i].name);if(n===null)return;n=n.trim();if(!n)return;let old=S.materials[i].name;S.materials[i].name=n;S.products.forEach(p=>{if(p.material===old)p.material=n});S.rules.forEach(r=>{if(r.from===old)r.from=n;if(r.to===old)r.to=n});render()}
function delM(i){let n=S.materials[i].name;if(!confirm("原料を削除しますか？関連商品の原料設定は未設定になります。"))return;S.materials.splice(i,1);S.products.forEach(p=>{if(p.material===n)p.material=""});S.rules=S.rules.filter(r=>r.from!==n&&r.to!==n);render()}
function products(){app.innerHTML=`<div class="card"><h2>② 商品登録・編集</h2><p class="small">内容量と原料使用量は同じ項目「原料使用量（内容量）」で管理します。</p>
${S.products.map((p,i)=>`<div class="item"><b>${p.name}</b><div class="small">原料：${p.material||"未設定"} ／ 原料使用量（内容量）：${p.amount||"-"}</div><div class="actions"><button onclick="editP(${i})">✏️ 編集</button><button class="danger" onclick="delP(${i})">🗑️ 削除</button></div></div>`).join("")}
<label>商品名</label><input id="pn" placeholder="例：A商品100g"><label>使用する原料</label><select id="pm">${S.materials.map(m=>`<option value="${m.name}">${m.name}</option>`).join("")}</select><label>原料使用量（内容量）</label><input id="pa" placeholder="例：100g"><button onclick="addP()">登録</button><button class="secondary" onclick="go('home')">戻る</button></div>`}
function addP(){let n=pn.value.trim();if(!n)return alert("商品名を入力してください");if(!S.materials.length)return alert("先に原料を登録してください");S.products.push({name:n,material:pm.value,amount:pa.value.trim()});render()}
function editP(i){let p=S.products[i],n=prompt("商品名",p.name);if(n===null)return;let m=prompt("原料名",p.material);if(m===null)return;let a=prompt("原料使用量（内容量）",p.amount||"");if(a===null)return;p.name=n.trim()||p.name;p.material=S.materials.some(x=>x.name===m)?m:p.material;p.amount=a;render()}
function delP(i){if(confirm("この商品を削除しますか？")){let n=S.products[i].name;S.products.splice(i,1);S.overrides=S.overrides.filter(x=>x.from!==n&&x.to!==n);S.pairOverrides=S.pairOverrides.filter(x=>x.product!==n);render()}}
function lines(){app.innerHTML=`<div class="card"><h2>③ ライン標準値</h2><p class="small">ここで設定した値が、新しい商品をそのラインで作るときの初期値になります。</p>
${S.lines.map((l,i)=>`<div class="item"><b>${l.name}</b><div class="small">標準能力：${l.capacity} 個/h ／ 標準最低ロット：${l.lot} 個 ／ 必要人数：${l.workers}人</div><div class="actions"><button onclick="editL(${i})">✏️ 編集</button><button class="danger" onclick="delL(${i})">🗑️ 削除</button></div></div>`).join("")}
<label>ライン名</label><input id="ln" placeholder="例：1号ライン"><label>標準生産能力（個/h）</label><input id="lc" type="number" inputmode="decimal" placeholder="例：500"><label>標準最低生産ロット（個）</label><input id="lt" type="number" inputmode="numeric" placeholder="例：1000"><label>基本必要人数</label><input id="lw" type="number" inputmode="numeric" placeholder="例：4"><button onclick="addL()">登録</button><button class="secondary" onclick="go('home')">戻る</button></div>`}
function addL(){let n=ln.value.trim(),c=+lc.value,t=+lt.value,w=+lw.value;if(!n||!c||!t||!w)return alert("全項目を入力してください");S.lines.push({name:n,capacity:c,lot:t,workers:w});render()}
function editL(i){let l=S.lines[i],n=prompt("ライン名",l.name);if(n===null)return;let c=prompt("標準生産能力（個/h）",l.capacity);if(c===null)return;let t=prompt("標準最低生産ロット（個）",l.lot);if(t===null)return;let w=prompt("基本必要人数",l.workers);if(w===null)return;l.name=n.trim()||l.name;l.capacity=+c||l.capacity;l.lot=+t||l.lot;l.workers=+w||l.workers;render()}
function delL(i){if(confirm("このラインを削除しますか？個別設定も確認が必要です。")){S.lines.splice(i,1);render()}}
function pairValue(product,line){let l=S.lines.find(x=>x.name===line);let o=S.pairOverrides.find(x=>x.product===product&&x.line===line);return {capacity:o&&o.capacity?o.capacity:l?.capacity||0,lot:o&&o.lot?o.lot:l?.lot||0,override:!!o,workers:l?.workers||0}}
function pairSettings(){let html=`<div class="card"><h2>④ 商品×ライン個別設定</h2><p class="small">標準値はラインから自動表示。必要な商品だけ個別に変更できます。</p>`;
if(!S.products.length||!S.lines.length)html+=`<div class="box">商品とラインを1つ以上登録してください。</div>`;
for(const p of S.products){html+=`<h3>${p.name}</h3>`;for(const l of S.lines){let v=pairValue(p.name,l.name);html+=`<div class="item"><b>${l.name}</b><div class="small">ライン標準：${l.capacity}個/h・${l.lot}個</div><div>現在設定：<span class="badge ${v.override?'blue':'green'}">${v.capacity}個/h</span><span class="badge ${v.override?'blue':'green'}">最低${v.lot}個</span>${v.override?'<span class="badge blue">個別修正</span>':'<span class="badge">標準値</span>'}</div><div class="actions"><button onclick="editPair('${p.name.replace(/'/g,"\\'")}','${l.name.replace(/'/g,"\\'")}')">✏️ 修正</button><button class="secondary" onclick="resetPair('${p.name.replace(/'/g,"\\'")}','${l.name.replace(/'/g,"\\'")}')">標準に戻す</button></div></div>`}}html+=`<button class="secondary" onclick="go('home')">戻る</button></div>`;app.innerHTML=html}
function editPair(p,l){let v=pairValue(p,l);let c=prompt(`${p} × ${l}\n生産能力（個/h）`,v.capacity);if(c===null)return;let t=prompt(`${p} × ${l}\n最低生産ロット（個）`,v.lot);if(t===null)return;let i=S.pairOverrides.findIndex(x=>x.product===p&&x.line===l);let o={product:p,line:l,capacity:+c||v.capacity,lot:+t||v.lot};if(i>=0)S.pairOverrides[i]=o;else S.pairOverrides.push(o);render()}
function resetPair(p,l){S.pairOverrides=S.pairOverrides.filter(x=>!(x.product===p&&x.line===l));render()}
function rules(){app.innerHTML=`<div class="card"><h2>⑤ 原料切替ルール</h2><p class="small">原料の切替方向ごとに基本時間・条件を設定します。包装資材など商品間で変わる段取りは、後の自動段取り表で商品別に上書きできます。</p>
${S.rules.map((r,i)=>`<div class="item"><b>${r.from} → ${r.to}</b><div>${r.mode==="impossible"?'<span class="badge red">🚫 基本的に不可能</span>':r.mode==="conditional"?'<span class="badge">⚠️ 条件付き</span>':`<span class="badge green">✓ ${r.minutes}分</span>`}</div><div class="actions"><button onclick="editRule(${i})">✏️ 編集</button><button class="danger" onclick="delRule(${i})">🗑️ 削除</button></div></div>`).join("")}
<div class="row"><div><label>切替元</label><select id="rf">${S.materials.map(m=>`<option>${m.name}</option>`).join("")}</select></div><div><label>切替先</label><select id="rt">${S.materials.map(m=>`<option>${m.name}</option>`).join("")}</select></div></div><label>ルール</label><select id="rm"><option value="time">可能：時間を設定</option><option value="conditional">条件付き</option><option value="impossible">基本的に不可能</option></select><label>時間（分）</label><input id="rv" type="number" inputmode="numeric" placeholder="例：30"><button onclick="addRule()">登録</button><button class="secondary" onclick="go('home')">戻る</button></div>`}
function addRule(){let f=rf.value,t=rt.value,m=rm.value,v=+rv.value||0;if(!f||!t||f===t)return alert("異なる原料を選んでください");let x={from:f,to:t,mode:m,minutes:v};let i=S.rules.findIndex(r=>r.from===f&&r.to===t);if(i>=0)S.rules[i]=x;else S.rules.push(x);render()}
function editRule(i){let r=S.rules[i],m=prompt("時間（分）。不可能なら空欄",r.mode==="time"?r.minutes:"");if(m===null)return;r.mode=m.trim()===""?"impossible":"time";r.minutes=+m||0;render()}
function delRule(i){if(confirm("この原料切替ルールを削除しますか？")){S.rules.splice(i,1);render()}}
function baseRule(f,t){if(f===t)return {mode:"time",minutes:0};return S.rules.find(x=>x.from===f&&x.to===t)||{mode:"conditional",minutes:0}}
function setupTable(){let rows=[];for(const a of S.products)for(const b of S.products)if(a.name!==b.name){let base=baseRule(a.material,b.material),ov=S.overrides.find(x=>x.from===a.name&&x.to===b.name);rows.push({a,b,base,ov})}
let h=`<div class="card"><h2>⑥ 自動段取り表</h2><p class="small">原料切替ルールから自動判定し、商品別に例外修正できます。包装資材などの実際の切替時間も、ここで商品間の実績値として上書きできます。</p>`;
h+=rows.length?rows.map((x,i)=>{let f=x.ov||x.base;return `<div class="item"><b>${x.a.name} → ${x.b.name}</b><div class="small">${x.a.material||"原料未設定"} → ${x.b.material||"原料未設定"}</div><div>${f.mode==="impossible"?'<span class="badge red">🚫 不可</span>':f.mode==="conditional"?'<span class="badge">⚠️ 条件確認</span>':`<span class="badge green">✓ ${f.minutes}分</span>`}${x.ov?'<span class="badge blue">個別修正</span>':''}</div><div class="actions"><button onclick="overrideRow(${i},false)">⏱ 個別時間</button><button onclick="overrideRow(${i},true)">🚫 個別不可</button></div></div>`}).join(""):'<div class="box">商品を2つ以上登録すると自動生成されます。</div>';
h+=`<button class="secondary" onclick="go('rules')">原料ルールを修正</button><button class="secondary" onclick="go('home')">戻る</button></div>`;app.innerHTML=h}
function overrideRow(i,impossible){let rows=[];for(const a of S.products)for(const b of S.products)if(a.name!==b.name)rows.push({a,b});let r=rows[i];if(!r)return;if(impossible){setOverride(r.a.name,r.b.name,"impossible",0);return}let m=prompt(`${r.a.name} → ${r.b.name} の実際の段取り時間（分）`,"30");if(m!==null)setOverride(r.a.name,r.b.name,"time",+m||0)}
function setOverride(f,t,mode,minutes){let i=S.overrides.findIndex(x=>x.from===f&&x.to===t),o={from:f,to:t,mode,minutes};if(i>=0)S.overrides[i]=o;else S.overrides.push(o);render()}
load();render();
</script></body></html>
