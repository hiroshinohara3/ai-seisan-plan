<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI生産計画 v35.12（需要充足・最終数量修正版）</title>
<style>
body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#1d4ed8;color:#fff;padding:18px 16px}.title{font-size:22px;font-weight:800;line-height:1.35}
header div:last-child{margin-top:6px;font-size:14px;line-height:1.5}
main{max-width:900px;margin:auto;padding:12px}.card{background:#fff;border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 1px 2px rgba(0,0,0,.05)}
button{width:100%;border:0;border-radius:11px;padding:13px;margin:6px 0;background:#2563eb;color:#fff;font-size:15px;font-weight:700}
.green{background:#16a34a}.orange{background:#ea580c}.gray{background:#e5e7eb;color:#111827}.red{background:#dc2626}.purple{background:#7c3aed}
input,select,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d1d5db;border-radius:10px;font-size:15px;margin-top:4px}
textarea{min-height:110px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item{border:1px solid #e5e7eb;border-radius:12px;padding:11px;margin:8px 0}.small{font-size:12px;color:#6b7280}
.hint{background:#f9fafb;border-radius:10px;padding:10px;font-size:13px;color:#4b5563;line-height:1.6}
.ok{background:#ecfdf5;color:#166534;padding:12px;border-radius:10px}.warn{background:#fff7ed;color:#9a3412;padding:12px;border-radius:10px}.danger{background:#fef2f2;color:#991b1b;padding:12px;border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{border:1px solid #e5e7eb;padding:7px;text-align:right}th:first-child,td:first-child{text-align:left}
.metric{font-size:22px;font-weight:800}.scroll{overflow-x:auto}.tag{display:inline-block;padding:3px 7px;border-radius:8px;background:#eef2ff;color:#3730a3;font-size:11px;margin:2px}
</style>
</head>
<body>
<header>
  <div class="title">AI生産計画 v35.12</div>
  <div>v30基準・稼働時間／段取り／最低生産数量を守り、需要を満たせる計画を優先</div>
</header>
<main id="app"></main>
<script>
"use strict";
const DAYS=["月","火","水","木","金","土","日"];
const K={lines:"aiSeisan_lines",products:"aiSeisan_products",trans:"aiSeisan_transitionRules",dem:"aiSeisan_planItems",schedules:"aiSeisan_schedules",last:"aiSeisan_lastPlan"};
const app=document.getElementById("app");
const load=(k,d=[])=>{try{const x=localStorage.getItem(k);return x?JSON.parse(x):d}catch(e){return d}};
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const n=v=>{const x=Number(v);return Number.isFinite(x)?x:0};
const mins=t=>{const a=String(t||"").split(":");return a.length===2?n(a[0])*60+n(a[1]):0};
const fmt=v=>Math.round(n(v)*100)/100;
const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));

let lines=load(K.lines,[]).map(x=>({...x,name:String(x.name||x.lineName||""),capacity:n(x.capacity??x.hourCapacity),lot:n(x.lot??x.minLot),workers:n(x.workers??x.personnel)})).filter(x=>x.name);
let products=load(K.products,[]).map(x=>({...x,name:String(x.name||x.product||""),capacityOverride:n(x.capacityOverride),minLotOverride:n(x.minLotOverride)})).filter(x=>x.name);
let transitions=load(K.trans,[]).map(x=>({...x,allowed:x.allowed!==false,time:n(x.time)}));
let demands=load(K.dem,[]);
let schedules=load(K.schedules,[]);

function defaults(){
  return DAYS.map(d=>({day:d,enabled:["月","火","水","木","金"].includes(d),start:"08:00",end:"17:00",breakMin:60}));
}
function lineSchedule(i){
  let s=schedules.find(x=>n(x.lineId)===i);
  if(!s){s={lineId:i,days:defaults()};schedules.push(s);save(K.schedules,schedules)}
  if(!Array.isArray(s.days)||s.days.length!==7)s.days=defaults();
  return s;
}
function workMin(d){
  if(!d||!d.enabled)return 0;
  let x=mins(d.end)-mins(d.start);if(x<0)x+=1440;
  return Math.max(0,x-n(d.breakMin));
}
function prod(name){return products.find(p=>p.name===name)||{name,capacityOverride:0,minLotOverride:0}}
function cap(line,p){return n(p.capacityOverride)||n(line.capacity)||0}
function lot(line,p){return n(p.minLotOverride)||n(line.lot)||0}
function setup(line,from,to){
  if(!from||from===to)return {time:0,allowed:true};
  const r=transitions.find(x=>(!x.line||x.line===line.name||x.line===line)&&x.from===from&&x.to===to);
  if(!r)return {time:0,allowed:true};
  return {time:r.allowed===false?Infinity:n(r.time),allowed:r.allowed!==false};
}
function demandRows(){
  return demands.map((d,i)=>({i,product:String(d.product||d.name||d.productName||"").trim(),qty:n(d.quantity??d.qty??d.demand??d.amount)}))
    .filter(x=>x.product&&x.qty>0);
}
function buildSlots(){
  const slots=[];
  lines.forEach((line,li)=>{
    const s=lineSchedule(li);
    s.days.forEach((d,di)=>{
      const available=workMin(d);
      if(available>0)slots.push({id:`${li}-${di}`,li,di,line,day:d.day,available,used:0,last:"",rows:[]});
    });
  });
  return slots;
}

/*
  v35.12 根本修正
  ----------------
  旧ロジックは「残需要 < 最低生産数量」の時点で候補を捨てていた。
  しかし最低生産数量はロット倍数ではなく、最終回の残需要まで切り上げる制約でもない。
  したがって、
    - 残需要 >= 最低数量 → 原則として最低数量以上で開始
    - 残需要 < 最低数量 → その残需要を最終生産として許可
  とする。
  さらに、需要未達を防げる場合は「未達を残す計画」を採用しない。
*/
function candidate(slot,p,remaining){
  const c=cap(slot.line,p);
  if(c<=0)return null;
  const st=setup(slot.line,slot.last,p.name);
  if(!st.allowed)return null;
  const free=Math.max(0,slot.available-slot.used);
  const net=Math.max(0,free-st.time);
  const maxQty=net*c/60;
  if(maxQty<=0)return null;
  const L=lot(slot.line,p);
  let q=Math.min(remaining,maxQty);

  // 最終回なら最低数量未満でも許可
  const finalRun=remaining<=L || q===remaining;
  if(L>0 && q<L && !finalRun)return null;

  q=Math.floor(q);
  if(q<=0)return null;

  return {q,c,st,maxQty,L,finalRun};
}

function slotScore(slot,p,remaining){
  const c=candidate(slot,p,remaining);
  if(!c)return -Infinity;
  const same=slot.last===p.name;
  const fills=(slot.used+c.st.time+c.q/c.c*60)/slot.available;
  const completes=c.q>=remaining;
  // 「残需要をその枠で完了できる」ことを強く評価。
  // 同一製品連続・段取り削減・余裕の確保を続く評価軸にする。
  return (completes?100000:0)+(same?10000:0)-c.st.time*30+fills*20+(c.q/remaining)*100;
}

function makeOrderings(rows,slots){
  const out=[];
  out.push(rows.slice().sort((a,b)=>b.qty-a.qty));
  out.push(rows.slice().sort((a,b)=>{
    const fa=slots.filter(s=>cap(s.line,prod(a.product))>0).length;
    const fb=slots.filter(s=>cap(s.line,prod(b.product))>0).length;
    return fa-fb||b.qty-a.qty;
  }));
  out.push(rows.slice().sort((a,b)=>String(a.product).localeCompare(String(b.product),"ja")));
  return out;
}

function build(order){
  const slots=buildSlots();
  const out=[];
  for(const r of order){
    let remain=r.qty,p=prod(r.product);
    while(remain>0){
      let best=null;
      for(const sl of slots){
        const c=candidate(sl,p,remain);
        if(!c)continue;
        const score=slotScore(sl,p,remain);
        if(!best||score>best.score)best={sl,c,score};
      }
      if(!best)break;
      const {sl,c}=best;
      sl.used+=c.st.time+c.q/c.c*60;
      sl.last=p.name;
      sl.rows.push({product:p.name,quantity:c.q});
      out.push({day:sl.day,line:sl.line.name,product:p.name,quantity:c.q,hours:c.q/c.c,setupMin:c.st.time});
      remain-=c.q;
      if(remain<0.0001)remain=0;
    }
  }
  return {out,slots};
}

function analyze(out,rows,slots){
  const by={};
  rows.forEach(r=>by[r.product]={demand:r.qty,production:0,shortage:0,surplus:0});
  out.forEach(x=>{
    if(!by[x.product])by[x.product]={demand:0,production:0,shortage:0,surplus:0};
    by[x.product].production+=n(x.quantity);
  });
  let totalDemand=0,totalProduction=0,totalShort=0,totalSurplus=0;
  Object.values(by).forEach(x=>{
    x.shortage=Math.max(0,x.demand-x.production);
    x.surplus=Math.max(0,x.production-x.demand);
    totalDemand+=x.demand;totalProduction+=x.production;totalShort+=x.shortage;totalSurplus+=x.surplus;
  });
  const available=slots.reduce((a,s)=>a+s.available,0);
  const used=out.reduce((a,x)=>a+n(x.hours)*60+n(x.setupMin),0);
  return {by,totalDemand,totalProduction,totalShort,totalSurplus,fill:totalDemand?totalProduction/totalDemand*100:0,available,used,remaining:Math.max(0,available-used)};
}

function repairResiduals(out,rows){
  /*
    初回計画後の「予防可能な不足」を修復する。
    例えば a が 4,650 個だけ残り、最低生産数量 5,000 個でも、
    その数量を入れられる既存日の空き時間があるなら追加する。
    ここでは曜日を固定せず、全スロットを探索する。
  */
  const result=out.map(x=>({...x}));
  let changed=true;
  while(changed){
    changed=false;
    const slots=buildSlots();
    // 既存計画を各スロットへ反映
    result.forEach(x=>{
      const sl=slots.find(s=>s.day===x.day&&s.line.name===x.line);
      if(sl){sl.used+=x.hours*60+x.setupMin;sl.last=x.product;}
    });
    const a=analyze(result,rows,slots);
    const shortages=Object.entries(a.by).filter(([_,x])=>x.shortage>0).sort((x,y)=>y[1].shortage-x[1].shortage);
    for(const [name,x] of shortages){
      const p=prod(name);
      let best=null;
      for(const sl of slots){
        const c=candidate(sl,p,x.shortage);
        if(!c)continue;
        const score=(c.q>=x.shortage?100000:0)+(sl.last===name?10000:0)-c.st.time*30+c.q;
        if(!best||score>best.score)best={sl,c,score};
      }
      if(best){
        const {sl,c}=best;
        result.push({day:sl.day,line:sl.line.name,product:name,quantity:c.q,hours:c.q/c.c,setupMin:c.st.time});
        changed=true;break;
      }
    }
  }
  return result;
}

function generatePlan(){
  const rows=demandRows();
  const slots=buildSlots();
  if(!rows.length)return {out:[],analysis:analyze([],rows,slots),message:"需要を入力してください"};
  if(!lines.length)return {out:[],analysis:analyze([],rows,slots),message:"ラインを設定してください"};
  if(!slots.length)return {out:[],analysis:analyze([],rows,slots),message:"稼働可能な曜日・時間がありません"};

  let best=null,bestScore=-Infinity;
  for(const order of makeOrderings(rows,slots)){
    let r=build(order);
    r.out=repairResiduals(r.out,rows);
    const a=analyze(r.out,rows,buildSlots());
    const setupTotal=r.out.reduce((v,x)=>v+n(x.setupMin),0);
    const switches=r.out.reduce((v,x,i)=>v+(i&&x.line===r.out[i-1].line&&x.product!==r.out[i-1].product?1:0),0);
    const score=-a.totalShort*100000000-a.totalSurplus*1000-setupTotal*10-switches;
    if(score>bestScore){bestScore=score;best={out:r.out,analysis:a}}
  }
  return best;
}


function diagnosePlan(plan, rows){
  const slots=buildSlots();
  const a=analyze(plan,rows,slots);
  const day={};
  DAYS.forEach(d=>day[d]={available:0,used:0,setup:0,rows:0});
  slots.forEach(s=>day[s.day].available+=s.available);
  plan.forEach(x=>{
    if(!day[x.day])day[x.day]={available:0,used:0,setup:0,rows:0};
    day[x.day].used+=n(x.hours)*60+n(x.setupMin);
    day[x.day].setup+=n(x.setupMin);
    day[x.day].rows++;
  });

  const productIssues=[];
  Object.entries(a.by).forEach(([name,x])=>{
    if(x.shortage>0){
      const p=prod(name);
      const usable=slots.filter(s=>cap(s.line,p)>0 && candidate(s,p,x.shortage));
      productIssues.push({
        name, shortage:x.shortage, demand:x.demand, production:x.production,
        possibleSlots:usable.length, minLot:lot(usable[0]?.line||{},p)
      });
    }
  });

  const bottlenecks=DAYS.map(d=>({
    day:d,
    available:day[d].available,
    used:day[d].used,
    remaining:Math.max(0,day[d].available-day[d].used),
    utilization:day[d].available?day[d].used/day[d].available*100:0,
    setup:day[d].setup
  })).filter(x=>x.available>0).sort((a,b)=>b.utilization-a.utilization);

  const reasons=[];
  if(a.totalShort<=0){
    reasons.push("需要は現在の稼働可能時間内で充足できています。");
  }else{
    const high=bottlenecks.filter(x=>x.utilization>=95);
    if(high.length) reasons.push("一部の日の稼働率が95%以上で、空き時間が不足の制約になっています。");
    const noSlot=productIssues.filter(x=>x.possibleSlots===0);
    if(noSlot.length) reasons.push("不足製品を生産できるライン・稼働枠が見つからない製品があります。");
    const withSlot=productIssues.filter(x=>x.possibleSlots>0);
    if(withSlot.length) reasons.push("不足製品には追加可能な稼働枠が残っている可能性があります。");
    if(!reasons.length) reasons.push("現在の候補探索では需要を完全充足できませんでした。条件の組合せが制約になっている可能性があります。");
  }
  return {a,day,bottlenecks,productIssues,reasons};
}

function renderDiagnosis(plan, rows){
  const d=diagnosePlan(plan,rows);
  let h=`<div class="card"><h2>計画診断</h2>`;
  h+=`<div class="${d.a.totalShort>0?"warn":"ok"}"><b>${d.a.totalShort>0?"需要未達の原因候補":"実行可能性：問題なし"}</b><br>${d.reasons.map(x=>"・"+esc(x)).join("<br>")}</div>`;

  h+=`<div class="item"><b>日別稼働率</b><div class="scroll"><table><tr><th>曜日</th><th>可能h</th><th>使用h</th><th>稼働率</th><th>段取り分</th></tr>`;
  d.bottlenecks.slice().sort((a,b)=>DAYS.indexOf(a.day)-DAYS.indexOf(b.day)).forEach(x=>{
    h+=`<tr><td>${esc(x.day)}</td><td>${fmt(x.available/60)}</td><td>${fmt(x.used/60)}</td><td>${fmt(x.utilization)}%</td><td>${fmt(x.setup)}分</td></tr>`;
  });
  h+=`</table></div></div>`;

  if(d.productIssues.length){
    h+=`<div class="item"><b>不足製品の診断</b>`;
    d.productIssues.forEach(x=>{
      h+=`<div class="item"><b>${esc(x.name)}</b><br>不足 ${Math.round(x.shortage).toLocaleString()}個 / 追加可能候補 ${x.possibleSlots}枠`;
      if(x.possibleSlots>0) h+=`<br><span class="small">→ 追加生産を検討できる余地があります。</span>`;
      else h+=`<br><span class="small">→ 現在の設定では生産可能な枠がありません。</span>`;
      h+=`</div>`;
    });
    h+=`</div>`;
  }

  h+=`<div class="hint"><b>この版の開発方針</b><br>
  計画結果だけでなく、「なぜその結果になったか」を診断できるようにします。
  特定の曜日・製品・コメント表現に依存せず、稼働時間、能力、段取り、切替可否、最低生産数量、需要残量を原因候補として評価します。</div></div>`;
  return h;
}

function showPlan(plan,analysisOverride){
  const rows=demandRows();
  const a=analysisOverride||analyze(plan,rows,buildSlots());
  let h=`<div class="card"><h2>生産案</h2><div class="scroll"><table><tr><th>曜日</th><th>ライン</th><th>製品</th><th>数量</th><th>実働h</th><th>段取り分</th></tr>`;
  plan.forEach(x=>h+=`<tr><td>${esc(x.day)}</td><td>${esc(x.line)}</td><td>${esc(x.product)}</td><td>${Math.round(x.quantity).toLocaleString()}</td><td>${fmt(x.hours)}</td><td>${fmt(x.setupMin)}</td></tr>`);
  h+=`</table></div></div>`;
  h+=`<div class="card"><h2>需要充足・不足分析</h2>`;
  if(a.totalShort>0)h+=`<div class="warn"><b>⚠ 需要未達</b><div class="metric">${Math.round(a.totalShort).toLocaleString()}個不足</div><div>総需要 ${Math.round(a.totalDemand).toLocaleString()} / 生産 ${Math.round(a.totalProduction).toLocaleString()} / 充足率 ${fmt(a.fill)}%</div></div>`;
  else h+=`<div class="ok"><b>✓ 需要充足</b><div class="metric">不足 0個</div><div>総需要 ${Math.round(a.totalDemand).toLocaleString()} / 生産 ${Math.round(a.totalProduction).toLocaleString()} / 充足率 ${fmt(a.fill)}%</div></div>`;
  Object.entries(a.by).forEach(([name,x])=>{
    h+=`<div class="item"><b>${esc(name)}</b><br>需要 ${Math.round(x.demand).toLocaleString()} / 生産 ${Math.round(x.production).toLocaleString()} / 不足 ${Math.round(x.shortage).toLocaleString()} / 余剰 ${Math.round(x.surplus).toLocaleString()}</div>`;
  });
  h+=`<div class="hint"><b>今回の重要な改善：</b>残需要が最低生産数量を下回っても、それがその製品の最終生産なら、その残数量を生産できます。最低生産数量をロット倍数として扱いません。</div>`;
  h+=`<div class="item"><b>稼働時間</b><br>可能 ${fmt(a.available/60)}h / 使用 ${fmt(a.used/60)}h / 残り ${fmt(a.remaining/60)}h</div>`;
  h+=renderDiagnosis(plan,rows);
  h+=`<button class="purple" id="again">この計画をさらに改善</button><button class="gray" id="back">戻る</button></div>`;
  app.innerHTML=h;
  document.getElementById("again").onclick=()=>{const r=generatePlan();save(K.last,r.out);showPlan(r.out,r.analysis)};
  document.getElementById("back").onclick=home;
}

function planPage(){
  const r=generatePlan();
  if(!r.out.length){alert(r.message||"生産案を作成できません");return}
  save(K.last,r.out);showPlan(r.out,r.analysis);
}



function buildPlanExport(){
  const startDate=(document.getElementById("planStart")||{}).value||"";
  const endDate=(document.getElementById("planEnd")||{}).value||"";
  const planId=(document.getElementById("planId")||{}).value||"";
  const demandText=(document.getElementById("planDemand")||{}).value||"";
  let demand=[];
  if(demandText.trim()){
    demand=demandText.split(/\n/).map(x=>x.trim()).filter(Boolean).map(line=>{
      const p=line.split(/[,，\t ]+/).filter(Boolean);
      return {product:p[0]||"",quantity:Number(p[1]||0)};
    }).filter(x=>x.product&&Number.isFinite(x.quantity));
  }
  return {
    schema:"ai-seisan-plan-data",
    schemaVersion:2,
    exportedAt:new Date().toISOString(),
    appVersion:"v35.12",
    plan:{
      id:planId,
      startDate,
      endDate,
      periodType:(startDate&&endDate)?"custom":"unspecified",
      demand,
      weeklyDemand:[],
      dailyDemand:[],
      temporaryConstraints:[],
      recurringConstraints:[]
    },
    settings:{
      lines:load(K.lines,[]),
      products:load(K.products,[]),
      transitions:load(K.trans,[]),
      schedules:load(K.schedules,[])
    }
  };
}
function downloadPlanData(){
  const data=JSON.stringify(buildPlanExport(),null,2);
  const blob=new Blob([data],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="ai_seisan_plan_data_v35.12.json";
  document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
}
function importPlanDataText(text){
  let o;
  try{o=JSON.parse(text)}catch(e){throw new Error("計画データのJSONを読み込めませんでした。")}
  if(!o || o.schema!=="ai-seisan-plan-data") throw new Error("このアプリ用の計画データではありません。");
  const p=o.plan||{}, s=o.settings||{};
  if(!p.startDate||!p.endDate) throw new Error("計画期間（開始日・終了日）がありません。");
  if(!Array.isArray(p.demand)||!Array.isArray(s.lines)||!Array.isArray(s.products)||!Array.isArray(s.transitions)||!Array.isArray(s.schedules))
    throw new Error("需要・ライン・製品・段取り・稼働時間の設定が揃っていません。");
  save(K.lines,s.lines);save(K.products,s.products);save(K.trans,s.transitions);save(K.schedules,s.schedules);
  if(Array.isArray(p.temporaryConstraints)) localStorage.setItem("ai_plan_temp_constraints",JSON.stringify(p.temporaryConstraints));
  if(Array.isArray(p.recurringConstraints)) localStorage.setItem("ai_plan_recurring_constraints",JSON.stringify(p.recurringConstraints));
}
function configPage(){
  app.innerHTML=`<div class="card"><h2>計画データを共有</h2>
  <div class="exportbox"><b>計画期間＋需要＋計画条件を1つにまとめます</b><br>
  1週間だけでなく、1か月など任意の期間を指定できます。期間情報と計画IDを付けて、ChatGPTで「今回の計画」として扱える形式にします。
  </div>
  <label class="item"><b>計画ID</b><input id="planId" placeholder="例：2026-W36"></label>
  <label class="item"><b>計画期間</b><div style="display:flex;gap:8px"><input id="planStart" type="date"><span>〜</span><input id="planEnd" type="date"></div></label>
  <label class="item"><b>需要（製品名 数量）</b><textarea id="planDemand" rows="6" placeholder="例：&#10;a 60000&#10;b 30000"></textarea></label>
  <button class="green" id="export">計画データをファイルに出力</button>
  <label class="item"><b>計画データファイルを読み込む</b><input id="file" type="file" accept=".json,application/json"></label>
  <div class="hint">読み込むと計画条件を更新します。計画期間・需要・今回だけの制約・継続条件を別管理できる形式です。新しい計画期間を読み込んだとき、前の期間固有の制約を自動的に引き継がない設計です。</div>
  <button class="gray" id="back">戻る</button></div>`;
  document.getElementById("export").onclick=downloadPlanData;
  document.getElementById("file").onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    try{importPlanDataText(await f.text());alert("計画データを読み込みました。");configPage()}
    catch(err){alert(err.message||"読み込みに失敗しました。")}
  };
  document.getElementById("back").onclick=home;
}

function home(){
  app.innerHTML=`<div class="card"><h2>生産計画</h2>
  <button id="plan">需要から生産案を作成</button>
  <button class="purple" id="eval">現在の計画を評価・不足分析</button>
  <button class="orange" id="diag">計画の実行可能性を診断</button>
  <button class="orange" id="adj">最終調整（自然なコメントで再計画）</button></div>
  <div class="card"><h2>設定</h2>
  <button id="dem">需要入力</button><button id="lines">ライン設定</button><button id="products">製品設定</button>
  <button id="trans">段取り設定</button><button id="sched">稼働時間設定</button><button id="config">計画条件を共有</button></div>
  <div class="card"><div class="hint"><b>v35.12の基本計画原則</b><br>
  ①稼働可能時間を超えない　②切替不可能を守る　③段取り時間を差し引く　④需要未達を最小化　⑤余剰を抑える　⑥最低生産数量を倍数制約にしない　⑦最終残需要は最低数量未満でも生産可能なら完了させる　⑧曜日や特定の言い回しに依存しない　⑨結果だけでなく制約・不足理由を診断できる。</div></div>`;
  document.getElementById("plan").onclick=planPage;
  document.getElementById("eval").onclick=()=>{const p=load(K.last,[]);if(!p.length)return alert("先に生産案を作成してください");showPlan(p)};
  document.getElementById("diag").onclick=()=>{const p=load(K.last,[]);if(!p.length)return alert("先に生産案を作成してください");const r=document.createElement("div");r.innerHTML=renderDiagnosis(p,demandRows());app.innerHTML=r.innerHTML+`<div class="card"><button class="gray" id="backDiag">戻る</button></div>`;document.getElementById("backDiag").onclick=home};
  document.getElementById("adj").onclick=()=>alert("コメント再計画は、生産計画エンジンの安定性を優先して次段階で統合します。");
  document.getElementById("config").onclick=configPage;document.getElementById("dem").onclick=demandPage;document.getElementById("lines").onclick=linesPage;document.getElementById("products").onclick=productsPage;document.getElementById("trans").onclick=transPage;document.getElementById("sched").onclick=schedulePage;
}

function demandPage(){
  let h=`<div class="card"><h2>需要入力</h2><div class="hint">製品と数量を入力してください。保存済みの需要はそのまま引き継ぎます。</div>`;
  demands.forEach((d,i)=>h+=`<div class="item"><label>製品<select data-p="${i}">${products.map(p=>`<option ${p.name===d.product?"selected":""}>${esc(p.name)}</option>`).join("")}</select></label><label>需要数量<input type="number" min="0" data-q="${i}" value="${n(d.quantity??d.qty??0)}"></label><button class="red" data-r="${i}">削除</button></div>`);
  h+=`<button class="green" id="add">＋需要を追加</button><button class="green" id="save">保存</button><button class="gray" id="back">戻る</button></div>`;
  app.innerHTML=h;
  document.getElementById("add").onclick=()=>{demands.push({product:products[0]?.name||"",quantity:0});demandPage()};
  document.getElementById("save").onclick=()=>{demands.forEach((d,i)=>{d.product=document.querySelector(`[data-p="${i}"]`)?.value||d.product;d.quantity=n(document.querySelector(`[data-q="${i}"]`)?.value)});save(K.dem,demands);alert("保存しました")};
  document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{demands.splice(n(b.dataset.r),1);save(K.dem,demands);demandPage()});
  document.getElementById("back").onclick=home;
}

function linesPage(){
  let h=`<div class="card"><h2>ライン設定</h2>`;
  lines.forEach((x,i)=>h+=`<div class="item"><b>${esc(x.name)}</b><br><span class="small">能力 ${fmt(x.capacity)}個/h・最低生産数量 ${fmt(x.lot)}個・必要人員 ${fmt(x.workers)}人</span><button data-e="${i}">編集</button></div>`);
  h+=`<button class="green" id="add">＋ライン追加</button><button class="gray" id="back">戻る</button></div>`;
  app.innerHTML=h;document.getElementById("add").onclick=()=>lineEdit(-1);document.getElementById("back").onclick=home;
  document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>lineEdit(n(b.dataset.e)));
}
function lineEdit(i){
  const x=i>=0?lines[i]:{name:"",capacity:2000,lot:5000,workers:1};
  app.innerHTML=`<div class="card"><h2>ライン設定</h2><label>ライン名<input id="name" value="${esc(x.name)}"></label><label>能力（個/時）<input id="cap" type="number" value="${x.capacity}"></label><label>最低生産数量（個）<input id="lot" type="number" value="${x.lot}"></label><label>必要人員<input id="workers" type="number" value="${x.workers}"></label><button class="green" id="save">保存</button><button class="gray" id="back">戻る</button></div>`;
  document.getElementById("save").onclick=()=>{const o={...x,name:document.getElementById("name").value.trim(),capacity:n(document.getElementById("cap").value),lot:n(document.getElementById("lot").value),workers:n(document.getElementById("workers").value)};if(!o.name)return alert("ライン名を入力");if(i<0)lines.push(o);else lines[i]=o;save(K.lines,lines);linesPage()};
  document.getElementById("back").onclick=linesPage;
}
function productsPage(){
  let h=`<div class="card"><h2>製品設定</h2>`;
  products.forEach((p,i)=>h+=`<div class="item"><b>${esc(p.name)}</b><br><span class="small">能力 ${p.capacityOverride||"ライン標準"}・最低数量 ${p.minLotOverride||"ライン標準"}</span><button data-e="${i}">編集</button></div>`);
  h+=`<button class="green" id="add">＋製品追加</button><button class="gray" id="back">戻る</button></div>`;
  app.innerHTML=h;document.getElementById("add").onclick=()=>productEdit(-1);document.getElementById("back").onclick=home;document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>productEdit(n(b.dataset.e)));
}
function productEdit(i){
  const p=i>=0?products[i]:{name:"",capacityOverride:0,minLotOverride:0};
  app.innerHTML=`<div class="card"><h2>製品設定</h2><label>製品名<input id="name" value="${esc(p.name)}"></label><label>能力（個/時・0=ライン標準）<input id="cap" type="number" value="${p.capacityOverride}"></label><label>最低生産数量（0=ライン標準）<input id="lot" type="number" value="${p.minLotOverride}"></label><button class="green" id="save">保存</button><button class="gray" id="back">戻る</button></div>`;
  document.getElementById("save").onclick=()=>{const o={...p,name:document.getElementById("name").value.trim(),capacityOverride:n(document.getElementById("cap").value),minLotOverride:n(document.getElementById("lot").value)};if(!o.name)return alert("製品名を入力");if(i<0)products.push(o);else products[i]=o;save(K.products,products);productsPage()};
  document.getElementById("back").onclick=productsPage;
}
function transPage(){
  let h=`<div class="card"><h2>段取り設定</h2><div class="hint">切替不可能も設定できます。未設定の組合せは切替可能・0分として扱います。</div>`;
  transitions.forEach((x,i)=>h+=`<div class="item"><b>${esc(x.line||"全ライン")}</b><br>${esc(x.from)} → ${esc(x.to)}：${x.allowed===false?"切替不可能":fmt(x.time)+"分"}<button data-e="${i}">編集</button></div>`);
  h+=`<button class="green" id="add">＋段取り追加</button><button class="gray" id="back">戻る</button></div>`;
  app.innerHTML=h;document.getElementById("add").onclick=()=>transEdit(-1);document.getElementById("back").onclick=home;document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>transEdit(n(b.dataset.e)));
}
function transEdit(i){
  const x=i>=0?transitions[i]:{line:"",from:"",to:"",time:0,allowed:true};
  app.innerHTML=`<div class="card"><h2>段取り設定</h2><label>ライン（空欄=全ライン）<input id="line" value="${esc(x.line||"")}"></label><label>変更前<input id="from" value="${esc(x.from||"")}"></label><label>変更後<input id="to" value="${esc(x.to||"")}"></label><label>段取り時間（分）<input id="time" type="number" value="${x.time||0}"></label><label><input id="allowed" type="checkbox" ${x.allowed!==false?"checked":""}> 切替可能</label><button class="green" id="save">保存</button><button class="gray" id="back">戻る</button></div>`;
  document.getElementById("save").onclick=()=>{const o={...x,line:document.getElementById("line").value.trim(),from:document.getElementById("from").value.trim(),to:document.getElementById("to").value.trim(),time:n(document.getElementById("time").value),allowed:document.getElementById("allowed").checked};if(i<0)transitions.push(o);else transitions[i]=o;save(K.trans,transitions);transPage()};
  document.getElementById("back").onclick=transPage;
}
function schedulePage(){
  let h=`<div class="card"><h2>稼働時間設定</h2>`;
  lines.forEach((l,li)=>{const s=lineSchedule(li);h+=`<div class="item"><b>${esc(l.name)}</b>`;
    s.days.forEach((d,di)=>h+=`<div class="item"><label><input type="checkbox" data-en="${li}-${di}" ${d.enabled?"checked":""}> ${d.day}曜日</label><div class="row"><label>開始<input type="time" data-st="${li}-${di}" value="${d.start||"08:00"}"></label><label>終了<input type="time" data-ed="${li}-${di}" value="${d.end||"17:00"}"></label></div><label>休憩分<input type="number" data-br="${li}-${di}" value="${n(d.breakMin??60)}"></label></div>`);
    h+=`</div>`});
  h+=`<button class="green" id="save">保存</button><button class="gray" id="back">戻る</button></div>`;
  app.innerHTML=h;
  document.getElementById("save").onclick=()=>{lines.forEach((l,li)=>{const s=lineSchedule(li);s.days.forEach((d,di)=>{d.enabled=document.querySelector(`[data-en="${li}-${di}"]`)?.checked;d.start=document.querySelector(`[data-st="${li}-${di}"]`)?.value||d.start;d.end=document.querySelector(`[data-ed="${li}-${di}"]`)?.value||d.end;d.breakMin=n(document.querySelector(`[data-br="${li}-${di}"]`)?.value)});});save(K.schedules,schedules);alert("保存しました")};
  document.getElementById("back").onclick=home;
}
home();
</script>
</body>
</html>
