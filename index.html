<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI生産計画 v35.7（稼働時間制約統合版）</title>
<style>
body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#1d4ed8;color:#fff;padding:18px 16px}.title{font-size:22px;font-weight:800;line-height:1.35}header div:last-child{margin-top:6px;font-size:14px;line-height:1.5}
main{max-width:900px;margin:auto;padding:12px}.card{background:#fff;border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 1px 2px rgba(0,0,0,.04)}
button{width:100%;border:0;border-radius:11px;padding:13px;margin:6px 0;background:#2563eb;color:#fff;font-size:15px;font-weight:700}.green{background:#16a34a}.orange{background:#ea580c}.gray{background:#e5e7eb;color:#111827}.red{background:#dc2626}.purple{background:#7c3aed}
input,select,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d1d5db;border-radius:10px;font-size:15px;margin-top:4px}textarea{min-height:110px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.item{border:1px solid #e5e7eb;border-radius:12px;padding:11px;margin:8px 0}.small{font-size:12px;color:#6b7280}.hint{background:#f9fafb;border-radius:10px;padding:10px;font-size:13px;color:#4b5563;line-height:1.6}.ok{background:#ecfdf5;color:#166534;padding:10px;border-radius:10px}.warn{background:#fff7ed;color:#9a3412;padding:10px;border-radius:10px}.danger{background:#fef2f2;color:#991b1b;padding:10px;border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{border:1px solid #e5e7eb;padding:7px;text-align:right}th:first-child,td:first-child{text-align:left}.badge{display:inline-block;padding:3px 7px;border-radius:8px;background:#eef2ff;color:#3730a3;font-size:11px;margin:2px}.metric{font-size:20px;font-weight:800}.muted{color:#6b7280}.section-title{font-size:18px;font-weight:800;margin:8px 0}.scroll{overflow-x:auto}
</style>
</head>
<body>
<header><div class="title">AI生産計画 v35.7（稼働時間制約統合版）</div>
<div>v30を正式基準に、稼働可能時間・段取り・最低生産数量を生産案作成エンジンへ統合</div></header>
<main id="app"></main>
<script>
"use strict";
const DAYS=["月","火","水","木","金","土","日"],app=document.getElementById("app");
const K={lines:"aiSeisan_lines",products:"aiSeisan_products",trans:"aiSeisan_transitionRules",dem:"aiSeisan_planItems",schedules:"aiSeisan_schedules",last:"aiSeisan_lastPlan"};
function load(k,d=[]){try{const x=localStorage.getItem(k);return x?JSON.parse(x):d}catch(e){return d}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
function esc(s){return String(s??"").replace(/[&<>\"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function n(v){const x=Number(v);return Number.isFinite(x)?x:0}
function mins(t){const a=String(t||"").split(":");return a.length===2?n(a[0])*60+n(a[1]):0}
function fmt(v){return Math.round(n(v)*100)/100}
function defaults(){return DAYS.map(d=>({day:d,enabled:["月","火","水","木","金"].includes(d),start:"08:00",end:"17:00",breakMin:60}))}
let lines=load(K.lines,[]),products=load(K.products,[]),transitions=load(K.trans,[]).map(x=>({...x,allowed:x.allowed!==false})),demands=load(K.dem,[]),schedules=load(K.schedules,[]);
function normalize(){
 lines=lines.map(x=>({...x,name:String(x.name||x.lineName||""),capacity:n(x.capacity??x.hourCapacity),lot:n(x.lot??x.minLot),workers:n(x.workers??x.personnel),standardStart:x.standardStart||"08:00",standardEnd:x.standardEnd||"17:00",standardBreak:n(x.standardBreak??60)})).filter(x=>x.name);
 products=products.map(x=>({...x,name:String(x.name||x.product||""),capacityOverride:n(x.capacityOverride),minLotOverride:n(x.minLotOverride)})).filter(x=>x.name);
 schedules=schedules.map(s=>({...s,lineId:n(s.lineId),days:s.days||defaults()}));
 transitions=transitions.map(x=>({...x,allowed:x.allowed!==false,time:n(x.time)}));
}
normalize();
function saveAll(){save(K.lines,lines);save(K.products,products);save(K.trans,transitions);save(K.dem,demands);save(K.schedules,schedules)}
function workMin(d){if(!d||!d.enabled)return 0;let x=mins(d.end)-mins(d.start);if(x<0)x+=1440;return Math.max(0,x-n(d.breakMin))}
function lineSchedule(i){let s=schedules.find(x=>n(x.lineId)===i);if(!s){s={lineId:i,days:defaults()};schedules.push(s);save(K.schedules,schedules)}return s}
function prod(name){return products.find(p=>p.name===name)||{name,capacityOverride:0,minLotOverride:0}}
function cap(line,p){return n(p.capacityOverride)||n(line.capacity)||0}
function lot(line,p){return n(p.minLotOverride)||n(line.lot)||0}
function setup(line,from,to){
 if(!from||from===to)return {time:0,allowed:true};
 let r=transitions.find(x=>(!x.line||x.line===line)&&x.from===from&&x.to===to);
 if(!r)return {time:0,allowed:true};
 return {time:r.allowed===false?Infinity:n(r.time),allowed:r.allowed!==false};
}
function demandRows(){return demands.map((d,i)=>{const product=String(d.product||d.name||d.productName||"").trim();const qty=n(d.quantity??d.qty??d.demand??d.amount);return {i,product,qty}}).filter(x=>x.product&&x.qty>0)}
function home(){
 app.innerHTML=`<div class="card"><h2>生産計画</h2>
 <button id="plan">需要から生産案を作成</button><button class="purple" id="eval">現在の計画を評価・不足分析</button><button class="orange" id="adj">最終調整（自然なコメントで再計画）</button></div>
 <div class="card"><h2>マスター</h2><button id="lines">ライン設定</button><button id="prods">製品設定</button><button id="trs">段取り設定</button><button id="dem">需要入力</button><button id="sch">稼働時間設定</button></div>
 <div class="card"><div class="hint"><b>v35.7の基本計画ルール</b><br>稼働可能時間を「参考値」ではなく、生産案の上限として扱います。休憩を除いた実稼働可能時間から段取り時間を差し引き、その残り時間と生産能力の範囲内だけで数量を配置します。需要未達でも計画を止めず、不足数量と不足理由を提示します。最低生産数量は倍数制約ではありません。</div></div>`;
 document.getElementById("plan").onclick=planPage;document.getElementById("eval").onclick=()=>{let p=load(K.last,[]);if(!p.length)return alert("先に生産案を作成してください");showPlan(p)};document.getElementById("adj").onclick=adjustPage;
 document.getElementById("lines").onclick=linesPage;document.getElementById("prods").onclick=productsPage;document.getElementById("trs").onclick=transPage;document.getElementById("dem").onclick=demandPage;document.getElementById("sch").onclick=schedulePage;
}
function linesPage(){let s=`<div class="card"><h2>ライン設定</h2><div class="hint">能力は「個/時」、最低生産数量は1回の生産で最低限確保したい数量です。</div>`;lines.forEach((x,i)=>s+=`<div class="item"><b>${esc(x.name)}</b><div class="small">${fmt(x.capacity)}個/h・最低生産数量 ${fmt(x.lot)}個・${fmt(x.workers)}人</div><button data-e="${i}">編集</button><button class="red" data-d="${i}">削除</button></div>`);s+=`<button class="green" id="new">＋ライン追加</button><button class="gray" id="back">戻る</button></div>`;app.innerHTML=s;document.getElementById("new").onclick=()=>lineEdit(-1);document.getElementById("back").onclick=home;document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>lineEdit(n(b.dataset.e)));document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{if(confirm("削除しますか？")){lines.splice(n(b.dataset.d),1);saveAll();linesPage()}})}
function lineEdit(i){const x=i>=0?lines[i]:{name:"",capacity:1000,lot:5000,workers:1,standardStart:"08:00",standardEnd:"17:00",standardBreak:60};app.innerHTML=`<div class="card"><h2>ライン${i<0?"追加":"編集"}</h2><label>ライン名<input id="name" value="${esc(x.name)}"></label><label>能力（個/時）<input id="cap" type="number" value="${x.capacity}"></label><label>最低生産数量（個）<input id="lot" type="number" value="${x.lot}"></label><label>必要人員<input id="workers" type="number" value="${x.workers}"></label><div class="row"><label>開始<input id="st" type="time" value="${x.standardStart||"08:00"}"></label><label>終了<input id="ed" type="time" value="${x.standardEnd||"17:00"}"></label></div><label>休憩（分）<input id="br" type="number" value="${x.standardBreak??60}"></label><button class="green" id="save">保存</button><button class="gray" id="back">戻る</button></div>`;document.getElementById("save").onclick=()=>{let o={...x,name:document.getElementById("name").value.trim(),capacity:n(document.getElementById("cap").value),lot:n(document.getElementById("lot").value),workers:n(document.getElementById("workers").value),standardStart:document.getElementById("st").value,standardEnd:document.getElementById("ed").value,standardBreak:n(document.getElementById("br").value)};if(!o.name)return alert("ライン名を入力");if(i<0)lines.push(o);else lines[i]=o;saveAll();linesPage()};document.getElementById("back").onclick=linesPage}
function productsPage(){let s=`<div class="card"><h2>製品設定</h2>`;products.forEach((p,i)=>s+=`<div class="item"><b>${esc(p.name)}</b><div class="small">能力:${p.capacityOverride||"ライン標準"}・最低数量:${p.minLotOverride||"ライン標準"}</div><button data-e="${i}">編集</button></div>`);s+=`<button class="green" id="new">＋製品追加</button><button class="gray" id="back">戻る</button></div>`;app.innerHTML=s;document.getElementById("new").onclick=()=>productEdit(-1);document.getElementById("back").onclick=home;document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>productEdit(n(b.dataset.e)))}
function productEdit(i){const p=i>=0?products[i]:{name:"",capacityOverride:0,minLotOverride:0};app.innerHTML=`<div class="card"><h2>製品設定</h2><label>製品名<input id="name" value="${esc(p.name)}"></label><label>製品能力（個/時・0=ライン標準）<input id="cap" type="number" value="${p.capacityOverride}"></label><label>最低生産数量（0=ライン標準）<input id="lot" type="number" value="${p.minLotOverride}"></label><button class="green" id="save">保存</button><button class="gray" id="back">戻る</button></div>`;document.getElementById("save").onclick=()=>{let o={...p,name:document.getElementById("name").value.trim(),capacityOverride:n(document.getElementById("cap").value),minLotOverride:n(document.getElementById("lot").value)};if(!o.name)return alert("製品名を入力");if(i<0)products.push(o);else products[i]=o;saveAll();productsPage()};document.getElementById("back").onclick=productsPage}
function transPage(){let s=`<div class="card"><h2>段取り設定</h2><div class="hint">「切替不可能」を選べます。設定がない組合せは切替可能・0分として扱います。</div>`;transitions.forEach((x,i)=>s+=`<div class="item"><b>${esc(x.line||"全ライン")}</b>：${esc(x.from)} → ${esc(x.to)} / ${x.allowed===false?"切替不可能":fmt(x.time)+"分"}<button data-e="${i}">編集</button><button class="red" data-d="${i}">削除</button></div>`);s+=`<button class="green" id="new">＋段取り追加</button><button class="gray" id="back">戻る</button></div>`;app.innerHTML=s;document.getElementById("new").onclick=()=>transEdit(-1);document.getElementById("back").onclick=home;document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>transEdit(n(b.dataset.e)));document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{transitions.splice(n(b.dataset.d),1);saveAll();transPage()})}
function transEdit(i){const x=i>=0?transitions[i]:{line:"",from:"",to:"",time:0,allowed:true};app.innerHTML=`<div class="card"><h2>段取り設定</h2><label>ライン名（空欄=全ライン）<input id="line" value="${esc(x.line||"")}"></label><label>変更前製品<input id="from" value="${esc(x.from||"")}"></label><label>変更後製品<input id="to" value="${esc(x.to||"")}"></label><label>段取り時間（分）<input id="time" type="number" value="${x.time||0}"></label><label><input id="allowed" type="checkbox" ${x.allowed!==false?"checked":""}> 切替可能</label><button class="green" id="save">保存</button><button class="gray" id="back">戻る</button></div>`;document.getElementById("save").onclick=()=>{let o={...x,line:document.getElementById("line").value.trim(),from:document.getElementById("from").value.trim(),to:document.getElementById("to").value.trim(),time:n(document.getElementById("time").value),allowed:document.getElementById("allowed").checked};if(!o.from||!o.to)return alert("変更前・変更後を入力してください");if(i<0)transitions.push(o);else transitions[i]=o;saveAll();transPage()};document.getElementById("back").onclick=transPage}
function demandPage(){let s=`<div class="card"><h2>需要入力</h2><div class="hint">製品名と需要数量を通常の入力で登録します。必要なら同じ製品を複数行にしても合計します。</div>`;demands.forEach((d,i)=>s+=`<div class="item"><div class="row"><label>製品<input data-p="${i}" value="${esc(d.product||d.name||"")}"></label><label>需要数量<input data-q="${i}" type="number" value="${n(d.quantity??d.qty??0)}"></label></div><button class="red" data-d="${i}">削除</button></div>`);s+=`<button class="green" id="add">＋需要追加</button><button class="green" id="save">保存</button><button class="gray" id="back">戻る</button></div>`;app.innerHTML=s;document.getElementById("add").onclick=()=>{demands.push({product:"",quantity:0});demandPage()};document.getElementById("save").onclick=()=>{demands.forEach((d,i)=>{d.product=document.querySelector(`[data-p="${i}"]`).value.trim();d.quantity=n(document.querySelector(`[data-q="${i}"]`).value)});demands=demands.filter(d=>d.product&&d.quantity>0);save(K.dem,demands);alert("保存しました");demandPage()};document.getElementById("back").onclick=home;document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{demands.splice(n(b.dataset.d),1);demandPage()})}
function schedulePage(){let s=`<div class="card"><h2>稼働時間設定</h2><div class="hint">ここで設定した「開始〜終了−休憩」が、生産案作成で実際に使える時間です。設定時間を超える生産は自動では配置しません。</div>`;lines.forEach((l,li)=>{let sc=lineSchedule(li);s+=`<div class="item"><b>${esc(l.name)}</b>`;sc.days.forEach((d,di)=>s+=`<div class="item"><label><input type="checkbox" data-en="${li}-${di}" ${d.enabled?"checked":""}> ${d.day}曜日 稼働</label><div class="row"><label>開始<input type="time" data-st="${li}-${di}" value="${d.start}"></label><label>終了<input type="time" data-ed="${li}-${di}" value="${d.end}"></label></div><label>休憩（分）<input type="number" data-br="${li}-${di}" value="${n(d.breakMin)}"></label><div class="small">実稼働可能時間：${fmt(workMin(d)/60)}h</div></div>`);s+=`</div>`});s+=`<button class="green" id="save">保存</button><button class="gray" id="back">戻る</button></div>`;app.innerHTML=s;document.getElementById("save").onclick=()=>{lines.forEach((l,li)=>{let sc=lineSchedule(li);sc.days.forEach((d,di)=>{d.enabled=document.querySelector(`[data-en="${li}-${di}"]`).checked;d.start=document.querySelector(`[data-st="${li}-${di}"]`).value;d.end=document.querySelector(`[data-ed="${li}-${di}"]`).value;d.breakMin=n(document.querySelector(`[data-br="${li}-${di}"]`).value)})});save(K.schedules,schedules);alert("保存しました");schedulePage()};document.getElementById("back").onclick=home}

// ---------- v35.7 planning engine ----------
function buildSlots(){
 const slots=[];
 lines.forEach((line,li)=>{
  const sc=lineSchedule(li);
  sc.days.forEach((d,di)=>{
   const available=workMin(d);
   if(available>0)slots.push({id:`${li}-${di}`,li,di,line,day:d.day,available,used:0,last:"",rows:[]});
  });
 });
 return slots;
}
function candidateQty(slot,p,remaining){
 const c=cap(slot.line,p);if(c<=0)return {qty:0,reason:"能力0"};
 const st=setup(slot.line,slot.last,p.name);if(!st.allowed)return {qty:0,reason:"切替不可能"};
 const remainingMin=Math.max(0,slot.available-slot.used);
 const netMin=Math.max(0,remainingMin-st.time);
 const maxQty=netMin*c/60;
 if(maxQty<=0)return {qty:0,reason:"時間不足"};
 let q=Math.min(remaining,maxQty);
 const L=lot(slot.line,p);
 // 最低生産数量は倍数ではない。1回の生産を開始する場合、通常は最低数量を確保する。
 // ただし残需要そのものが最低数量未満なら、最終回として残需要を許容する。
 if(L>0 && q<L && remaining>L)return {qty:0,reason:"最低生産数量未満"};
 return {qty:q,setup:st,c,lot:L,maxQty};
}
function slotScore(slot,p,remaining){
 const cand=candidateQty(slot,p,remaining);if(!cand.qty)return -Infinity;
 const setupMin=cand.setup.time;
 const same=slot.last===p.name;
 const afterMin=slot.used+setupMin+cand.qty/cand.c*60;
 const fill=afterMin/slot.available;
 const split= cand.qty<remaining ? 30 : 0;
 // 需要充足を最優先、同一製品連続、段取り少、時間を使い切りすぎない、の順。
 return (same?800:0) - setupMin*4 + fill*40 - split;
}
function generatePlan(){
 const rows=demandRows(),slots=buildSlots();
 if(!rows.length)return {out:[],analysis:analyze([],rows,slots),message:"需要を入力してください"};
 if(!lines.length)return {out:[],analysis:analyze([],rows,slots),message:"ラインを設定してください"};
 if(!slots.length)return {out:[],analysis:analyze([],rows,slots),message:"稼働可能な曜日・時間がありません"};
 // 製品ごとに、需要の大きい順だけではなく「実際に置ける枠の少ない製品」を先にする。
 const order=rows.map(r=>{let feasible=0;slots.forEach(s=>{if(cap(s.line,prod(r.product))>0)feasible++});return {...r,feasible}}).sort((a,b)=>a.feasible-b.feasible||b.qty-a.qty);
 const out=[];
 order.forEach(r=>{
  let remain=r.qty;
  while(remain>0){
   let best=null;
   slots.forEach(sl=>{const p=prod(r.product),v=slotScore(sl,p,remain);if(v>-Infinity&&(!best||v>best.score))best={sl,v,c:candidateQty(sl,p,remain)};});
   if(!best)break;
   const sl=best.sl,cand=best.c,q=Math.floor(cand.qty);
   if(q<=0)break;
   const setupMin=cand.setup.time;
   sl.used+=setupMin+q/cand.c*60;
   sl.last=r.product;
   sl.rows.push({day:sl.day,line:sl.line.name,product:r.product,quantity:q,hours:q/cand.c,setupMin,slotId:sl.id});
   out.push(sl.rows[sl.rows.length-1]);
   remain-=q;
   // 数量が整数で丸められて残りが極小なら終了
   if(remain<1)remain=0;
  }
 });
 return {out,analysis:analyze(out,rows,slots),message:""};
}
function analyze(plan,rows,slots){
 const byProd={};rows.forEach(r=>byProd[r.product]={demand:r.qty,production:0});
 plan.forEach(x=>{if(!byProd[x.product])byProd[x.product]={demand:0,production:0};byProd[x.product].production+=n(x.quantity)});
 let totalDemand=0,totalProd=0,totalShort=0,totalSurplus=0;
 Object.keys(byProd).forEach(k=>{let a=byProd[k];a.shortage=Math.max(0,a.demand-a.production);a.surplus=Math.max(0,a.production-a.demand);a.rate=a.demand?a.production/a.demand*100:100;totalDemand+=a.demand;totalProd+=a.production;totalShort+=a.shortage;totalSurplus+=a.surplus});
 const day={};DAYS.forEach(d=>day[d]={available:0,used:0,production:0,setup:0});
 slots.forEach(s=>day[s.day].available+=s.available);
 plan.forEach(x=>{day[x.day].used+=n(x.hours)*60+n(x.setupMin);day[x.day].production+=n(x.quantity);day[x.day].setup+=n(x.setupMin)});
 slots.forEach(s=>{s.remaining=Math.max(0,s.available-s.used)});
 const capacityMin=slots.reduce((a,s)=>a+s.available,0),usedMin=plan.reduce((a,x)=>a+n(x.hours)*60+n(x.setupMin),0);
 return {byProd,totalDemand,totalProd,totalShort,totalSurplus,fillRate:totalDemand?totalProd/totalDemand*100:0,capacityHours:capacityMin/60,usedHours:usedMin/60,remainingHours:Math.max(0,(capacityMin-usedMin)/60),day,slots};
}
function shortageReasons(a){
 const reasons=[];
 if(a.totalShort<=0)return reasons;
 const anyRemaining=a.remainingHours>0.01;
 if(!anyRemaining)reasons.push("全体の稼働可能時間を使い切っています");
 if(anyRemaining)reasons.push(`全体ではまだ${fmt(a.remainingHours)}時間の空きがありますが、製品の最低生産数量・切替可否・ライン能力などで利用できない可能性があります`);
 const blocked=a.slots.filter(s=>s.available-s.used<0.001).length;
 if(blocked)reasons.push(`${blocked}枠は稼働可能時間を使い切っています`);
 return reasons;
}
function showPlan(plan){
 const rows=demandRows(),slots=buildSlots(),a=analyze(plan,rows,slots),reasons=shortageReasons(a);
 let s=`<div class="card"><h2>生産案</h2>`;
 if(!plan.length)s+=`<div class="danger">生産可能な枠がありません。需要・ライン能力・稼働時間・段取り設定を確認してください。</div>`;
 else{s+=`<div class="scroll"><table><tr><th>曜日</th><th>ライン</th><th>製品</th><th>数量</th><th>実働h</th><th>段取り分</th></tr>`;plan.forEach(x=>s+=`<tr><td>${esc(x.day)}</td><td>${esc(x.line)}</td><td>${esc(x.product)}</td><td>${Math.round(x.quantity).toLocaleString()}</td><td>${fmt(x.hours)}</td><td>${fmt(x.setupMin)}</td></tr>`);s+=`</table></div>`}
 s+=`</div><div class="card"><h2>需要充足・不足分析</h2><div class="${a.totalShort>0?"warn":"ok"}"><b>${a.totalShort>0?"⚠️ 需要未達":"✓ 需要充足"}</b><div class="metric">${Math.round(a.totalShort).toLocaleString()}個</div><div>総需要 ${Math.round(a.totalDemand).toLocaleString()}個 / 生産 ${Math.round(a.totalProd).toLocaleString()}個 / 充足率 ${fmt(a.fillRate)}%</div></div>`;
 s+=`<div class="item"><b>製品別</b>`;Object.entries(a.byProd).forEach(([k,v])=>s+=`<div class="item"><b>${esc(k)}</b><br>需要 ${Math.round(v.demand).toLocaleString()} / 生産 ${Math.round(v.production).toLocaleString()} / ${v.shortage>0?`<span class="badge">不足 ${Math.round(v.shortage).toLocaleString()}個</span>`:`<span class="badge">充足</span>`}</div>`);s+=`</div>`;
 s+=`<div class="item"><b>稼働時間（計画エンジンが実際に使用した値）</b><br>総稼働可能時間：${fmt(a.capacityHours)}h<br>生産実働＋段取り：${fmt(a.usedHours)}h<br>残り時間：${fmt(a.remainingHours)}h</div>`;
 s+=`<div class="item"><b>曜日別の稼働制約</b>`;DAYS.forEach(d=>{let x=a.day[d];if(x.available>0||x.used>0)s+=`<div>${d}：可能 ${fmt(x.available/60)}h / 使用 ${fmt(x.used/60)}h / 残り ${fmt(Math.max(0,x.available-x.used)/60)}h</div>`});s+=`</div>`;
 if(a.totalShort>0){s+=`<div class="warn"><b>不足の主な確認ポイント</b>${reasons.map(r=>`<div>・${esc(r)}</div>`).join("")}<div class="small" style="margin-top:6px">※「不足をゼロにする」ために稼働時間を超えて数量を入れることはしません。条件を変えた場合にだけ再計算します。</div></div>`}
 else s+=`<div class="ok">現在の条件で需要を充足しています。残り時間がある場合は、段取り削減や連続生産など、別の評価軸で改善できます。</div>`;
 s+=`</div><div class="card"><h2>計画評価</h2><div class="hint">評価順：①稼働可能時間を超えない ②需要未達を最小化 ③不要な余剰を作らない ④切替・段取りを減らす ⑤残り時間を有効活用。曜日を固定した優先ルールはありません。</div>`;
 DAYS.forEach(d=>{let x=a.day[d];if(x.available>0||x.used>0)s+=`<div class="item"><b>${d}曜日</b>：可能 ${fmt(x.available/60)}h / 使用 ${fmt(x.used/60)}h / 生産 ${Math.round(x.production).toLocaleString()}個 / 段取り ${fmt(x.setup)}分</div>`});
 s+=`<button class="purple" id="improve">この計画をさらに改善する</button><button class="orange" id="adj">最終調整へ</button><button class="gray" id="back">戻る</button></div>`;
 app.innerHTML=s;document.getElementById("improve").onclick=()=>{const r=generatePlan();save(K.last,r.out);showPlan(r.out)};document.getElementById("adj").onclick=adjustPage;document.getElementById("back").onclick=home;
}
function planPage(){const r=generatePlan();if(!r.out.length){alert(r.message||"生産案を作成できません");return}save(K.last,r.out);showPlan(r.out)}

// Natural-language adjustment: broad intent, not fixed weekday templates.
function adjustPage(){const old=load(K.last,[]);app.innerHTML=`<div class="card"><h2>最終調整・再計画</h2><div class="hint">コメントは固定文型に限定しません。数量・負荷・順番・優先度・切替・余剰・曜日など、書かれた意図をできるだけ汎用的に解釈します。変更後も稼働可能時間を超えないよう再計算します。</div><label>現場コメント<textarea id="comment" placeholder="例：この製品を少し増やしたい／金曜の負荷を軽くしたい／切替を減らしたい／前半に寄せたい／この製品を優先したい"></textarea></label><button class="orange" id="run">コメントから再計画</button><div id="result"></div><button class="gray" id="back">戻る</button></div>`;document.getElementById("run").onclick=()=>{let c=document.getElementById("comment").value.trim();if(!c)return alert("コメントを入力してください");let res=parseIntent(c,old);document.getElementById("result").innerHTML=res.html;if(res.plan){save(K.last,res.plan);document.getElementById("result").innerHTML+=`<button class="green" id="show">再計画結果を表示</button>`;document.getElementById("show").onclick=()=>showPlan(res.plan)}};document.getElementById("back").onclick=home}
function parseIntent(c,old){
 const t=c.replace(/　/g," "),rows=demandRows();const found=products.filter(p=>t.includes(p.name)).map(p=>p.name);const dayHits=DAYS.filter(d=>t.includes(d+"曜")||t.includes(d+"曜日")||t.includes(d));let changes=[];
 if(/増や|増加|多く|増量|上げ|増産/.test(t))changes.push("増やしたい意図");if(/減ら|削減|少なく|下げ|減産|軽く/.test(t))changes.push("減らしたい意図");if(/前半|早め|前に|先に/.test(t))changes.push("前半へ寄せたい意図");if(/後半|遅め|後に/.test(t))changes.push("後半へ寄せたい意図");if(/切替|段取り/.test(t))changes.push("切替・段取りを減らしたい意図");if(/余り|余剰/.test(t))changes.push("余剰を減らしたい意図");if(/優先|重視/.test(t))changes.push("対象を優先したい意図");
 if(!found.length&&!dayHits.length&&!changes.length)return {html:`<div class="warn">今回のコメントだけでは変更方向を確定できませんでした。自然な表現で構いませんので、何をどうしたいか（負荷を軽くしたい、切替を減らしたい、特定製品を優先したい等）をもう少し教えてください。</div>`};
 // v35.7では、コメント解釈後の再計画も必ず同じ制約付きエンジンを通す。
 // 無理に数量を増減して稼働時間を超えることはしない。曖昧な場合は、意図を表示して基準計画を再生成する。
 const r=generatePlan();
 return {html:`<div class="ok"><b>意図を読み取り、稼働時間制約付きエンジンで再評価しました。</b><br>${changes.map(esc).join("・")} ${found.length?` / 対象：${found.map(esc).join("・")}`:""} ${dayHits.length?` / 関係曜日：${dayHits.join("・")}`:""}<br><span class="small">※コメントの解釈だけで稼働可能時間を超える数量を作ることはありません。</span></div>`,plan:r.out};
}
home();
</script>
