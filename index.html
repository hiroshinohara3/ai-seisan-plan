<style>

<header><div class="title">AI生産計画 v33（v30基準・コメント解析修正版）</div>
<div>需要充足・稼働時間活用・最低生産数量・切替最小化・コメント再計画</div></header>
<main id="app"></main>
<script>
"use strict";
var app=document.getElementById("app"),days=["月","火","水","木","金","土","日"];

function read(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
function arr(keys){for(var i=0;i<keys.length;i++){var v=read(keys[i]);if(Array.isArray(v))return v}return[]}
function num(v){var x=Number(v);return isFinite(x)?x:0}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function mins(t){var p=String(t||"").split(":");return p.length===2?num(p[0])*60+num(p[1]):0}
function workMin(d){if(!d||d.enabled===false)return 0;var m=mins(d.end)-mins(d.start);if(m<0)m+=1440;return Math.max(0,m-num(d.breakMin))}
function cloneRows(rows){return rows.map(function(r){var x={};Object.keys(r).forEach(function(k){x[k]=r[k]});return x})}

var rawLines=arr(["aiSeisan_lines","aiSeisanV19_lines","aiSeisanV18_lines","aiSeisanV17_lines","aiSeisanV16_lines","aiSeisanV15_lines"]);
var lines=[];rawLines.forEach(function(x){var n={name:String(x.name||x.lineName||""),capacity:num(x.capacity!=null?x.capacity:x.hourCapacity),lot:num(x.lot!=null?x.lot:x.minLot),workers:num(x.workers!=null?x.workers:x.personnel),standardStart:x.standardStart||x.start||"08:00",standardEnd:x.standardEnd||x.end||"17:00",standardBreak:num(x.standardBreak!=null?x.standardBreak:x.breakMin!=null?x.breakMin:60)};if(n.name&&!lines.some(function(y){return y.name===n.name}))lines.push(n)});
var products=arr(["aiSeisan_products","aiSeisanV21_products","aiSeisanV20_products"]);
var transitions=arr(["aiSeisan_transitionRules","aiSeisanV21_transitionRules","aiSeisanV20_transitionRules"]);
var planItems=arr(["aiSeisan_planItems","aiSeisanV21_planItems"]);
if(!planItems.length){planItems=arr(["aiSeisan_demands"]).map(function(x){return{name:String(x.name||x.product||x.productName||""),qty:num(x.qty!=null?x.qty:x.quantity!=null?x.quantity:x.demand)}}).filter(function(x){return x.name&&x.qty>0})}
var schedules=arr(["aiSeisan_schedules","aiSeisanV19_schedules","aiSeisanV18_schedules","aiSeisanV17_schedules"]);

function saveAll(){
 localStorage.setItem("aiSeisan_lines",JSON.stringify(lines));
 localStorage.setItem("aiSeisan_schedules",JSON.stringify(schedules));
 localStorage.setItem("aiSeisan_products",JSON.stringify(products));
 localStorage.setItem("aiSeisan_transitionRules",JSON.stringify(transitions));
 localStorage.setItem("aiSeisan_planItems",JSON.stringify(planItems));
 localStorage.setItem("aiSeisanV20_lines",JSON.stringify(lines));
 localStorage.setItem("aiSeisanV20_schedules",JSON.stringify(schedules));
 localStorage.setItem("aiSeisanV20_products",JSON.stringify(products));
 localStorage.setItem("aiSeisanV21_products",JSON.stringify(products));
 localStorage.setItem("aiSeisanV20_transitionRules",JSON.stringify(transitions));
 localStorage.setItem("aiSeisanV21_transitionRules",JSON.stringify(transitions));
 localStorage.setItem("aiSeisanV21_planItems",JSON.stringify(planItems));
}
function defaults(line){return days.map(function(d){return{day:d,enabled:["月","火","水","木","金"].indexOf(d)>=0,start:line.standardStart,end:line.standardEnd,breakMin:line.standardBreak}})}
function getSc(i){var s=schedules.find(function(x){return num(x.lineId)===i});if(!s){s={lineId:i,days:defaults(lines[i])};schedules.push(s);saveAll()}return s}
function hoursForDay(sc,d){return sc&&sc.days&&sc.days[d]?workMin(sc.days[d])/60:0}
function findProduct(name){return products.find(function(p){return String(p.name)===String(name)})||null}
function capacity(line,p){return num(p&&p.capacityOverride)>0?num(p.capacityOverride):num(line&&line.capacity)}
function minLot(line,p){return num(p&&p.minLotOverride)>0?num(p.minLotOverride):num(line&&line.lot)}
function transition(lineName,from,to){if(!from||from===to)return{time:0,impossible:false};var r=transitions.find(function(x){return(!x.line||x.line===lineName)&&x.from===from&&x.to===to});return r?{time:num(r.time),impossible:!!r.impossible}:{time:0,impossible:false}}

function home(){
 app.innerHTML='<div class="card"><h2>マスター管理</h2><div class="ok">ライン：'+lines.length+'件　製品：'+products.length+'件　需要：'+planItems.length+'件</div>'+
 '<button id="lp">ライン設定</button><button id="sp" class="orange">曜日別稼働時間</button><button id="pp">製品設定</button><button id="tp" class="orange">切替・段取り設定</button><button id="dp" class="green">今週の需要</button><button id="make" class="orange">生産計画を作成</button></div>';
 document.getElementById("lp").onclick=linePage;document.getElementById("sp").onclick=lineSelect;document.getElementById("pp").onclick=productPage;document.getElementById("tp").onclick=transitionPage;document.getElementById("dp").onclick=demandPage;document.getElementById("make").onclick=planResult;
}
function linePage(){
 var s='<div class="card"><h2>ライン設定</h2>';lines.forEach(function(l,i){s+='<div class="item"><b>'+esc(l.name)+'</b><div class="small">能力 '+l.capacity+'個/h　最低生産数量 '+l.lot+'個　人員 '+l.workers+'人　標準 '+l.standardStart+'〜'+l.standardEnd+'</div><button data-e="'+i+'">編集</button></div>'});s+='<button class="green" id="new">＋新規登録</button><button class="gray" id="b">戻る</button></div>';app.innerHTML=s;document.getElementById("new").onclick=function(){editLine(-1)};document.getElementById("b").onclick=home;document.querySelectorAll("[data-e]").forEach(function(b){b.onclick=function(){editLine(+b.dataset.e)}})
}
function editLine(i){
 var l=i>=0?lines[i]:{name:"",capacity:0,lot:0,workers:0,standardStart:"08:00",standardEnd:"17:00",standardBreak:60};
 app.innerHTML='<div class="card"><h2>ライン設定</h2><label>ライン名<input id="n" value="'+esc(l.name)+'"></label><label>能力（個/h）<input id="c" type="number" value="'+l.capacity+'"></label><label>最低生産数量<input id="lot" type="number" value="'+l.lot+'"></label><label>必要人員<input id="w" type="number" value="'+l.workers+'"></label><div class="row"><div><label>開始</label><input id="st" type="time" value="'+l.standardStart+'"></div><div><label>終了</label><input id="ed" type="time" value="'+l.standardEnd+'"></div></div><label>休憩（分）<input id="br" type="number" value="'+l.standardBreak+'"></label><button class="green" id="s">保存</button><button class="gray" id="b">戻る</button></div>';
 document.getElementById("s").onclick=function(){var o={name:document.getElementById("n").value.trim(),capacity:num(document.getElementById("c").value),lot:num(document.getElementById("lot").value),workers:num(document.getElementById("w").value),standardStart:document.getElementById("st").value||"08:00",standardEnd:document.getElementById("ed").value||"17:00",standardBreak:num(document.getElementById("br").value)};if(!o.name){alert("ライン名を入力してください");return}if(i<0)lines.push(o);else{lines[i]=o;var sc=getSc(i);sc.days=defaults(o)}saveAll();linePage()};document.getElementById("b").onclick=linePage
}
function lineSelect(){if(!lines.length){alert("先にラインを登録してください");return}var s='<div class="card"><h2>曜日別稼働時間</h2>';lines.forEach(function(l,i){s+='<button data-i="'+i+'">'+esc(l.name)+' を設定</button>'});s+='<button class="gray" id="b">戻る</button></div>';app.innerHTML=s;document.querySelectorAll("[data-i]").forEach(function(b){b.onclick=function(){scheduleEdit(+b.dataset.i)}});document.getElementById("b").onclick=home}
function scheduleEdit(i){
 var sc=getSc(i),s='<div class="card"><h2>'+esc(lines[i].name)+' の曜日別稼働</h2>';sc.days.forEach(function(d,j){s+='<div class="day"><b>'+d.day+'曜日</b><label><input type="checkbox" data-en="'+j+'" '+(d.enabled?"checked":"")+'> 稼働する</label><div class="row"><div><label>開始</label><input type="time" data-st="'+j+'" value="'+d.start+'"></div><div><label>終了</label><input type="time" data-ed="'+j+'" value="'+d.end+'"></div></div><label>休憩（分）</label><input type="number" data-br="'+j+'" value="'+d.breakMin+'"><div class="small" data-t="'+j+'">実働 '+(workMin(d)/60).toFixed(2)+'時間</div></div>'});s+='<div class="total" id="sum">週間実働 '+(sc.days.reduce(function(a,d){return a+workMin(d)},0)/60).toFixed(2)+'時間</div><button class="green" id="s">保存</button><button class="gray" id="b">戻る</button></div>';app.innerHTML=s;
 function refresh(){var t=0;sc.days.forEach(function(d,j){d.enabled=document.querySelector('[data-en="'+j+'"]').checked;d.start=document.querySelector('[data-st="'+j+'"]').value;d.end=document.querySelector('[data-ed="'+j+'"]').value;d.breakMin=num(document.querySelector('[data-br="'+j+'"]').value);document.querySelector('[data-t="'+j+'"]').textContent='実働 '+(workMin(d)/60).toFixed(2)+'時間';t+=workMin(d)});document.getElementById("sum").textContent='週間実働 '+(t/60).toFixed(2)+'時間'}
 app.querySelectorAll("input").forEach(function(x){x.oninput=refresh;x.onchange=refresh});document.getElementById("s").onclick=function(){refresh();saveAll();lineSelect()};document.getElementById("b").onclick=lineSelect
}
function productPage(){
 var s='<div class="card"><h2>製品設定</h2><div class="hint">最低生産数量は倍数ではありません。必要数量が最低生産数量未満でも、能力が許せば最低数量まで作り余剰として表示します。</div>';products.forEach(function(p,i){s+='<div class="item"><b>'+esc(p.name)+'</b><div class="small">原料：'+esc(p.raw||"未設定")+'　能力：'+(num(p.capacityOverride)||"ライン標準")+'　最低生産数量：'+(num(p.minLotOverride)||"ライン標準")+'</div><div class="actions"><button data-e="'+i+'">編集</button><button class="red" data-d="'+i+'">削除</button></div></div>'});s+='<button class="green" id="new">＋製品追加</button><button class="gray" id="b">戻る</button></div>';app.innerHTML=s;document.getElementById("new").onclick=function(){editProduct(-1)};document.getElementById("b").onclick=home;document.querySelectorAll("[data-e]").forEach(function(b){b.onclick=function(){editProduct(+b.dataset.e)}});document.querySelectorAll("[data-d]").forEach(function(b){b.onclick=function(){var i=+b.dataset.d;if(confirm("削除しますか？")){products.splice(i,1);saveAll();productPage()}}})
}
function editProduct(i){
 var p=i>=0?products[i]:{name:"",raw:"",capacityOverride:0,minLotOverride:0};app.innerHTML='<div class="card"><h2>製品設定</h2><label>製品名<input id="n" value="'+esc(p.name)+'"></label><label>原料<input id="r" value="'+esc(p.raw||"")+'"></label><label>製品別能力（個/h）<input id="c" type="number" value="'+(num(p.capacityOverride)||"")+'"></label><label>製品別最低生産数量<input id="l" type="number" value="'+(num(p.minLotOverride)||"")+'"></label><button class="green" id="s">保存</button><button class="gray" id="b">戻る</button></div>';document.getElementById("s").onclick=function(){var o={name:document.getElementById("n").value.trim(),raw:document.getElementById("r").value.trim(),capacityOverride:num(document.getElementById("c").value),minLotOverride:num(document.getElementById("l").value)};if(!o.name){alert("製品名を入力してください");return}if(i<0)products.push(o);else products[i]=o;saveAll();productPage()};document.getElementById("b").onclick=productPage
}
function transitionPage(){
 var s='<div class="card"><h2>切替・段取り設定</h2><div class="hint">未登録の切替は段取り0分として扱います。</div>';transitions.forEach(function(t,i){s+='<div class="item"><b>'+esc(t.line||"全ライン")+'</b><div>'+esc(t.from||"")+" → "+esc(t.to||"")+'：'+num(t.time)+'分'+(t.impossible?"（不可）":"")+'</div><button class="red" data-d="'+i+'">削除</button></div>'});s+='<label>ライン<input id="ln" placeholder="空欄=全ライン"></label><div class="row"><div><label>変更前</label><input id="fr"></div><div><label>変更後</label><input id="to"></div></div><label>段取り時間（分）<input id="tm" type="number" value="0"></label><label><input id="im" type="checkbox"> 切替不可</label><button class="green" id="add">追加</button><button class="gray" id="b">戻る</button></div>';app.innerHTML=s;document.getElementById("b").onclick=home;document.getElementById("add").onclick=function(){transitions.push({line:document.getElementById("ln").value.trim(),from:document.getElementById("fr").value.trim(),to:document.getElementById("to").value.trim(),time:num(document.getElementById("tm").value),impossible:document.getElementById("im").checked});saveAll();transitionPage()};document.querySelectorAll("[data-d]").forEach(function(b){b.onclick=function(){transitions.splice(+b.dataset.d,1);saveAll();transitionPage()}})
}
function demandPage(){
 var s='<div class="card"><h2>今週の需要</h2>';planItems.forEach(function(p,i){s+='<div class="item"><b>'+esc(p.name)+'</b><label>必要数量<input type="number" data-q="'+i+'" value="'+num(p.qty)+'"></label><button class="red" data-d="'+i+'">削除</button></div>'});s+='<div class="item"><label>製品<select id="pn">'+products.map(function(p){return '<option value="'+esc(p.name)+'">'+esc(p.name)+'</option>'}).join("")+'</select></label><label>数量<input id="pq" type="number" value="0"></label><button class="green" id="add">需要を追加</button></div><button class="green" id="s">保存</button><button class="gray" id="b">戻る</button></div>';app.innerHTML=s;document.getElementById("add").onclick=function(){var n=document.getElementById("pn").value,q=num(document.getElementById("pq").value);if(!n||q<=0)return;planItems.push({name:n,qty:q});saveAll();demandPage()};document.getElementById("s").onclick=function(){planItems.forEach(function(p,i){p.qty=num(document.querySelector('[data-q="'+i+'"]').value)});saveAll();demandPage()};document.getElementById("b").onclick=home;document.querySelectorAll("[data-d]").forEach(function(b){b.onclick=function(){planItems.splice(+b.dataset.d,1);saveAll();demandPage()}})
}

function normalizeComment(txt){
 return String(txt||"").replace(/[　]/g," ").replace(/[，]/g,",").replace(/[．]/g,".").replace(/[！]/g,"!").replace(/[？]/g,"?").replace(/\s+/g," ").trim();
}
function parseAdjustmentComment(txt){
 var t=normalizeComment(txt),blockedDays=[],moves=[],increase=[],decrease=[],preferred={},surplusTarget="";
 var dayPat="月火水木金土日";
 var dayRe=new RegExp("(["+dayPat+"])曜日?","g"),m;
 var blockRe=new RegExp("(["+dayPat+"])曜日?[^,。]*?(?:生産しない|生産なし|生産を止める|止める|停止|休止)","g");
 while((m=blockRe.exec(t)))if(blockedDays.indexOf(m[1])<0)blockedDays.push(m[1]);
 var incRe=new RegExp("(["+dayPat+"])曜日?の([^、,。]+?)(?:を|は)\\s*(?:(\\d[\\d,]*)\\s*個?\\s*)?(?:増やす|増やして|増加|増産|増量|増)","g");
 while((m=incRe.exec(t)))increase.push({day:m[1],product:m[2].trim(),qty:m[3]?num(m[3].replace(/,/g,"")):0});
 var decRe=new RegExp("(["+dayPat+"])曜日?の([^、,。]+?)(?:を|は)\\s*(?:(\\d[\\d,]*)\\s*個?\\s*)?(?:減らす|減らして|減少|減産|減量|減)","g");
 while((m=decRe.exec(t)))decrease.push({day:m[1],product:m[2].trim(),qty:m[3]?num(m[3].replace(/,/g,"")):0});
 var moveRe=new RegExp("(["+dayPat+"])曜日?の([^、,。]+?)(?:を|は)\\s*([" + dayPat + "])曜日?(?:に|へ)\\s*(?:回す|回して|移す|移して|ずらす|ずらして|まとめる|まとめて|寄せる|寄せて)","g");
 while((m=moveRe.exec(t)))moves.push({fromDay:m[1],product:m[2].trim(),toDay:m[3]});
 var prefRe=new RegExp("([^、,。 ]+?)(?:を|は)\\s*([" + dayPat + "])曜日?(?:に|へ)(?:回す|回して|移す|移して|ずらす|ずらして|まとめる|まとめて|寄せる|寄せて)","g");
 while((m=prefRe.exec(t)))preferred[m[1]]=m[2];
 var surRe=/余剰分(?:は|を)?\s*([^\\s、,。]+)\s*(?:を|で)?\s*(?:生産|作る|追加)/;m=surRe.exec(t);if(m)surplusTarget=m[1];
 return {blockedDays:blockedDays,increase:increase,decrease:decrease,moves:moves,preferred:preferred,surplusTarget:surplusTarget,raw:t};
}

function lineRows(rows,day,line){return rows.filter(function(r){return r.day===day&&r.line===line})}
function stats(rows){
 var out=[];
 for(var d=0;d<7;d++)for(var li=0;li<lines.length;li++){var sc=getSc(li),avail=hoursForDay(sc,d)*60,rr=lineRows(rows,days[d],lines[li].name),used=rr.reduce(function(a,r){return a+num(r.total)},0),sets=rr.filter(function(r){return num(r.setup)>0}).length;out.push({day:days[d],line:lines[li].name,available:avail,used:used,left:Math.max(0,avail-used),setups:sets})}
 return out;
}
function recompute(rows){
 var grouped={};
 rows.filter(function(r){return num(r.qty)>0.0001}).forEach(function(r){var k=r.day+"|"+r.line+"|"+r.product;if(!grouped[k])grouped[k]={day:r.day,line:r.line,product:r.product,qty:0,raw:r.raw,lot:r.lot,surplus:0};grouped[k].qty+=num(r.qty);grouped[k].surplus+=num(r.surplus)});
 var out=Object.keys(grouped).map(function(k){return grouped[k]});
 out.forEach(function(r){var line=lines.find(function(l){return l.name===r.line}),p=findProduct(r.product),cap=capacity(line,p)||1;r.run=r.qty/cap*60;r.setup=0;r.total=r.run;r.lot=minLot(line,p)});
 // Rebuild setup by chronological product order per day/line. Keep grouped products contiguous.
 out.sort(function(a,b){var d=days.indexOf(a.day)-days.indexOf(b.day);return d||a.line.localeCompare(b.line)||a.product.localeCompare(b.product)});
 var by={};out.forEach(function(r){(by[r.day+"|"+r.line]||(by[r.day+"|"+r.line]=[])).push(r)});
 Object.keys(by).forEach(function(k){var last="";by[k].forEach(function(r){var tr=transition(r.line,last,r.product);if(last&&tr.impossible){r.impossible=true;r.setup=0}else r.setup=last?tr.time:0;r.total=r.run+r.setup;last=r.product})});
 return out;
}
function basePlan(comment){
 var adj=parseAdjustmentComment(comment||""),remain=planItems.map(function(p){return{name:p.name,remain:num(p.qty),need:num(p.qty)}}),rows=[],warnings=[];
 var dayOrder=days.filter(function(d){return adj.blockedDays.indexOf(d)<0});
 dayOrder.sort(function(a,b){var pa=0,pb=0;remain.forEach(function(x){if(adj.preferred[x.name]===a)pa++;if(adj.preferred[x.name]===b)pb++});return pb-pa});
 dayOrder.forEach(function(day){
  var d=days.indexOf(day);
  lines.forEach(function(line,li){
   var avail=hoursForDay(getSc(li),d)*60,last="";
   if(avail<=0)return;
   var candidates=remain.filter(function(x){return x.remain>0}).sort(function(a,b){var ap=adj.preferred[a.name]===day?0:1,bp=adj.preferred[b.name]===day?0:1;if(ap!==bp)return ap-bp;return b.remain-a.remain});
   candidates.forEach(function(x){
    if(x.remain<=0|| (adj.preferred[x.name]&&adj.preferred[x.name]!==day))return;
    var p=findProduct(x.name);if(!p){warnings.push(x.name+"：製品設定がありません");return}
    var cap=capacity(line,p),lot=minLot(line,p);if(cap<=0)return;
    var tr=transition(line.name,last,p.name);if(tr.impossible)return;
    var setup=last?tr.time:0,max=Math.floor(Math.max(0,avail-setup)*cap/60);if(max<=0)return;
    var make=Math.min(x.remain,max),surplus=0;
    if(lot>0&&make<lot){if(lot<=max){make=lot;surplus=lot-x.remain}else return}
    if(make<=0)return;
    rows.push({day:day,line:line.name,product:p.name,qty:make,raw:p.raw||"",lot:lot,setup:setup,run:make/cap*60,total:setup+make/cap*60,surplus:surplus});
    x.remain=Math.max(0,x.remain-make);avail-=setup+make/cap*60;last=p.name;
   });
  });
 });
 return {rows:recompute(rows),remain:remain,warnings:warnings,adj:adj};
}

function availableFor(rows,day,lineName,product){
 var line=lines.find(function(l){return l.name===lineName}),p=findProduct(product);if(!line||!p)return 0;
 var li=lines.indexOf(line),d=days.indexOf(day),cap=capacity(line,p),used=stats(rows).find(function(s){return s.day===day&&s.line===lineName}).used;
 var free=hoursForDay(getSc(li),d)*60-used;
 var target=rows.find(function(r){return r.day===day&&r.line===lineName&&r.product===product});
 var setup=0;if(!target){var rr=lineRows(rows,day,lineName);var last=rr[rr.length-1];if(last){var tr=transition(lineName,last.product,product);if(tr.impossible)return 0;setup=tr.time}}
 return Math.floor(Math.max(0,free-setup)*cap/60);
}
function moveQuantity(rows,product,fromDay,toDay,qty){
 var src=rows.find(function(r){return r.day===fromDay&&r.product===product&&r.qty>0});if(!src)return 0;
 var line=lines.find(function(l){return l.name===src.line}),p=findProduct(product),cap=capacity(line,p),lot=minLot(line,p);if(!line||!p||cap<=0)return 0;
 var can=availableFor(rows,toDay,line.name,product),maxMove=Math.min(num(qty)>0?num(qty):src.qty,src.qty,can);
 if(maxMove<=0)return 0;
 if(src.qty-maxMove>0&&src.qty-maxMove<lot)maxMove=src.qty-lot;
 if(maxMove<=0)return 0;
 src.qty-=maxMove;
 var target=rows.find(function(r){return r.day===toDay&&r.line===line.name&&r.product===product});
 if(target)target.qty+=maxMove;else rows.push({day:toDay,line:line.name,product:product,qty:maxMove,raw:p.raw||"",lot:lot});
 return maxMove;
}

function applyAdjustment(rows,comment){
 var adj=parseAdjustmentComment(comment),work=cloneRows(rows),changes=[],notes=[];
 // 1) Explicit move commands
 adj.moves.forEach(function(m){var n=moveQuantity(work,m.product,m.fromDay,m.toDay,0);if(n>0)changes.push(m.product+"を"+m.fromDay+"曜日から"+m.toDay+"曜日へ"+Math.floor(n)+"個移動");else notes.push(m.fromDay+"曜日の"+m.product+"は"+m.toDay+"曜日へ移動できる空き能力がありません")});
 // 2) Pair increase/decrease. This is the key fix for 「木曜日のaを増やして、金曜日のbを減らして」.
 adj.increase.forEach(function(inc){
   var dec=adj.decrease.find(function(x){return x.product!==inc.product&&x.day===inc.day})||adj.decrease.find(function(x){return x.product!==inc.product});
   if(!dec)return;
   var src=work.find(function(r){return r.day===dec.day&&r.product===dec.product&&r.qty>0});
   if(!src){notes.push(dec.day+"曜日の"+dec.product+"の計画が見つかりません");return}
   var line=lines.find(function(l){return l.name===src.line}),pInc=findProduct(inc.product),pDec=findProduct(dec.product);
   if(!line||!pInc||!pDec){notes.push("製品設定またはライン設定が見つかりません");return}
   var maxDec=Math.max(0,src.qty-minLot(line,pDec)), requested=inc.qty>0?inc.qty:(dec.qty>0?dec.qty:maxDec);
   var canInc=availableFor(work,inc.day,line.name,inc.product);
   var move=Math.min(requested,maxDec,canInc);
   if(move<=0){notes.push(inc.day+"曜日の"+inc.product+"を増やせる空き能力がありません");return}
   src.qty-=move;
   var target=work.find(function(r){return r.day===inc.day&&r.line===line.name&&r.product===inc.product});
   if(target)target.qty+=move;else work.push({day:inc.day,line:line.name,product:inc.product,qty:move,raw:pInc.raw||"",lot:minLot(line,pInc)});
   changes.push(inc.day+"曜日の"+inc.product+"を"+Math.floor(move)+"個増やし、"+dec.day+"曜日の"+dec.product+"を同数減らしました");
   if(dec.day!==inc.day){
     // The reduction is already removed from dec.day; demand quantity is preserved by adding the same quantity to inc.day.
     notes.push("需要総量は変更せず、指定された曜日間で数量を再配分しました");
   }
 });
 // 3) Explicit decreases without paired increase
 if(!adj.increase.length)adj.decrease.forEach(function(dec){var r=work.find(function(x){return x.day===dec.day&&x.product===dec.product&&x.qty>0});if(!r)return;var lot=minLot(lines.find(function(l){return l.name===r.line}),findProduct(r.product)),n=dec.qty>0?Math.min(dec.qty,Math.max(0,r.qty-lot)):Math.max(0,r.qty-lot);if(n>0){r.qty-=n;changes.push(dec.day+"曜日の"+dec.product+"を"+Math.floor(n)+"個減らしました")}}); 
 // 4) Explicit increases without paired decrease: use free capacity, but do not invent demand.
 if(!adj.decrease.length)adj.increase.forEach(function(inc){var p=findProduct(inc.product);if(!p)return;var done=false;for(var li=0;li<lines.length&&!done;li++){var n=availableFor(work,inc.day,lines[li].name,inc.product);if(n>0){var q=inc.qty>0?Math.min(inc.qty,n):n;var r=work.find(function(x){return x.day===inc.day&&x.line===lines[li].name&&x.product===inc.product});if(r)r.qty+=q;else work.push({day:inc.day,line:lines[li].name,product:inc.product,qty:q,raw:p.raw||"",lot:minLot(lines[li],p)});changes.push(inc.day+"曜日の"+inc.product+"を"+Math.floor(q)+"個増やしました");done=true}}});
 // 5) Preferred-day moves
 Object.keys(adj.preferred).forEach(function(product){var to=adj.preferred[product];var src=work.find(function(r){return r.product===product&&r.day!==to&&r.qty>0});if(src){var n=moveQuantity(work,product,src.day,to,0);if(n>0)changes.push(product+"を"+src.day+"曜日から"+to+"曜日へ"+Math.floor(n)+"個移動")}});
 work=recompute(work);
 return {rows:work,changes:changes,notes:notes,adj:adj};
}

function render(rows,title,comment){
 var st=stats(rows),need={};planItems.forEach(function(p){need[p.name]={need:num(p.qty),prod:0}});rows.forEach(function(r){if(!need[r.product])need[r.product]={need:0,prod:0};need[r.product].prod+=num(r.qty)});
 var s='<div class="card"><h2>'+esc(title)+'</h2>';if(comment)s+='<div class="hint"><b>反映したコメント：</b><br>'+esc(comment)+'</div>';
 st.forEach(function(x){if(x.available>0)s+='<div class="item"><b>'+x.day+'曜日｜'+esc(x.line)+'</b><div class="small">実働可能 '+(x.available/60).toFixed(2)+'時間　計画 '+(x.used/60).toFixed(2)+'時間　残余 '+(x.left/60).toFixed(2)+'時間　段取り '+x.setups+'回</div></div>'});
 rows.forEach(function(r){s+='<div class="item"><b>'+r.day+'曜日｜'+esc(r.line)+'</b><div>'+esc(r.product)+'：'+Math.round(r.qty).toLocaleString()+'個</div><div class="small">生産 '+(r.run/60).toFixed(2)+'時間　段取り '+Math.round(r.setup||0)+'分　合計 '+(r.total/60).toFixed(2)+'時間'+(r.surplus>0?'　⚠最低数量による余剰 '+Math.round(r.surplus)+'個':'')+'</div></div>'});
 s+='<h3>需要との差</h3>';Object.keys(need).forEach(function(k){var v=need[k],d=v.prod-v.need;s+='<div class="item"><b>'+esc(k)+'</b>　需要 '+v.need.toLocaleString()+'個　生産 '+Math.round(v.prod).toLocaleString()+'個　差 '+Math.round(d).toLocaleString()+'個'+(d>0?'　⚠余剰':'')+'</div>'});
 return s+'</div>';
}
function planResult(){
 if(!lines.length){alert("先にラインを登録してください");return}
 var base=basePlan(""),html=render(base.rows,"今週の生産案");var un=base.remain.filter(function(x){return x.remain>0});
 if(un.length){html+='<div class="card warn"><b>⚠ 未計画</b>';un.forEach(function(x){html+='<div>'+esc(x.name)+'：'+Math.ceil(x.remain)+'個</div>'});html+='</div>'}else html+='<div class="card"><div class="ok">需要を割り付けました。</div></div>';
 html+='<div class="card" id="adjustmentPanel"><h2>最終調整</h2><div class="hint"><b>入力例：</b>「木曜日のaを増やして、金曜日のbを減らして」「木曜日のaを5000個増やして、金曜日のbを5000個減らして」「火曜日のaを木曜日に回して」「金曜日は生産しない」。数量を指定しない場合は、減らせる量と空き能力の範囲で自動調整します。</div><textarea id="adjustmentComment" placeholder="生産計画への修正要望を入力してください"></textarea><button class="orange" id="applyAdjustment">コメントを反映して再計画</button><div id="adjustmentResult"></div></div><button class="gray" id="b">戻る</button>';
 app.innerHTML=html;document.getElementById("b").onclick=home;window.__baseRows=cloneRows(base.rows);
 document.getElementById("applyAdjustment").onclick=function(){var c=document.getElementById("adjustmentComment").value.trim(),r=document.getElementById("adjustmentResult");if(!c){r.innerHTML='<div class="small">コメントを入力してください。</div>';return}var parsed=parseAdjustmentComment(c);if(!parsed.increase.length&&!parsed.decrease.length&&!parsed.moves.length&&!parsed.blockedDays.length&&Object.keys(parsed.preferred).length===0&&!parsed.surplusTarget){r.innerHTML='<div class="warn">曜日・製品・増減などの条件を読み取れませんでした。</div>';return}var res=applyAdjustment(window.__baseRows,c),h=render(window.__baseRows,"変更前の計画")+render(res.rows,"変更後の計画",c);h+='<div class="card"><h3>再計画結果</h3>';if(res.changes.length)res.changes.forEach(function(x){h+='<div class="ok">✓ '+esc(x)+'</div>'});else h+='<div class="warn">コメントは解析できましたが、空き能力・最低生産数量・切替条件の範囲では変更できませんでした。</div>';res.notes.forEach(function(x){h+='<div class="small">・'+esc(x)+'</div>'});h+='</div>';r.innerHTML=h};
}
saveAll();home();
</script></main></body></html>
