<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI生産計画 v17</title>
<style>
body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
header{background:#1d4ed8;color:#fff;padding:18px 16px}.title{font-size:21px;font-weight:800}.sub{font-size:12px}
main{max-width:850px;margin:auto;padding:12px 12px 90px}.card{background:#fff;border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 2px 8px rgba(0,0,0,.06)}
button{display:block;width:100%;border:0;border-radius:11px;padding:14px;margin:8px 0;background:#2563eb;color:#fff;font-size:16px;font-weight:700}
.gray{background:#e5e7eb;color:#111827}.green{background:#16a34a}.orange{background:#ea580c}
input,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;background:#fff}
label{display:block;font-size:13px;font-weight:700;margin:9px 0 4px}.hint{background:#f9fafb;border-radius:10px;padding:10px;font-size:12px;color:#4b5563}
.day{border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin:8px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.small{font-size:12px;color:#6b7280}.total{font-weight:800;font-size:18px}
</style>
</head>
<body>
<header><div class="title">AI生産計画 v17</div><div class="sub">曜日別稼働時間・休憩設定</div></header>
<main id="app"></main>
<script>
"use strict";
var app=document.getElementById("app");
function read(k,old){try{var x=JSON.parse(localStorage.getItem(k)||localStorage.getItem(old)||"[]");return Array.isArray(x)?x:[]}catch(e){return[]}}
var lines=read("aiSeisanV15_lines","aiSeisanV14_lines");
var schedules=read("aiSeisanV17_schedules");
var days=["月","火","水","木","金","土","日"];

function save(){try{localStorage.setItem("aiSeisanV17_schedules",JSON.stringify(schedules));localStorage.setItem("aiSeisanV17_lines",JSON.stringify(lines));}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function timeMin(v){var p=String(v||"").split(":");return p.length===2?(+p[0]*60 + +p[1]):0}
function calc(d){if(!d.enabled)return 0;var x=timeMin(d.end)-timeMin(d.start);if(x<0)x+=1440;return Math.max(0,x-(+d.breakMin||0))}
function defaultDays(){return days.map(function(n){return {day:n,enabled:["月","火","水","木","金"].indexOf(n)>=0,start:"08:00",end:"17:00",breakMin:60}})}
function getSchedule(lineId){
 for(var i=0;i<schedules.length;i++)if(schedules[i].lineId===lineId)return schedules[i];
 var x={lineId:lineId,days:defaultDays()};schedules.push(x);save();return x;
}
function home(){
 var s='<div class="card"><h2>マスター管理</h2>'+
 '<button id="l">ラインを登録・修正</button>'+
 '<button class="orange" id="w">曜日別稼働時間を設定</button>'+
 '<button class="gray" id="b">戻る</button></div>'+
 '<div class="card"><h2>次の計画機能</h2><p class="small">この設定を基に、今週の需要予測・生産可能量・日別生産計画へつなげます。</p></div>';
 app.innerHTML=s;
 document.getElementById("l").onclick=linesPage;
 document.getElementById("w").onclick=lineSelect;
 document.getElementById("b").onclick=function(){alert("ホーム画面です");};
}
function linesPage(){
 var s='<div class="card"><h2>ライン一覧</h2>';
 if(!lines.length)s+='<div class="hint">先にラインを登録してください。</div>';
 lines.forEach(function(x,i){s+='<div class="day"><b>'+esc(x.name)+'</b><div class="small">標準能力：'+(x.capacity||0)+'個/h　最低ロット：'+(x.lot||0)+'個　必要人員：'+(x.workers||0)+'人</div></div>'});
 s+='<button class="gray" id="b">戻る</button></div>';app.innerHTML=s;document.getElementById("b").onclick=home;
}
function lineSelect(){
 if(!lines.length){alert("先にラインを登録してください。");return;}
 var s='<div class="card"><h2>曜日別稼働時間</h2><p class="hint">ラインごとに、曜日・開始・終了・休憩を設定します。実働時間は自動計算されます。</p>';
 lines.forEach(function(x,i){s+='<button data-i="'+i+'">'+esc(x.name)+' を設定</button>'});
 s+='<button class="gray" id="b">戻る</button></div>';app.innerHTML=s;
 document.querySelectorAll("[data-i]").forEach(function(b){b.onclick=function(){scheduleEdit(+this.dataset.i)}});
 document.getElementById("b").onclick=home;
}
function scheduleEdit(li){
 var line=lines[li], sc=getSchedule(li);
 var s='<div class="card"><h2>'+esc(line.name)+' の稼働設定</h2>'+
 '<div class="hint">標準設定は月〜金 8:00〜17:00、休憩60分です。必要に応じて変更してください。</div>';
 sc.days.forEach(function(d,i){
  s+='<div class="day"><b>'+d.day+'曜日</b>'+
  '<label><input type="checkbox" data-en="'+i+'" '+(d.enabled?'checked':'')+' style="width:auto"> 稼働する</label>'+
  '<div class="row"><div><label>開始</label><input type="time" data-st="'+i+'" value="'+esc(d.start)+'"></div>'+
  '<div><label>終了</label><input type="time" data-ed="'+i+'" value="'+esc(d.end)+'"></div></div>'+
  '<label>休憩時間（分）</label><input type="number" min="0" data-br="'+i+'" value="'+(d.breakMin||0)+'">'+
  '<div class="small" data-total="'+i+'">実働：'+(calc(d)/60).toFixed(2)+'時間</div></div>';
 });
 s+='<div class="total" id="sum">週間実働：'+weekly(sc).toFixed(2)+'時間</div>'+
 '<button class="green" id="save">保存</button><button class="gray" id="cancel">キャンセル</button></div>';
 app.innerHTML=s;
 function refresh(){
  var sum=0;
  sc.days.forEach(function(d,i){
   d.enabled=document.querySelector('[data-en="'+i+'"]').checked;
   d.start=document.querySelector('[data-st="'+i+'"]').value;
   d.end=document.querySelector('[data-ed="'+i+'"]').value;
   d.breakMin=Number(document.querySelector('[data-br="'+i+'"]').value)||0;
   var el=document.querySelector('[data-total="'+i+'"]');el.textContent='実働：'+(calc(d)/60).toFixed(2)+'時間';
   sum+=calc(d);
  });
  document.getElementById("sum").textContent='週間実働：'+(sum/60).toFixed(2)+'時間';
 }
 app.querySelectorAll("input").forEach(function(x){x.onchange=refresh;x.oninput=refresh});
 document.getElementById("save").onclick=function(){refresh();save();lineSelect()};
 document.getElementById("cancel").onclick=lineSelect;
}
function weekly(sc){return sc.days.reduce(function(a,d){return a+calc(d)},0)/60}
home();
</script>
</body>
</html>
