<style>

<body>
<header>
  <div class="title">AI生産計画 v35.23</div>
  <div>v30基準・稼働時間／段取り／最低生産数量を守り、需要を満たせる計画を優先</div>
</header>
<main id="app"></main>
<script>
"use strict";
const DAYS=["月","火","水","木","金","土","日"];
const K={lines:"aiSeisan_lines",products:"aiSeisan_products",trans:"aiSeisan_transitionRules",dem:"aiSeisan_planItems",schedules:"aiSeisan_schedules",last:"aiSeisan_lastPlan",planMeta:"aiSeisan_planMeta",weeklyDem:"aiSeisan_weeklyDemand",materials:"aiSeisan_materials"};
const app=document.getElementById("app");
const load=(k,d=[])=>{try{const x=localStorage.getItem(k);return x?JSON.parse(x):d}catch(e){return d}};
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const n=v=>{const x=Number(v);return Number.isFinite(x)?x:0};
const mins=t=>{const a=String(t||"").split(":");return a.length===2?n(a[0])*60+n(a[1]):0};
const fmt=v=>Math.round(n(v)*100)/100;
const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));

let lines=load(K.lines,[]).map(x=>({...x,name:String(x.name||x.lineName||""),capacity:n(x.capacity??x.hourCapacity),lot:n(x.lot??x.minLot),workers:n(x.workers??x.personnel)})).filter(x=>x.name);
let materials=load(K.materials,[]).map(x=>({...x,name:String(x.name||x.material||"").trim()})).filter(x=>x.name);
let products=load(K.products,[]).map(x=>({...x,name:String(x.name||x.product||""),capacityOverride:n(x.capacityOverride),minLotOverride:n(x.minLotOverride),materialIds:Array.isArray(x.materialIds)?x.materialIds:[]})).filter(x=>x.name);
let transitions=load(K.trans,[]).map(x=>({...x,allowed:x.allowed!==false,time:n(x.time)}));
let demands=load(K.dem,[]);
let schedules=load(K.schedules,[]);

function defaults(){
  return DAYS.map(d=>({day:d,enabled:["月","火","水","木","金"].includes(d),start:"08:00",end:"17:00",breakMin:60}));
}
function lineSchedule(i){
  let s=schedules.find(x=>n(x.lineId)===i);
  if(!s){s={lineId:i,days:defaults()};schedules.push(s);save(K.schedules,schedules)}
  if(!Array.isArray(s.days)||s.days.length!==7)s.days=defaults();
  return s;
}
function workMin(d){
  if(!d||!d.enabled)return 0;
  let x=mins(d.end)-mins(d.start);if(x<0)x+=1440;
  return Math.max(0,x-n(d.breakMin));
}
function prod(name){return products.find(p=>p.name===name)||{name,capacityOverride:0,minLotOverride:0}}
function cap(line,p){return n(p.capacityOverride)||n(line.capacity)||0}
function lot(line,p){return n(p.minLotOverride)||n(line.lot)||0}
function materialNames(productName){
  const p=prod(productName);
  return (p.materialIds||[]).map(id=>materials.find(m=>m.id===id||m.name===id)?.name||id).filter(Boolean);
}
function setup(line,from,to){
  if(!from||from===to)return {time:0,allowed:true};
  // Legacy/product-specific rule has priority.
  const direct=transitions.find(x=>(!x.line||x.line===line.name||x.line===line)&&x.from===from&&x.to===to&&!x.materialFrom&&!x.materialTo);
  if(direct)return {time:direct.allowed===false?Infinity:n(direct.time),allowed:direct.allowed!==false};
  const fm=materialNames(from), tm=materialNames(to);
  if(!fm.length||!tm.length)return {time:0,allowed:true};
  const rules=[];
  fm.forEach(a=>tm.forEach(b=>{
    const r=transitions.find(x=>(!x.line||x.line===line.name||x.line===line)&&x.materialFrom===a&&x.materialTo===b);
    if(r)rules.push(r);
  }));
  if(!rules.length)return {time:0,allowed:true};
  if(rules.some(r=>r.allowed===false))return {time:Infinity,allowed:false};
  return {time:Math.max(...rules.map(r=>n(r.time))),allowed:true};
}
function demandRows(){
  return demands.map((d,i)=>({i,product:String(d.product||d.name||d.productName||"").trim(),qty:n(d.quantity??d.qty??d.demand??d.amount)}))
    .filter(x=>x.product&&x.qty>0);
}
function buildSlots(){
  const slots=[];
  lines.forEach((line,li)=>{
    const s=lineSchedule(li);
    s.days.forEach((d,di)=>{
      const available=workMin(d);
      if(available>0)slots.push({id:`${li}-${di}`,li,di,line,day:d.day,available,used:0,last:"",rows:[]});
    });
  });
  return slots;
}

/*
  v35.22 根本修正
  ----------------
  旧ロジックは「残需要 < 最低生産数量」の時点で候補を捨てていた。
  しかし最低生産数量はロット倍数ではなく、最終回の残需要まで切り上げる制約でもない。
  したがって、
    - 残需要 >= 最低数量 → 原則として最低数量以上で開始
    - 残需要 < 最低数量 → その残需要を最終生産として許可
  とする。
  さらに、需要未達を防げる場合は「未達を残す計画」を採用しない。
*/
function candidate(slot,p,remaining){
  const c=cap(slot.line,p);
  if(c<=0)return null;
  const st=setup(slot.line,slot.last,p.name);
  if(!st.allowed)return null;
  const free=Math.max(0,slot.available-slot.used);
  const net=Math.max(0,free-st.time);
  const maxQty=net*c/60;
  if(maxQty<=0)return null;
  const L=lot(slot.line,p);
  let q=Math.min(remaining,maxQty);

  // 最終回なら最低数量未満でも許可
  const finalRun=remaining<=L || q===remaining;
  if(L>0 && q<L && !finalRun)return null;

  q=Math.floor(q);
  if(q<=0)return null;

  return {q,c,st,maxQty,L,finalRun};
}

function slotScore(slot,p,remaining){
  const c=candidate(slot,p,remaining);
  if(!c)return -Infinity;
  const same=slot.last===p.name;
  const fills=(slot.used+c.st.time+c.q/c.c*60)/slot.available;
  const completes=c.q>=remaining;
  // 「残需要をその枠で完了できる」ことを強く評価。
  // 同一製品連続・段取り削減・余裕の確保を続く評価軸にする。
  return (completes?100000:0)+(same?10000:0)-c.st.time*30+fills*20+(c.q/remaining)*100;
}

function makeOrderings(rows,slots){
  const out=[];
  out.push(rows.slice().sort((a,b)=>b.qty-a.qty));
  out.push(rows.slice().sort((a,b)=>{
    const fa=slots.filter(s=>cap(s.line,prod(a.product))>0).length;
    const fb=slots.filter(s=>cap(s.line,prod(b.product))>0).length;
    return fa-fb||b.qty-a.qty;
  }));
  out.push(rows.slice().sort((a,b)=>String(a.product).localeCompare(String(b.product),"ja")));
  return out;
}

function build(order){
  const slots=buildSlots();
  const out=[];
  for(const r of order){
    let remain=r.qty,p=prod(r.product);
    while(remain>0){
      let best=null;
      for(const sl of slots){
        const c=candidate(sl,p,remain);
        if(!c)continue;
        const score=slotScore(sl,p,remain);
        if(!best||score>best.score)best={sl,c,score};
      }
      if(!best)break;
      const {sl,c}=best;
      sl.used+=c.st.time+c.q/c.c*60;
      sl.last=p.name;
      sl.rows.push({product:p.name,quantity:c.q});
      out.push({day:sl.day,line:sl.line.name,product:p.name,quantity:c.q,hours:c.q/c.c,setupMin:c.st.time});
      remain-=c.q;
      if(remain<0.0001)remain=0;
    }
  }
  return {out,slots};
}

function analyze(out,rows,slots){
  const by={};
  rows.forEach(r=>by[r.product]={demand:r.qty,production:0,shortage:0,surplus:0});
  out.forEach(x=>{
    if(!by[x.product])by[x.product]={demand:0,production:0,shortage:0,surplus:0};
    by[x.product].production+=n(x.quantity);
  });
  let totalDemand=0,totalProduction=0,totalShort=0,totalSurplus=0;
  Object.values(by).forEach(x=>{
    x.shortage=Math.max(0,x.demand-x.production);
    x.surplus=Math.max(0,x.production-x.demand);
    totalDemand+=x.demand;totalProduction+=x.production;totalShort+=x.shortage;totalSurplus+=x.surplus;
  });
  const available=slots.reduce((a,s)=>a+s.available,0);
  const used=out.reduce((a,x)=>a+n(x.hours)*60+n(x.setupMin),0);
  return {by,totalDemand,totalProduction,totalShort,totalSurplus,fill:totalDemand?totalProduction/totalDemand*100:0,available,used,remaining:Math.max(0,available-used)};
}

function repairResiduals(out,rows){
  /*
    初回計画後の「予防可能な不足」を修復する。
    例えば a が 4,650 個だけ残り、最低生産数量 5,000 個でも、
    その数量を入れられる既存日の空き時間があるなら追加する。
    ここでは曜日を固定せず、全スロットを探索する。
  */
  const result=out.map(x=>({...x}));
  let changed=true;
  while(changed){
    changed=false;
    const slots=buildSlots();
    // 既存計画を各スロットへ反映
    result.forEach(x=>{
      const sl=slots.find(s=>s.day===x.day&&s.line.name===x.line);
      if(sl){sl.used+=x.hours*60+x.setupMin;sl.last=x.product;}
    });
    const a=analyze(result,rows,slots);
    const shortages=Object.entries(a.by).filter(([_,x])=>x.shortage>0).sort((x,y)=>y[1].shortage-x[1].shortage);
    for(const [name,x] of shortages){
      const p=prod(name);
      let best=null;
      for(const sl of slots){
        const c=candidate(sl,p,x.shortage);
        if(!c)continue;
        const score=(c.q>=x.shortage?100000:0)+(sl.last===name?10000:0)-c.st.time*30+c.q;
        if(!best||score>best.score)best={sl,c,score};
      }
      if(best){
        const {sl,c}=best;
        result.push({day:sl.day,line:sl.line.name,product:name,quantity:c.q,hours:c.q/c.c,setupMin:c.st.time});
        changed=true;break;
      }
    }
  }
  return result;
}

function generatePlan(){
  const rows=demandRows();
  const slots=buildSlots();
  if(!rows.length)return {out:[],analysis:analyze([],rows,slots),message:"需要を入力してください"};
  if(!lines.length)return {out:[],analysis:analyze([],rows,slots),message:"ラインを設定してください"};
  if(!slots.length)return {out:[],analysis:analyze([],rows,slots),message:"稼働可能な曜日・時間がありません"};

  let best=null,bestScore=-Infinity;
  for(const order of makeOrderings(rows,slots)){
    let r=build(order);
    r.out=repairResiduals(r.out,rows);
    const a=analyze(r.out,rows,buildSlots());
    const setupTotal=r.out.reduce((v,x)=>v+n(x.setupMin),0);
    const switches=r.out.reduce((v,x,i)=>v+(i&&x.line===r.out[i-1].line&&x.product!==r.out[i-1].product?1:0),0);
    const score=-a.totalShort*100000000-a.totalSurplus*1000-setupTotal*10-switches;
    if(score>bestScore){bestScore=score;best={out:r.out,analysis:a}}
  }
  return best;
}


function diagnosePlan(plan, rows){
  const slots=buildSlots();
  const a=analyze(plan,rows,slots);
  const day={};
  DAYS.forEach(d=>day[d]={available:0,used:0,setup:0,rows:0});
  slots.forEach(s=>day[s.day].available+=s.available);
  plan.forEach(x=>{
    if(!day[x.day])day[x.day]={available:0,used:0,setup:0,rows:0};
    day[x.day].used+=n(x.hours)*60+n(x.setupMin);
    day[x.day].setup+=n(x.setupMin);
    day[x.day].rows++;
  });

  const productIssues=[];
  Object.entries(a.by).forEach(([name,x])=>{
    if(x.shortage>0){
      const p=prod(name);
      const usable=slots.filter(s=>cap(s.line,p)>0 && candidate(s,p,x.shortage));
      productIssues.push({
        name, shortage:x.shortage, demand:x.demand, production:x.production,
        possibleSlots:usable.length, minLot:lot(usable[0]?.line||{},p)
      });
    }
  });

  const bottlenecks=DAYS.map(d=>({
    day:d,
    available:day[d].available,
    used:day[d].used,
    remaining:Math.max(0,day[d].available-day[d].used),
    utilization:day[d].available?day[d].used/day[d].available*100:0,
    setup:day[d].setup
  })).filter(x=>x.available>0).sort((a,b)=>b.utilization-a.utilization);

  const reasons=[];
  if(a.totalShort<=0){
    reasons.push("需要は現在の稼働可能時間内で充足できています。");
  }else{
    const high=bottlenecks.filter(x=>x.utilization>=95);
    if(high.length) reasons.push("一部の日の稼働率が95%以上で、空き時間が不足の制約になっています。");
    const noSlot=productIssues.filter(x=>x.possibleSlots===0);
    if(noSlot.length) reasons.push("不足製品を生産できるライン・稼働枠が見つからない製品があります。");
    const withSlot=productIssues.filter(x=>x.possibleSlots>0);
    if(withSlot.length) reasons.push("不足製品には追加可能な稼働枠が残っている可能性があります。");
    if(!reasons.length) reasons.push("現在の候補探索では需要を完全充足できませんでした。条件の組合せが制約になっている可能性があります。");
  }
  return {a,day,bottlenecks,productIssues,reasons};
}

function renderDiagnosis(plan, rows){
  const d=diagnosePlan(plan,rows);
  let h=`<div class="card"><h2>計画診断</h2>`;
  h+=`<div class="${d.a.totalShort>0?"warn":"ok"}"><b>${d.a.totalShort>0?"需要未達の原因候補":"実行可能性：問題なし"}</b><br>${d.reasons.map(x=>"・"+esc(x)).join("<br>")}</div>`;

  h+=`<div class="item"><b>日別稼働率</b><div class="scroll"><table><tr><th>曜日</th><th>可能h</th><th>使用h</th><th>稼働率</th><th>段取り分</th></tr>`;
  d.bottlenecks.slice().sort((a,b)=>DAYS.indexOf(a.day)-DAYS.indexOf(b.day)).forEach(x=>{
    h+=`<tr><td>${esc(x.day)}</td><td>${fmt(x.available/60)}</td><td>${fmt(x.used/60)}</td><td>${fmt(x.utilization)}%</td><td>${fmt(x.setup)}分</td></tr>`;
  });
  h+=`</table></div></div>`;

  if(d.productIssues.length){
    h+=`<div class="item"><b>不足製品の診断</b>`;
    d.productIssues.forEach(x=>{
      h+=`<div class="item"><b>${esc(x.name)}</b><br>不足 ${Math.round(x.shortage).toLocaleString()}個 / 追加可能候補 ${x.possibleSlots}枠`;
      if(x.possibleSlots>0) h+=`<br><span class="small">→ 追加生産を検討できる余地があります。</span>`;
      else h+=`<br><span class="small">→ 現在の設定では生産可能な枠がありません。</span>`;
      h+=`</div>`;
    });
    h+=`</div>`;
  }

  h+=`<div class="hint"><b>この版の開発方針</b><br>
  計画結果だけでなく、「なぜその結果になったか」を診断できるようにします。
  特定の曜日・製品・コメント表現に依存せず、稼働時間、能力、段取り、切替可否、最低生産数量、需要残量を原因候補として評価します。</div></div>`;
  return h;
}

function showPlan(plan,analysisOverride){
  const rows=demandRows();
  const a=analysisOverride||analyze(plan,rows,buildSlots());
  let h=`<div class="card"><h2>生産案</h2><div class="scroll"><table><tr><th>曜日</th><th>ライン</th><th>製品</th><th>数量</th><th>実働h</th><th>段取り分</th></tr>`;
  plan.forEach(x=>h+=`<tr><td>${esc(x.day)}</td><td>${esc(x.line)}</td><td>${esc(x.product)}</td><td>${Math.round(x.quantity).toLocaleString()}</td><td>${fmt(x.hours)}</td><td>${fmt(x.setupMin)}</td></tr>`);
  h+=`</table></div></div>`;
  h+=`<div class="card"><h2>需要充足・不足分析</h2>`;
  if(a.totalShort>0)h+=`<div class="warn"><b>⚠ 需要未達</b><div class="metric">${Math.round(a.totalShort).toLocaleString()}個不足</div><div>総需要 ${Math.round(a.totalDemand).toLocaleString()} / 生産 ${Math.round(a.totalProduction).toLocaleString()} / 充足率 ${fmt(a.fill)}%</div></div>`;
  else h+=`<div class="ok"><b>✓ 需要充足</b><div class="metric">不足 0個</div><div>総需要 ${Math.round(a.totalDemand).toLocaleString()} / 生産 ${Math.round(a.totalProduction).toLocaleString()} / 充足率 ${fmt(a.fill)}%</div></div>`;
  Object.entries(a.by).forEach(([name,x])=>{
    h+=`<div class="item"><b>${esc(name)}</b><br>需要 ${Math.round(x.demand).toLocaleString()} / 生産 ${Math.round(x.production).toLocaleString()} / 不足 ${Math.round(x.shortage).toLocaleString()} / 余剰 ${Math.round(x.surplus).toLocaleString()}</div>`;
  });
  h+=`<div class="hint"><b>今回の重要な改善：</b>残需要が最低生産数量を下回っても、それがその製品の最終生産なら、その残数量を生産できます。最低生産数量をロット倍数として扱いません。</div>`;
  h+=`<div class="item"><b>稼働時間</b><br>可能 ${fmt(a.available/60)}h / 使用 ${fmt(a.used/60)}h / 残り ${fmt(a.remaining/60)}h</div>`;
  h+=renderDiagnosis(plan,rows);

    ? Array.isArray(p.weeklyDemand) && p.weeklyDemand.length>0

    throw new Error("需要・ライン・製品・段取り・稼働時間の設定が揃っていません。");

function mondayOf(d){const x=new Date(d+"T00:00:00");const day=x.getDay();x.setDate(x.getDate()+(day===0?-6:1-day));return x}
function sundayOfMonday(m){const x=new Date(m);x.setDate(x.getDate()+6);return x}
function isoDate(d){return d.toISOString().slice(0,10)}
function formatJP(d){return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`}
function weekRanges(start,end){const s=mondayOf(start),out=[];const last=new Date(end+"T23:59:59");while(s<=last){const e=sundayOfMonday(s);out.push({start:isoDate(s),end:isoDate(e)});s.setDate(s.getDate()+7)}return out}
function mondayOf(s){
  const d=new Date(s+"T00:00:00"); if(Number.isNaN(d.getTime())) return null;
  const day=d.getDay(); d.setDate(d.getDate()+(day===0?-6:1-day)); return d;
}
function sundayOfMonday(d){const x=new Date(d);x.setDate(x.getDate()+6);return x;}
function isoDate(d){return d.toISOString().slice(0,10);}
function jpDate(d){return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;}
function weekRanges(start,end){
  const s=mondayOf(start), e=new Date(end+"T00:00:00"), out=[];
  if(!s||Number.isNaN(e.getTime())||s>e)return out;
  for(let d=new Date(s);d<=e;d.setDate(d.getDate()+7)){
    const wEnd=sundayOfMonday(d); if(wEnd>e) wEnd.setTime(e.getTime());
    out.push({start:isoDate(d),end:isoDate(wEnd)});
  }
  return out;
}
function currentDemandMeta(){return load(K.planMeta,{mode:"weekly",start:"",end:""});}

function calcAvailableMinutes(){
  const ss=load(K.schedules,[]);
  const lineList=load(K.lines,[]);
  const out=[];
  (lineList.length?lineList:[{name:"1号",capacity:0,lot:0}]).forEach((ln,li)=>{
    const sch=ss.find(x=>Number(x.lineId)===li);
    let min=0;
    if(sch&&Array.isArray(sch.days)){
      sch.days.forEach(d=>{
        if(!d.enabled)return;
        const [sh,sm]=String(d.start||"00:00").split(":").map(Number);
        const [eh,em]=String(d.end||"00:00").split(":").map(Number);
        min+=Math.max(0,(eh*60+em)-(sh*60+sm)-n(d.breakMin));
      });
    }else{
      min=5*9*60;
    }
    out.push({line:ln.name,minutes:min});
  });
  return out;
}
function productCapacity(p,line){
  return n(p.capacityOverride)||n(line.capacity)||2050;
}
function demandForCurrentWeek(){
  const meta=currentDemandMeta(), wd=load(K.weeklyDem,{});
  if(meta.mode==="monthly"&&meta.start&&meta.end){
    const w=weekRanges(meta.start,meta.end)[0]||{start:"",end:""};
    return products.map(p=>({product:p.name,quantity:n(wd[`${w.start}_${p.name}`])})).filter(x=>x.quantity>0);
  }
  return products.map(p=>({product:p.name,quantity:n(demands.find(x=>x.product===p.name)?.quantity||0)})).filter(x=>x.quantity>0);
}
function transitionForMaterial(from,to,lineName){
  if(from===to)return {allowed:true,time:0};
  // New master rule: material-to-material transition settings are authoritative
  // whenever that pair exists. This prevents legacy product-level settings from
  // accidentally overriding a configured "不可".
  const materialRules=transitions.filter(x=>x.materialFrom!==undefined&&x.materialTo!==undefined);
  const exact=materialRules.find(x=>(x.line||"")===lineName&&x.materialFrom===from&&x.materialTo===to);
  if(exact)return {allowed:exact.allowed!==false,time:n(exact.time),source:"material"};
  const generic=materialRules.find(x=>(x.line||"")===(""||lineName)&&x.materialFrom===from&&x.materialTo===to);
  if(generic)return {allowed:generic.allowed!==false,time:n(generic.time),source:"material"};
  // Backward compatibility for installations that have not yet entered the
  // new material transition matrix.
  const legacy=transitions.find(x=>x.from===from&&x.to===to&&(!x.line||x.line===lineName));
  if(legacy)return {allowed:legacy.allowed!==false,time:n(legacy.time),source:"legacy"};
  return {allowed:true,time:0,unknown:true};
}
function materialSetForProduct(name){
  const p=prod(name);
  return (p.materialIds||[]).map(id=>materials.find(m=>m.id===id||m.name===id)?.name||id).filter(Boolean);
}


function daySlots(){
  const ss=load(K.schedules,[]);
  const lineList=load(K.lines,[]);
  const line=lineList[0]||{name:"1号",capacity:2050,lot:5000};
  const defaultDays=[
    {name:"月",enabled:true,start:"09:00",end:"19:00",breakMin:60},
    {name:"火",enabled:true,start:"09:00",end:"19:00",breakMin:60},
    {name:"水",enabled:true,start:"09:00",end:"19:00",breakMin:60},
    {name:"木",enabled:true,start:"09:00",end:"19:00",breakMin:60},
    {name:"金",enabled:true,start:"09:00",end:"19:00",breakMin:60}
  ];
  const days=(ss[0]?.days?.length?ss[0].days:defaultDays);
  return days.filter(d=>d.enabled).map((d,i)=>{
    const [sh,sm]=String(d.start||"09:00").split(":").map(Number);
    const [eh,em]=String(d.end||"19:00").split(":").map(Number);
    const minutes=Math.max(0,(eh*60+em)-(sh*60+sm)-n(d.breakMin));
    return {...d,index:i,minutes,remaining:minutes};
  });
}
function allocateOrderToDays(order){
  const days=daySlots();
  const line=load(K.lines,[])[0]||{name:"1号",capacity:2050,lot:5000};
  const demand=demandForCurrentWeek();
  const remain={}; demand.forEach(d=>remain[d.product]=d.quantity);
  const rows=[];
  let prev=null;
  for(const day of days){
    let free=day.minutes;
    let cursorProduct=null;
    const dayRows=[];
    for(const product of order){
      if(remain[product]<=0)continue;
      const p=prod(product);
      const cap=productCapacity(p,line);

      // Determine setup from the product that was actually produced last.
      const fromProduct=cursorProduct||prev;
      let setup=0, blocked=false, blockReason="";
      if(fromProduct && fromProduct!==product){
        const am=materialSetForProduct(fromProduct), bm=materialSetForProduct(product);
        let max=0;
        if(!am.length||!bm.length){
          // Missing material mapping is a data-quality issue; do not invent a
          // setup time. Keep the plan conservative.
          blocked=true;
          blockReason=`${fromProduct}→${product}: 使用原料設定が不足`;
        }else{
          am.forEach(a=>bm.forEach(b=>{
            const r=transitionForMaterial(a,b,line.name);
            if(!r.allowed){
              blocked=true;
              blockReason=`${fromProduct}（${a}）→${product}（${b}）: 切替不可`;
            }else{
              max=Math.max(max,r.time);
            }
          }));
        }
        setup=max;
      }
      if(blocked)continue;
      if(setup>free)continue;

      if(setup>0){
        dayRows.push({type:"setup",from:fromProduct,to:product,minutes:setup});
        free-=setup;
      }

      const possible=Math.floor((free/60)*cap);
      const qty=Math.min(remain[product],possible);
      if(qty<=0)continue;

      const prodMin=qty/cap*60;
      dayRows.push({type:"production",product,quantity:qty,minutes:prodMin});
      remain[product]-=qty;
      free-=prodMin;
      cursorProduct=product;

      // If this product is completed, continue through the preferred order.
      if(remain[product]<=0)continue;
      // Otherwise the day is full enough; carry the product into the next day.
      break;
    }
    if(dayRows.length){
      rows.push({day:day.name,minutes:day.minutes,used:day.minutes-free,remainingMinutes:free,items:dayRows});
      prev=cursorProduct||prev;
    }
  }
  const unmet=Object.entries(remain).filter(([,q])=>q>0).map(([product,quantity])=>({product,quantity}));
  return {rows,unmet,remainingMinutes:rows.reduce((s,r)=>s+r.remainingMinutes,0)};
}

function permutations(arr){
  if(arr.length<=1)return [arr.slice()];
  const out=[];
  arr.forEach((v,i)=>{
    const rest=arr.slice(0,i).concat(arr.slice(i+1));
    permutations(rest).forEach(p=>out.push([v,...p]));
  });
  return out;
}
function calcOrder(order,line){
  let production=0,setup=0,feasible=true,blocked=[];
  order.forEach(name=>{
    const d=demandForCurrentWeek().find(x=>x.product===name);
    const p=prod(name);
    if(d)production+=d.quantity/productCapacity(p,line)*60;
  });
  for(let i=1;i<order.length;i++){
    const from=order[i-1],to=order[i];
    const am=materialSetForProduct(from),bm=materialSetForProduct(to);
    let maxSetup=0;
    am.forEach(a=>bm.forEach(b=>{
      const r=transitionForMaterial(a,b,line.name);
      if(!r.allowed){feasible=false;blocked.push(`${from}（${a}）→${to}（${b}）`);}
      else maxSetup=Math.max(maxSetup,r.time);
    }));
    setup+=maxSetup;
  }
  return {order,productionMinutes:production,setupMinutes:setup,totalMinutes:production+setup,feasible,blocked};
}
function optimizeOrders(){
  const demand=demandForCurrentWeek().filter(x=>x.quantity>0);
  const line=load(K.lines,[])[0]||{name:"1号",capacity:2050,lot:5000};
  if(!demand.length)return {status:"no_demand",candidates:[],best:null};
  // Avoid factorial explosion while the app is small; all permutations up to 8 products.
  const names=demand.map(x=>x.product);
  const orders=names.length<=8?permutations(names):[];
  const available=calcAvailableMinutes().reduce((s,x)=>s+x.minutes,0);
  const candidates=orders.map(o=>calcOrder(o,line)).map(x=>({...x,withinTime:x.totalMinutes<=available}));
  const feasible=candidates.filter(x=>x.feasible&&x.withinTime);
  // Score: first maximize feasibility, then demand coverage (all current candidates
  // represent full demand), then minimize total time and setup.
  feasible.sort((a,b)=>a.totalMinutes-b.totalMinutes || a.setupMinutes-b.setupMinutes);
  const blockedOnly=candidates.filter(x=>x.feasible);
  blockedOnly.sort((a,b)=>a.totalMinutes-b.totalMinutes);
  return {
    status:feasible.length?"feasible_order_found":"no_fully_feasible_order",
    availableMinutes:available,
    candidates:candidates.sort((a,b)=>a.totalMinutes-b.totalMinutes),
    best:feasible[0]||blockedOnly[0]||candidates[0]||null
  };
}

  }
  h+=`<button class="green" id="plan">この順序で生産案を作成</button><button class="gray" id="back">戻る</button></div>`;

function preflightPlan(){
  const lineList=load(K.lines,[]);
  const line=lineList[0]||{name:"1号",capacity:2050,lot:5000};
  const demand=demandForCurrentWeek();
  const available=calcAvailableMinutes().reduce((s,x)=>s+x.minutes,0);
  const productionMinutes=demand.reduce((s,d)=>{
    const p=prod(d.product);
    return s+d.quantity/productCapacity(p,line)*60;
  },0);
  const reasons=[];
  const pairs=[];
  for(let i=0;i<demand.length;i++)for(let j=0;j<demand.length;j++){
    if(i===j)continue;
    const a=demand[i].product,b=demand[j].product;
    const am=materialSetForProduct(a),bm=materialSetForProduct(b);
    am.forEach(x=>bm.forEach(y=>{
      const r=transitionForMaterial(x,y,line.name);
      pairs.push({from:a,to:b,materialFrom:x,materialTo:y,...r});
      if(!r.allowed) reasons.push(`${a}（${x}）→${b}（${y}）は切替不可`);
    }));
  }
  const setupPairs=[];
  demand.forEach(a=>demand.forEach(b=>{
    if(a.product===b.product)return;
    const am=materialSetForProduct(a.product),bm=materialSetForProduct(b.product);
    let impossible=false,time=0;
    am.forEach(x=>bm.forEach(y=>{
      const r=transitionForMaterial(x,y,line.name);
      if(!r.allowed)impossible=true; else time=Math.max(time,r.time);
    }));
    setupPairs.push({from:a.product,to:b.product,allowed:!impossible,time});
  }));
  const totalWithRepresentativeSetup=productionMinutes+
    (demand.length>1?Math.min(...setupPairs.filter(x=>x.allowed).map(x=>x.time||0),Infinity):0);
  return {
    demand,availableMinutes:available,productionMinutes,
    marginMinutes:available-productionMinutes,
    setupPairs,reasons,
    timeFeasible:productionMinutes<=available,
    sequenceFeasible:reasons.length===0,
    status:(productionMinutes<=available&&reasons.length===0)?"feasible":"constraint_review_required"
  };
}

  const input=document.createElement('input'); input.type='file'; input.accept='.json,application/json';
  input.onchange=async()=>{const file=input.files&&input.files[0]; if(!file)return; try{
    const p=JSON.parse(await file.text());
    if(!p||p.backupType!=='production-planning-settings'||!p.data) return alert('このアプリの設定バックアップではありません。');
    if(!confirm('現在の設定をバックアップデータで置き換えます。よろしいですか？'))return;
    if(Array.isArray(p.data.lines))lines=p.data.lines;
    if(Array.isArray(p.data.products))products=p.data.products;
    if(Array.isArray(p.data.materials))materials=p.data.materials;
    if(Array.isArray(p.data.transitions))transitions=p.data.transitions;
    if(Array.isArray(p.data.schedules))schedules=p.data.schedules;
    save(K.lines,lines); save(K.products,products); save(K.materials,materials); save(K.trans,transitions); save(K.schedules,schedules);
    alert('設定データを復元しました。'); home();
  }catch(e){console.error(e);alert('バックアップデータを読み込めませんでした。');}}; input.click();
}
function settingsBackupCard(){return `<div class="card"><h2>設定データのバックアップ</h2><div class="hint">製品・原料・ライン・段取り・稼働時間などの設定をファイルに保存し、アプリ更新や端末変更時に復元できます。</div><div class="row"><button class="green" id="backupSettings">📤 設定をバックアップ</button><button class="gray" id="restoreSettings">📥 設定を復元</button></div></div>`;}

function schedulePage(){
  let h=`<div class="card"><h2>稼働時間設定</h2>`;
  lines.forEach((l,li)=>{const s=lineSchedule(li);h+=`<div class="item"><b>${esc(l.name)}</b>`;
    s.days.forEach((d,di)=>h+=`<div class="item"><label><input type="checkbox" data-en="${li}-${di}" ${d.enabled?"checked":""}> ${d.day}曜日</label><div class="row"><label>開始<input type="time" data-st="${li}-${di}" value="${d.start||"08:00"}"></label><label>終了<input type="time" data-ed="${li}-${di}" value="${d.end||"17:00"}"></label></div><label>休憩分<input type="number" data-br="${li}-${di}" value="${n(d.breakMin??60)}"></label></div>`);
    h+=`</div>`});
  h+=`<button class="green" id="save">保存</button><button class="gray" id="back">戻る</button></div>`;
  app.innerHTML=h;
  document.getElementById("save").onclick=()=>{lines.forEach((l,li)=>{const s=lineSchedule(li);s.days.forEach((d,di)=>{d.enabled=document.querySelector(`[data-en="${li}-${di}"]`)?.checked;d.start=document.querySelector(`[data-st="${li}-${di}"]`)?.value||d.start;d.end=document.querySelector(`[data-ed="${li}-${di}"]`)?.value||d.end;d.breakMin=n(document.querySelector(`[data-br="${li}-${di}"]`)?.value)});});save(K.schedules,schedules);alert("保存しました")};
  document.getElementById("back").onclick=home;
}
home();
</script>
