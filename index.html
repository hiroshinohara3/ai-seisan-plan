<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI生産計画 v11</title>
<style>
body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
header{background:#1d4ed8;color:white;padding:22px 16px}
main{max-width:760px;margin:auto;padding:12px 12px 80px}
h1{font-size:22px;margin:0 0 4px}.sub{font-size:13px}
.card{background:white;border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 2px 8px rgba(0,0,0,.06)}
button{display:block;width:100%;border:0;border-radius:11px;padding:14px;margin:8px 0;background:#2563eb;color:white;font-size:16px;font-weight:700}
.gray{background:#e5e7eb;color:#111827}.green{background:#16a34a}
.small{font-size:13px;color:#6b7280}.item{border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin:8px 0}
label{display:block;font-size:13px;font-weight:700;margin:10px 0 4px}
input,select{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;box-sizing:border-box}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.danger{background:#dc2626}
.ok{background:#ecfdf5;padding:10px;border-radius:10px;font-size:13px}
.warn{background:#fff7ed;padding:10px;border-radius:10px;font-size:13px}
</style>
</head>
<body>
<header><h1>AI生産計画 v11</h1><div class="sub">需要予測から週間生産計画を立案</div></header>
<main id="app">
<div class="card">
<h2>読み込み確認</h2>
<div class="ok">アプリ本体は正常に読み込まれています。</div>
</div>
</main>

<script>
(function(){
  "use strict";
  var app=document.getElementById("app");
  var days=["月","火","水","木","金","土","日"];
  var state={materials:[],products:[],lines:[],rules:[],setups:[],pairs:[],week:[],demand:{},inventory:{},plan:null};
  var i;
  for(i=0;i<7;i++){
    state.week.push({day:days[i],on:i<5,start:"08:00",end:"17:00",breakMin:60,overtime:false});
  }

  function safeLoad(){
    try{
      var raw=localStorage.getItem("aiSeisanV10");
      if(!raw) raw=localStorage.getItem("aiSeisanV9");
      if(raw){
        var old=JSON.parse(raw);
        if(old && typeof old==="object"){
          for(var k in old){if(Object.prototype.hasOwnProperty.call(old,k)){state[k]=old[k];}}
        }
      }
    }catch(e){}
  }
  function save(){
    try{localStorage.setItem("aiSeisanV11",JSON.stringify(state));}catch(e){}
  }
  function esc(x){
    return String(x==null?"":x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
  window.go=function(name){render(name);};

  function home(){
    app.innerHTML=
      '<div class="card"><h2>今週の生産計画</h2>'+
      '<p class="small">順番に入力すると、最後に日別・ライン別の計画案を作成します。</p>'+
      '<button onclick="go(\'week\')">① 稼働時間を設定</button>'+
      '<button onclick="go(\'demand\')">② 需要予測を入力</button>'+
      '<button onclick="go(\'inventory\')">③ 在庫を入力</button>'+
      '<button class="green" onclick="go(\'plan\')">④ 日別の生産計画を見る・作成</button></div>'+
      '<div class="card"><h2>マスター</h2><p class="small">原料・商品・ラインなどを登録します。</p>'+
      '<button class="gray" onclick="go(\'master\')">マスターを修正・追加</button></div>';
  }

  function week(){
    var s='<div class="card"><h2>① 稼働時間</h2><p class="small">曜日ごとの開始・終了・休憩を設定します。</p>';
    for(var j=0;j<7;j++){
      var d=state.week[j]||{day:days[j],on:false,start:"08:00",end:"17:00",breakMin:60,overtime:false};
      s+='<div class="item"><b>'+d.day+'曜日</b>'+
      '<label><input type="checkbox" '+(d.on?'checked':'')+' onchange="setDay('+j+',\'on\',this.checked)"> 稼働</label>'+
      '<div class="row"><label>開始<input type="time" value="'+esc(d.start)+'" onchange="setDay('+j+',\'start\',this.value)"></label>'+
      '<label>終了<input type="time" value="'+esc(d.end)+'" onchange="setDay('+j+',\'end\',this.value)"></label></div>'+
      '<label>休憩（分）<input type="number" value="'+(Number(d.breakMin)||0)+'" onchange="setDay('+j+',\'breakMin\',this.value)"></label></div>';
    }
    s+='<button class="green" onclick="go(\'demand\')">次へ：需要予測</button><button class="gray" onclick="go(\'home\')">戻る</button></div>';
    app.innerHTML=s;
  }
  window.setDay=function(j,k,v){
    if(!state.week[j])state.week[j]={day:days[j],on:false,start:"08:00",end:"17:00",breakMin:60,overtime:false};
    state.week[j][k]=(k==="breakMin"?Number(v)||0:v);save();
  };

  function demand(){
    var s='<div class="card"><h2>② 需要予測</h2>';
    if(!state.products || !state.products.length)s+='<div class="warn">商品がまだ登録されていません。先にマスターから商品を登録してください。</div>';
    else for(var j=0;j<state.products.length;j++){
      var p=state.products[j]; var n=p.name||"商品";
      s+='<div class="item"><b>'+esc(n)+'</b><label>今週の需要予測（個）<input type="number" value="'+(Number(state.demand[n])||0)+'" onchange="setDemand(\''+esc(n)+'\',this.value)"></label></div>';
    }
    s+='<button class="green" onclick="go(\'inventory\')">次へ：在庫</button><button class="gray" onclick="go(\'home\')">戻る</button></div>';
    app.innerHTML=s;
  }
  window.setDemand=function(n,v){state.demand[n]=Number(v)||0;save();};

  function inventory(){
    var s='<div class="card"><h2>③ 在庫</h2>';
    if(!state.products || !state.products.length)s+='<div class="warn">商品がまだ登録されていません。</div>';
    else for(var j=0;j<state.products.length;j++){
      var p=state.products[j];var n=p.name||"商品";
      s+='<div class="item"><b>'+esc(n)+'</b><label>現在庫（個）<input type="number" value="'+(Number(state.inventory[n])||0)+'" onchange="setInv(\''+esc(n)+'\',this.value)"></label></div>';
    }
    s+='<button class="green" onclick="go(\'plan\')">④ 日別計画へ</button><button class="gray" onclick="go(\'home\')">戻る</button></div>';
    app.innerHTML=s;
  }
  window.setInv=function(n,v){state.inventory[n]=Number(v)||0;save();};

  function master(){
    app.innerHTML='<div class="card"><h2>マスター管理</h2>'+
      '<button onclick="go(\'materials\')">原料を登録・修正</button>'+
      '<button onclick="go(\'products\')">商品を登録・修正</button>'+
      '<button onclick="go(\'lines\')">ラインを登録・修正</button>'+
      '<button onclick="go(\'rules\')">原料切替ルールを登録・修正</button>'+
      '<button onclick="go(\'setups\')">商品間の段取りを登録・修正</button>'+
      '<button onclick="go(\'pairs\')">商品×ライン能力・最低ロット</button>'+
      '<button class="gray" onclick="go(\'home\')">戻る</button></div>';
  }

  function simpleList(type,title){
    var arr=state[type]||[]; var s='<div class="card"><h2>'+title+'</h2>';
    for(var j=0;j<arr.length;j++){
      var o=arr[j]; var name=o.name || ((o.from||"")+" → "+(o.to||""));
      s+='<div class="item"><b>'+esc(name)+'</b><div class="small">'+
      (o.material?'使用原料：'+esc(o.material):'')+
      (o.capacity?'能力：'+o.capacity+'個/h ':'')+
      (o.lot?'最低ロット：'+o.lot+'個':'')+
      '</div></div>';
    }
    s+='<button class="green" onclick="alert(\'このv11ではまず画面遷移の安定性を確認します。登録編集機能は次の修正版で戻します。\')">＋登録</button>'+
    '<button class="gray" onclick="go(\'master\')">戻る</button></div>';
    app.innerHTML=s;
  }
  function plan(){
    app.innerHTML='<div class="card"><h2>④ 日別・ライン別 生産計画</h2>'+
      '<div class="ok">計画画面は正常に開いています。</div>'+
      '<p class="small">次の段階で、需要－在庫、ライン能力、最低ロット、原料切替、段取り、曜日別稼働時間を使った自動割付をここへ接続します。</p>'+
      '<button class="green" onclick="go(\'home\')">ホームへ</button></div>';
  }

  function render(name){
    if(name==="home")home();
    else if(name==="week")week();
    else if(name==="demand")demand();
    else if(name==="inventory")inventory();
    else if(name==="plan")plan();
    else if(name==="master")master();
    else if(name==="materials")simpleList("materials","原料");
    else if(name==="products")simpleList("products","商品");
    else if(name==="lines")simpleList("lines","ライン");
    else if(name==="rules")simpleList("rules","原料切替ルール");
    else if(name==="setups")simpleList("setups","商品間の段取り");
    else if(name==="pairs")simpleList("pairs","商品×ライン能力・最低ロット");
    else home();
  }

  window.onerror=function(msg,src,line,col){
    app.innerHTML='<div class="card"><h2>アプリの読み込みエラー</h2><div class="warn">'+esc(msg)+'</div><p class="small">白画面にせず、エラー内容を表示するようにしています。</p></div>';
  };

  safeLoad();
  render("home");
})();
</script>
</body>
</html>
