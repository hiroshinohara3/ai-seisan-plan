<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI生産計画 v14</title>
<style>
body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
header{background:#1d4ed8;color:#fff;padding:20px 16px}.title{font-size:22px;font-weight:800}.sub{font-size:12px}
main{max-width:820px;margin:auto;padding:12px 12px 80px}.card{background:#fff;border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 2px 8px rgba(0,0,0,.06)}
button{display:block;width:100%;border:0;border-radius:11px;padding:14px;margin:8px 0;background:#2563eb;color:#fff;font-size:16px;font-weight:700}
.gray{background:#e5e7eb;color:#111827}.green{background:#16a34a}.red{background:#dc2626}
input,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;background:#fff}
label{display:block;font-size:13px;font-weight:700;margin:10px 0 4px}.item{border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin:8px 0}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions button{margin:0;padding:10px;font-size:14px}
.small{font-size:12px;color:#6b7280}.hint{background:#f9fafb;border-radius:10px;padding:10px;font-size:12px;color:#4b5563}.ok{background:#ecfdf5;border-radius:10px;padding:10px;font-size:13px}
</style>
</head>
<body>
<header><div class="title">AI生産計画 v14</div><div class="sub">商品登録・修正版</div></header>
<main id="app"></main>
<script>
"use strict";
var app=document.getElementById("app");
function read(key,oldKey){
 var a=[];
 try{
  var raw=localStorage.getItem(key);
  if(!raw && oldKey) raw=localStorage.getItem(oldKey);
  if(raw)a=JSON.parse(raw);
 }catch(e){}
 return Array.isArray(a)?a:[];
}
var materials=read("aiSeisanV13_materials");
var products=read("aiSeisanV14_products","aiSeisanV12_products");

function saveAll(){
 try{
  localStorage.setItem("aiSeisanV14_materials",JSON.stringify(materials));
  localStorage.setItem("aiSeisanV14_products",JSON.stringify(products));
 }catch(e){}
}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function home(){
 app.innerHTML='<div class="card"><h2>マスター管理</h2>'+
 '<div class="ok">原料登録はv13から引き継いでいます。</div>'+
 '<button id="m">原料を登録・修正</button>'+
 '<button id="p">商品を登録・修正</button>'+
 '<button class="gray" id="future">ラインなど（次の段階）</button></div>';
 document.getElementById("m").onclick=materialsPage;
 document.getElementById("p").onclick=productsPage;
 document.getElementById("future").onclick=function(){alert("次はライン登録を追加します。");};
}

function materialsPage(){
 var s='<div class="card"><h2>原料</h2>';
 if(!materials.length)s+='<p class="small">まだ登録されていません。</p>';
 for(var i=0;i<materials.length;i++){
  s+='<div class="item"><b>'+esc(materials[i].name)+'</b>'+
  '<div class="actions"><button data-e="'+i+'">編集</button><button class="red" data-d="'+i+'">削除</button></div></div>';
 }
 s+='<button class="green" id="new">＋新規登録</button><button class="gray" id="back">戻る</button></div>';
 app.innerHTML=s;
 document.getElementById("new").onclick=function(){materialEdit(-1);};
 document.getElementById("back").onclick=home;
 var es=document.querySelectorAll("[data-e]");for(var j=0;j<es.length;j++)es[j].onclick=function(){materialEdit(Number(this.dataset.e));};
 var ds=document.querySelectorAll("[data-d]");for(var k=0;k<ds.length;k++)ds[k].onclick=function(){var n=Number(this.dataset.d);if(confirm("削除しますか？")){materials.splice(n,1);saveAll();materialsPage();}};
}
function materialEdit(i){
 var v=i>=0?materials[i].name:"";
 app.innerHTML='<div class="card"><h2>'+(i<0?"原料を新規登録":"原料を編集")+'</h2>'+
 '<label>原料名<input id="n" value="'+esc(v)+'" placeholder="例：A原料"></label>'+
 '<button class="green" id="save">保存</button><button class="gray" id="cancel">キャンセル</button></div>';
 document.getElementById("save").onclick=function(){
  var n=document.getElementById("n").value.trim();if(!n){alert("原料名を入力してください");return;}
  if(i<0)materials.push({name:n});else materials[i]={name:n};saveAll();materialsPage();
 };
 document.getElementById("cancel").onclick=materialsPage;
}

function productsPage(){
 var s='<div class="card"><h2>商品</h2><p class="hint">商品ごとに使用原料を選択します。能力と最低ロットは、後でラインの標準値を基本にして必要な商品だけ修正できるようにします。</p>';
 if(!products.length)s+='<p class="small">まだ商品が登録されていません。</p>';
 for(var i=0;i<products.length;i++){
  var p=products[i];
  s+='<div class="item"><b>'+esc(p.name)+'</b><div class="small">使用原料：'+esc(p.material||"未設定")+
  (p.capacity?'　能力：'+p.capacity+'個/h':"")+(p.lot?'　最低ロット：'+p.lot+'個':"")+
  '</div><div class="actions"><button data-e="'+i+'">編集</button><button class="red" data-d="'+i+'">削除</button></div></div>';
 }
 s+='<button class="green" id="newP">＋新規登録</button><button class="gray" id="backP">戻る</button></div>';
 app.innerHTML=s;
 document.getElementById("newP").onclick=function(){productEdit(-1);};
 document.getElementById("backP").onclick=home;
 var es=document.querySelectorAll("[data-e]");for(var j=0;j<es.length;j++)es[j].onclick=function(){productEdit(Number(this.dataset.e));};
 var ds=document.querySelectorAll("[data-d]");for(var k=0;k<ds.length;k++)ds[k].onclick=function(){var n=Number(this.dataset.d);if(confirm("商品を削除しますか？")){products.splice(n,1);saveAll();productsPage();}};
}
function productEdit(i){
 if(!materials.length){alert("先に原料を1つ以上登録してください。");return;}
 var p=i>=0?products[i]:{};
 var opts=materials.map(function(m){return '<option value="'+esc(m.name)+'" '+(m.name===p.material?'selected':'')+'>'+esc(m.name)+'</option>';}).join("");
 app.innerHTML='<div class="card"><h2>'+(i<0?"商品を新規登録":"商品を編集")+'</h2>'+
 '<label>商品名<input id="name" value="'+esc(p.name||"")+'" placeholder="例：商品A"></label>'+
 '<label>使用原料<select id="material">'+opts+'</select></label>'+
 '<label>商品別1時間能力（任意）<input id="capacity" type="number" min="0" value="'+(p.capacity||"")+'" placeholder="未入力ならライン標準値"></label>'+
 '<label>商品別最低ロット（任意）<input id="lot" type="number" min="0" value="'+(p.lot||"")+'" placeholder="未入力ならライン標準値"></label>'+
 '<div class="hint">※能力・最低ロットは「商品ごとに例外がある場合だけ」入力します。</div>'+
 '<button class="green" id="saveP">保存</button><button class="gray" id="cancelP">キャンセル</button></div>';
 document.getElementById("saveP").onclick=function(){
  var name=document.getElementById("name").value.trim();if(!name){alert("商品名を入力してください");return;}
  var obj={name:name,material:document.getElementById("material").value,capacity:Number(document.getElementById("capacity").value)||0,lot:Number(document.getElementById("lot").value)||0};
  if(i<0)products.push(obj);else products[i]=obj;saveAll();productsPage();
 };
 document.getElementById("cancelP").onclick=productsPage;
}
home();
</script>
</body>
</html>
