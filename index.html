<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI生産計画 v15</title>
<style>
body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,sans-serif}header{background:#1d4ed8;color:white;padding:20px 16px}.title{font-size:22px;font-weight:800}main{max-width:820px;margin:auto;padding:12px}.card{background:white;border-radius:16px;padding:16px;margin:10px 0}button{display:block;width:100%;border:0;border-radius:11px;padding:14px;margin:8px 0;background:#2563eb;color:white;font-size:16px;font-weight:700}.gray{background:#e5e7eb;color:#111827}.green{background:#16a34a}.red{background:#dc2626}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px}label{display:block;font-size:13px;font-weight:700;margin:10px 0 4px}.item{border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin:8px 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions button{margin:0;padding:10px;font-size:14px}.small{font-size:12px;color:#6b7280}.hint{background:#f9fafb;border-radius:10px;padding:10px;font-size:12px}
</style></head><body><header><div class="title">AI生産計画 v15</div><div>ライン登録・標準能力設定</div></header><main id="app"></main>
<script>
"use strict";
var app=document.getElementById("app");
function read(k){try{var x=JSON.parse(localStorage.getItem(k)||"[]");return Array.isArray(x)?x:[]}catch(e){return[]}}
var materials=read("aiSeisanV14_materials"); if(!materials.length)materials=read("aiSeisanV13_materials");
var products=read("aiSeisanV14_products"), lines=read("aiSeisanV15_lines");
function save(){localStorage.setItem("aiSeisanV15_materials",JSON.stringify(materials));localStorage.setItem("aiSeisanV15_products",JSON.stringify(products));localStorage.setItem("aiSeisanV15_lines",JSON.stringify(lines))}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function home(){app.innerHTML='<div class="card"><h2>マスター管理</h2><div class="hint">原料・商品はこれまでの登録内容を引き継ぎます。</div><button id="m">原料を登録・修正</button><button id="p">商品を登録・修正</button><button id="l">ラインを登録・修正</button></div>';document.getElementById("m").onclick=materialsPage;document.getElementById("p").onclick=productsPage;document.getElementById("l").onclick=linesPage}
function materialsPage(){var s='<div class="card"><h2>原料</h2>';for(var i=0;i<materials.length;i++)s+='<div class="item"><b>'+esc(materials[i].name)+'</b></div>';s+='<button class="gray" id="b">戻る</button></div>';app.innerHTML=s;document.getElementById("b").onclick=home}
function productsPage(){var s='<div class="card"><h2>商品</h2>';for(var i=0;i<products.length;i++)s+='<div class="item"><b>'+esc(products[i].name)+'</b><div class="small">使用原料：'+esc(products[i].material)+'</div></div>';s+='<button class="gray" id="b">戻る</button></div>';app.innerHTML=s;document.getElementById("b").onclick=home}
function linesPage(){var s='<div class="card"><h2>ライン</h2><div class="hint">ラインの標準能力・最低ロットを基本値として使います。商品側に個別設定がある場合は商品側を優先します。</div>';for(var i=0;i<lines.length;i++){var x=lines[i];s+='<div class="item"><b>'+esc(x.name)+'</b><div class="small">標準能力：'+x.capacity+'個/h　最低ロット：'+x.lot+'個　必要人員：'+x.workers+'人</div><div class="actions"><button data-e="'+i+'">編集</button><button class="red" data-d="'+i+'">削除</button></div></div>'}s+='<button class="green" id="n">＋新規登録</button><button class="gray" id="b">戻る</button></div>';app.innerHTML=s;document.getElementById("n").onclick=function(){lineEdit(-1)};document.getElementById("b").onclick=home;document.querySelectorAll("[data-e]").forEach(function(b){b.onclick=function(){lineEdit(+this.dataset.e)}});document.querySelectorAll("[data-d]").forEach(function(b){b.onclick=function(){var i=+this.dataset.d;if(confirm("このラインを削除しますか？")){lines.splice(i,1);save();linesPage()}}})}
function lineEdit(i){var x=i>=0?lines[i]:{};app.innerHTML='<div class="card"><h2>'+(i<0?"ラインを新規登録":"ラインを編集")+'</h2><label>ライン名<input id="name" value="'+esc(x.name)+'" placeholder="例：第1ライン"></label><label>標準1時間能力（個）<input id="cap" type="number" value="'+(x.capacity||"")+'" placeholder="例：500"></label><label>標準最低ロット（個）<input id="lot" type="number" value="'+(x.lot||"")+'" placeholder="例：1000"></label><label>必要人員（人）<input id="workers" type="number" value="'+(x.workers||"")+'" placeholder="例：3"></label><button class="green" id="s">保存</button><button class="gray" id="c">キャンセル</button></div>';document.getElementById("s").onclick=function(){var n=document.getElementById("name").value.trim();if(!n){alert("ライン名を入力してください");return}var o={name:n,capacity:+document.getElementById("cap").value||0,lot:+document.getElementById("lot").value||0,workers:+document.getElementById("workers").value||0};if(i<0)lines.push(o);else lines[i]=o;save();linesPage()};document.getElementById("c").onclick=linesPage}
home();
</script></body></html>
