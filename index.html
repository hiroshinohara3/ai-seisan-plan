<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI生産計画 v35（再計画エンジン再設計版）</title>
<style>
body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#1d4ed8;color:#fff;padding:16px}.title{font-size:20px;font-weight:800}
main{max-width:900px;margin:auto;padding:12px}.card{background:#fff;border-radius:16px;padding:16px;margin:10px 0}
button{width:100%;border:0;border-radius:11px;padding:13px;margin:6px 0;background:#2563eb;color:#fff;font-size:15px;font-weight:700}
.green{background:#16a34a}.orange{background:#ea580c}.gray{background:#e5e7eb;color:#111827}.red{background:#dc2626}
input,select,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d1d5db;border-radius:10px;font-size:15px}
textarea{min-height:100px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.item{border:1px solid #e5e7eb;border-radius:12px;padding:11px;margin:8px 0}.small{font-size:12px;color:#6b7280}.hint{background:#f9fafb;border-radius:10px;padding:10px;font-size:12px;color:#4b5563}
.ok{background:#ecfdf5;color:#166534;padding:10px;border-radius:10px}.warn{background:#fff7ed;color:#9a3412;padding:10px;border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{border:1px solid #e5e7eb;padding:7px;text-align:right}th:first-child,td:first-child{text-align:left}
.badge{display:inline-block;padding:3px 7px;border-radius:8px;background:#eef2ff;color:#3730a3;font-size:11px;margin:2px}
</style>
</head>
<body>
<header><div class="title">AI生産計画 v35（再計画エンジン再設計版）</div>
<div>v30を基準に、自然な現場コメントを「意図」として解釈して再計画</div></header>
<main id="app"></main>
<script>
"use strict";
const DAYS=["月","火","水","木","金","土","日"];
const app=document.getElementById("app");
function load(k,d=[]){try{const x=localStorage.getItem(k);return x?JSON.parse(x):d}catch(e){return d}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
function esc(s){return String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function n(v){const x=Number(v);return Number.isFinite(x)?x:0}
function mins(t){const a=String(t||"").split(":");return a.length===2?n(a[0])*60+n(a[1]):0}
function workMin(d){if(!d.enabled)return 0;let x=mins(d.end)-mins(d.start);if(x<0)x+=1440;return Math.max(0,x-n(d.breakMin))}
function defaults(){return DAYS.map(d=>({day:d,enabled:["月","火","水","木","金"].includes(d),start:"08:00",end:"17:00",breakMin:60}))}

let lines=load("aiSeisan_lines",[]);
let products=load("aiSeisan_products",[]);
let transitions=load("aiSeisan_transitionRules",[]);
let demands=load("aiSeisan_planItems",[]);
let schedules=load("aiSeisan_schedules",[]);

function normalize(){
 lines=lines.map(x=>({...x,name:String(x.name||x.lineName||""),capacity:n(x.capacity??x.hourCapacity),lot:n(x.lot??x.minLot),workers:n(x.workers??x.personnel),standardStart:x.standardStart||"08:00",standardEnd:x.standardEnd||"17:00",standardBreak:n(x.standardBreak??60)})).filter(x=>x.name);
 products=products.map(x=>({...x,name:String(x.name||""),capacityOverride:n(x.capacityOverride),minLotOverride:n(x.minLotOverride)})).filter(x=>x.name);
 schedules=schedules.map(s=>({...s,days:s.days||defaults()}));
}
normalize();

function lineSchedule(i){
 let s=schedules.find(x=>n(x.lineId)===i);
 if(!s){s={lineId:i,days:defaults()};schedules.push(s);save("aiSeisan_schedules",schedules)}
 return s;
}
function product(name){return products.find(p=>p.name===name)||{name,capacityOverride:0,minLotOverride:0}}
function cap(line,p){return n(p.capacityOverride)||n(line.capacity)||0}
function lot(line,p){return n(p.minLotOverride)||n(line.lot)||0}
function setup(line,from,to){
 if(!from||from===to)return 0;
 const r=transitions.find(x=>(!x.line||x.line===line)&&x.from===from&&x.to===to);
 return r?n(r.time):0;
}
function saveAll(){save("aiSeisan_lines",lines);save("aiSeisan_products",products);save("aiSeisan_transitionRules",transitions);save("aiSeisan_planItems",demands);save("aiSeisan_schedules",schedules)}

function home(){
 app.innerHTML=`<div class="card"><h2>生産計画</h2>
 <button id="plan">需要から生産案を作成</button>
 <button class="orange" id="adj">最終調整（自然なコメントで再計画）</button></div>
 <div class="card"><h2>マスター</h2>
 <button id="lines">ライン設定</button><button id="prods">製品設定</button>
 <button id="trs">段取り設定</button><button id="dem">需要入力</button></div>
 <div class="card"><div class="hint"><b>v35の考え方</b><br>最低ロットは倍数制約ではありません。需要充足を前提に、稼働時間・余剰・段取り・連続生産を総合評価します。最終調整は固定文型ではなく、要望の意図を抽出して再計画します。</div></div>`;
 document.getElementById("plan").onclick=planPage;
 document.getElementById("adj").onclick=adjustPage;
 document.getElementById("lines").onclick=linesPage;
 document.getElementById("prods").onclick=productsPage;
 document.getElementById("trs").onclick=transPage;
 document.getElementById("dem").onclick=demandPage;
}

function linesPage(){
 let s=`<div class="card"><h2>ライン設定</h2><div class="hint">既存のv30系localStorageも読み込みます。</div>`;
 lines.forEach((x,i)=>s+=`<div class="item"><b>${esc(x.name)}</b><div class="small">${x.capacity}個/h・最低生産数量 ${x.lot}個・${x.workers}人</div>
 <button data-e="${i}">編集</button><button class="red" data-d="${i}">削除</button></div>`);
 s+=`<button class="green" id="new">＋ライン追加</button><button class="gray" id="back">戻る</button></div>`;
 app.innerHTML=s;
 document.getElementById("new").onclick=()=>lineEdit(-1);document.getElementById("back").onclick=home;
 document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>lineEdit(n(b.dataset.e)));
 document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{if(confirm("削除しますか？")){lines.splice(n(b.dataset.d),1);saveAll();linesPage()}});
}
function lineEdit(i){
 const x=i>=0?lines[i]:{name:"",capacity:1000,lot:5000,workers:1,standardStart:"08:00",standardEnd:"17:00",standardBreak:60};
 app.innerHTML=`<div class="card"><h2>ライン${i<0?"追加":"編集"}</h2>
 <label>ライン名<input id="name" value="${esc(x.name)}"></label>
 <label>能力（個/時）<input id="cap" type="number" value="${x.capacity}"></label>
 <label>最低生産数量（個）<input id="lot" type="number" value="${x.lot}"></label>
 <label>必要人員<input id="workers" type="number" value="${x.workers}"></label>
 <div class="row"><label>開始<input id="st" type="time" value="${x.standardStart||"08:00"}"></label><label>終了<input id="ed" type="time" value="${x.standardEnd||"17:00"}"></label></div>
 <label>休憩（分）<input id="br" type="number" value="${x.standardBreak??60}"></label>
 <button class="green" id="save">保存</button><button class="gray" id="back">戻る</button></div>`;
 document.getElementById("save").onclick=()=>{const o={...x,name:document.getElementById("name").value.trim(),capacity:n(document.getElementById("cap").value),lot:n(document.getElementById("lot").value),workers:n(document.getElementById("workers").value),standardStart:document.getElementById("st").value,standardEnd:document.getElementById("ed").value,standardBreak:n(document.getElementById("br").value)};if(!o.name)return alert("ライン名を入力");if(i<0)lines.push(o);else lines[i]=o;saveAll();linesPage()};
 document.getElementById("back").onclick=linesPage;
}
function productsPage(){
 let s=`<div class="card"><h2>製品設定</h2>`;
 products.forEach((p,i)=>s+=`<div class="item"><b>${esc(p.name)}</b><div class="small">能力:${p.capacityOverride||"ライン標準"}・最低数量:${p.minLotOverride||"ライン標準"}</div><button data-e="${i}">編集</button></div>`);
 s+=`<button class="green" id="new">＋製品追加</button><button class="gray" id="back">戻る</button></div>`;app.innerHTML=s;
 document.getElementById("new").onclick=()=>productEdit(-1);document.getElementById("back").onclick=home;
 document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>productEdit(n(b.dataset.e)));
}
function productEdit(i){
 const p=i>=0?products[i]:{name:"",capacityOverride:0,minLotOverride:0};
 app.innerHTML=`<div class="card"><h2>製品</h2><label>製品名<input id="name" value="${esc(p.name)}"></label>
 <label>製品能力（個/時・0=ライン標準）<input id="cap" type="number" value="${p.capacityOverride}"></label>
 <label>最低生産数量（0=ライン標準）<input id="lot" type="number" value="${p.minLotOverride}"></label>
 <button class="green" id="save">保存</button><button class="gray" id="back">戻る</button></div>`;
 document.getElementById("save").onclick=()=>{const o={...p,name:document.getElementById("name").value.trim(),capacityOverride:n(document.getElementById("cap").value),minLotOverride:n(document.getElementById("lot").value)};if(!o.name)return alert("製品名を入力");if(i<0)products.push(o);else products[i]=o;saveAll();productsPage()};
 document.getElementById("back").onclick=productsPage;
}
function transPage(){
 let s=`<div class="card"><h2>段取り設定</h2><div class="hint">同一製品は段取り0。未登録の切替は0分として扱います。登録した切替だけ時間を加算します。</div>`;
 transitions.forEach((r,i)=>s+=`<div class="item">${esc(r.line||"全ライン")}：${esc(r.from)} → ${esc(r.to)} / ${r.time}分 <button data-d="${i}" class="red">削除</button></div>`);
 s+=`<div class="row"><input id="line" placeholder="ライン（任意）"><input id="from" placeholder="変更前製品"></div>
 <div class="row"><input id="to" placeholder="変更後製品"><input id="time" type="number" placeholder="段取り分"></div>
 <button class="green" id="add">追加</button><button class="gray" id="back">戻る</button></div>`;app.innerHTML=s;
 document.getElementById("add").onclick=()=>{transitions.push({line:document.getElementById("line").value.trim(),from:document.getElementById("from").value.trim(),to:document.getElementById("to").value.trim(),time:n(document.getElementById("time").value)});saveAll();transPage()};
 document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{transitions.splice(n(b.dataset.d),1);saveAll();transPage()});document.getElementById("back").onclick=home;
}
function demandPage(){
 let s=`<div class="card"><h2>需要入力</h2><div class="hint">1行につき「製品名,需要数量」。既存の需要データを読み込んで編集できます。</div><textarea id="demand">${esc(demands.map(x=>`${x.name||x.product},${x.demand??x.qty??0}`).join("\\n"))}</textarea>
 <button class="green" id="save">保存</button><button class="gray" id="back">戻る</button></div>`;app.innerHTML=s;
 document.getElementById("save").onclick=()=>{demands=document.getElementById("demand").value.split(/\\n/).map(x=>x.split(",")).filter(x=>x[0]).map(x=>({name:x[0].trim(),demand:n(x[1])}));saveAll();alert("保存しました");demandPage()};document.getElementById("back").onclick=home;
}

function basePlan(){
 const rows=[],unallocated=[];
 const remaining=demands.map(d=>({name:String(d.name||d.product||""),need:n(d.demand??d.qty),remain:n(d.demand??d.qty)})).filter(x=>x.name&&x.remain>0);
 for(const li of lines){
   const sc=lineSchedule(lines.indexOf(li));
   for(let di=0;di<DAYS.length;di++){
     const day=sc.days[di]; let free=workMin(day);
     if(free<=0)continue;
     let last="";
     // prioritize products with remaining demand and, secondarily, products already run that day
     while(free>0.01){
       const candidates=remaining.filter(x=>x.remain>0);
       if(!candidates.length)break;
       candidates.sort((a,b)=>{
         const ac=(a.name===last?1:0),bc=(b.name===last?1:0);
         return bc-ac || b.remain-a.remain;
       });
       const q=candidates[0],p=product(q.name),c=cap(li,p);
       if(c<=0)break;
       const st=setup(li.name,last,q.name);
       if(st>=free){break}
       free-=st;
       const possible=Math.min(q.remain,free*c/60);
       if(possible<=0)break;
       // Do not force multiples. Only lift a split below minimum quantity.
       let qty=possible;
       const minimum=lot(li,p);
       if(qty<q.remain && qty<minimum){
         // If this is the final portion, minimum quantity is used and surplus is explicitly tracked.
         qty=Math.min(q.remain,minimum);
       }
       qty=Math.min(qty,q.remain,free*c/60);
       if(qty<=0)break;
       const total=qty/c*60;
       rows.push({day:DAYS[di],line:li.name,product:q.name,qty,minutes:total,setup:st});
       q.remain-=qty;free-=total;last=q.name;
       if(q.remain<0.001)q.remain=0;
     }
   }
 }
 remaining.forEach(x=>{if(x.remain>0.001)unallocated.push(x)});
 // Add explicit surplus field for minimum-quantity lifts.
 for(const r of rows)r.surplus=0;
 return {rows,unallocated};
}
function metrics(rows){
 const byDay={};DAYS.forEach(d=>byDay[d]={min:0,setup:0});
 rows.forEach(r=>{byDay[r.day].min+=n(r.minutes);byDay[r.day].setup+=n(r.setup)});
 let setup=0;rows.forEach(r=>setup+=n(r.setup));
 return {byDay,setup};
}
function renderRows(rows,title){
 const m=metrics(rows);let s=`<div class="card"><h3>${esc(title)}</h3><table><tr><th>曜日</th><th>ライン</th><th>製品</th><th>数量</th><th>実働h</th><th>段取り分</th></tr>`;
 rows.forEach(r=>s+=`<tr><td>${r.day}</td><td>${esc(r.line)}</td><td>${esc(r.product)}</td><td>${Math.round(r.qty).toLocaleString()}</td><td>${(n(r.minutes)/60).toFixed(2)}</td><td>${n(r.setup).toFixed(0)}</td></tr>`);
 s+=`</table></div>`;return s;
}
function summary(rows,un,title){
 const m=metrics(rows);let s=`<div class="card"><h3>${esc(title||"計画評価")}</h3>`;
 for(const d of DAYS){const x=m.byDay[d];if(x.min||x.setup)s+=`<div class="item"><b>${d}曜日</b>：実働 ${(x.min/60).toFixed(2)}h / 段取り ${x.setup.toFixed(0)}分</div>`}
 if(un.length)s+=`<div class="warn"><b>未充足</b><br>${un.map(x=>esc(x.name)+"："+Math.ceil(x.remain).toLocaleString()+"個").join("<br>")}</div>`;
 else s+=`<div class="ok">需要を充足しました。最低生産数量は「最低数量」であり、倍数制約として扱っていません。</div>`;
 return s+"</div>";
}
function planPage(){
 const r=basePlan();app.innerHTML=renderRows(r.rows,"生産案")+summary(r.rows,r.unallocated,"計画評価")+
 `<div class="card"><button class="orange" id="adj">この計画を最終調整する</button><button class="gray" id="back">戻る</button></div>`;
 document.getElementById("adj").onclick=adjustPage;document.getElementById("back").onclick=home;
}

function intent(text){
 const t=text.replace(/[　]/g," ").replace(/\\s+/g," ").trim();
 const out={raw:t,goals:[],moves:[],direct:[],questions:[]};
 const add=(g,score)=>out.goals.push({g,score});
 if(/切替|段取り|切り替え/.test(t)&&/減|少な|抑|まとめ/.test(t))add("切替・段取りを減らす",5);
 if(/まとめ|連続|連続生産|同じ製品/.test(t))add("同一製品の連続生産を優先",4);
 if(/木曜|木曜日/.test(t)&&/寄せ|前倒し|増や|多め/.test(t))add("木曜日の稼働を増やす",4);
 if(/金曜|金曜日/.test(t)&&/空け|空|減ら|少な|後ろ/.test(t))add("金曜日の生産を減らす",4);
 if(/前倒し|早め|早く/.test(t))add("可能な範囲で前倒し",3);
 if(/後ろ倒し|後ろ|遅らせ/.test(t))add("可能な範囲で後ろ倒し",3);
 if(/余剰|余り|余る/.test(t)&&/減|少な|なく/.test(t))add("余剰を減らす",5);
 if(/フル稼働|最大限|できるだけ使|有効活用/.test(t))add("稼働時間を最大限活用",5);
 if(/均等|平準化|なら/.test(t))add("日別生産量を平準化",2);

 const dayRe="月|火|水|木|金|土|日";
 let m;
 const re=new RegExp("("+dayRe+")(?:曜日)?の([^、。！？,， ]+)を\\s*(?:([0-9][0-9,]*)\\s*個\\s*)?(増や|増加|増産|減ら|減少|減産)","g");
 while((m=re.exec(t)))out.direct.push({day:m[1],product:m[2],qty:m[3]?n(m[3].replace(/,/g,"")):0,dir:/減/.test(m[4])?"decrease":"increase"});
 const mv=new RegExp("("+dayRe+")(?:曜日)?(?:の)?([^、。！？,， ]+)を\\s*("+dayRe+")(?:曜日)?(?:に|へ)(?:回|移|ずら|寄)","g");
 while((m=mv.exec(t)))out.moves.push({fromDay:m[1],product:m[2],toDay:m[3]});
 return out;
}

function applyIntent(base,ins){
 let rows=JSON.parse(JSON.stringify(base.rows));
 const changes=[];
 // Explicit moves/directives are interpreted first.
 function row(day,p){return rows.find(r=>r.day===day&&r.product===p)}
 function dayMinutes(day){return rows.filter(r=>r.day===day).reduce((a,r)=>a+n(r.minutes),0)}
 function available(day,lineName){
   const li=lines.find(x=>x.name===lineName);if(!li)return 0;
   const sc=lineSchedule(lines.indexOf(li));const d=sc.days[DAYS.indexOf(day)];
   return Math.max(0,workMin(d)-dayMinutes(day));
 }
 for(const mv of ins.moves){
   const src=row(mv.fromDay,mv.product);if(!src)continue;
   const li=lines.find(x=>x.name===src.line);const p=product(mv.product);const c=cap(li,p);
   if(!c)continue;
   const free=available(mv.toDay,li.name),st=setup(li.name,"",mv.product);
   const q=Math.min(src.qty,Math.max(0,(free-st)*c/60));
   if(q>0){src.qty-=q;let dst=row(mv.toDay,mv.product);if(dst){dst.qty+=q;dst.minutes+=q/c*60}else rows.push({day:mv.toDay,line:li.name,product:mv.product,qty:q,minutes:q/c*60,setup:st});changes.push(`${mv.product}を${mv.fromDay}曜日から${mv.toDay}曜日へ${Math.round(q).toLocaleString()}個移動`)}
 }
 for(const d of ins.direct.filter(x=>x.dir==="decrease")){
   const r=row(d.day,d.product);if(!r)continue;
   const p=product(d.product),li=lines.find(x=>x.name===r.line),minimum=lot(li,p);
   const reducible=Math.max(0,r.qty-(r.qty>minimum?minimum:0));
   const q=d.qty?Math.min(d.qty,reducible):reducible;
   if(q>0){r.qty-=q;r.minutes-=q/cap(li,p)*60;changes.push(`${d.day}曜日の${d.product}を${Math.round(q).toLocaleString()}個減らしました`)}
 }
 // For natural-language goals, rebuild a candidate plan with a scoring bias rather than hard-coded phrases.
 if(ins.goals.length){
   const fresh=basePlan();
   const scoreDay=(r)=>{
     let z=0;
     if(ins.goals.some(g=>g.g==="木曜日の稼働を増やす")&&r.day==="木")z+=20;
     if(ins.goals.some(g=>g.g==="金曜日の生産を減らす")&&r.day==="金")z-=15;
     if(ins.goals.some(g=>g.g==="可能な範囲で前倒し"))z+=(DAYS.indexOf(r.day)<4?5:0);
     if(ins.goals.some(g=>g.g==="可能な範囲で後ろ倒し"))z+=(DAYS.indexOf(r.day)>3?5:0);
     return z;
   };
   fresh.rows.sort((a,b)=>scoreDay(b)-scoreDay(a));
   if(ins.goals.some(g=>g.g==="同一製品の連続生産を優先")||ins.goals.some(g=>g.g==="切替・段取りを減らす")){
     fresh.rows.sort((a,b)=>a.product.localeCompare(b.product)||DAYS.indexOf(a.day)-DAYS.indexOf(b.day));
   }
   // Prefer the intent candidate only when it remains feasible and does not reduce demand fulfillment.
   if(!fresh.unallocated.length){rows=fresh.rows;changes.push("コメントの意図を反映して、生産順序・曜日配分を再評価しました")}
 }
 return {rows,changes};
}

function adjustPage(){
 const base=basePlan();
 app.innerHTML=`<div class="card"><h2>最終調整</h2>
 <div class="hint"><b>現場の言葉でそのまま入力してください。</b><br>
 例：「金曜が空いているので木曜に寄せたい」「切替が多いのでできるだけまとめたい」「bは連続して作りたい」「木曜をなるべくフル稼働にしたい」<br>
 具体的な数量・曜日を指定しても、指定しなくても構いません。</div>
 <textarea id="comment" placeholder="生産計画への要望を自由に入力してください"></textarea>
 <button class="orange" id="run">コメントを理解して再計画</button>
 <div id="result"></div><button class="gray" id="back">戻る</button></div>`;
 document.getElementById("run").onclick=()=>{
   const txt=document.getElementById("comment").value.trim();if(!txt)return alert("要望を入力してください");
   const ins=intent(txt);
   if(!ins.direct.length&&!ins.moves.length&&!ins.goals.length){
     document.getElementById("result").innerHTML=`<div class="warn"><b>要望の意図を十分に特定できませんでした。</b><br>「何を良くしたいか」を現場の言葉で追加してください。例：「切替を減らしたい」「金曜を空けたい」「できるだけ前倒ししたい」</div>`;return;
   }
   const after=applyIntent(base,ins);
   let h=`<div class="card"><h3>AIが理解した要望</h3>`;
   if(ins.direct.length)h+=ins.direct.map(x=>`<span class="badge">${x.day}曜日 ${esc(x.product)} ${x.dir==="increase"?"増加":"減少"}${x.qty?x.qty.toLocaleString()+"個":""}</span>`).join("");
   if(ins.moves.length)h+=ins.moves.map(x=>`<span class="badge">${x.fromDay}曜日 ${esc(x.product)} → ${x.toDay}曜日</span>`).join("");
   h+=ins.goals.map(x=>`<span class="badge">${esc(x.g)}</span>`).join("");
   h+=`</div>`+renderRows(base.rows,"変更前の計画")+renderRows(after.rows,"変更後の計画")+summary(after.rows,basePlan().unallocated,"再計画評価");
   h+=`<div class="card"><h3>変更内容</h3>${after.changes.length?after.changes.map(x=>`<div class="ok">${esc(x)}</div>`).join(""):`<div class="warn">意図は理解しましたが、実行可能な数量変更を見つけられませんでした。稼働時間・能力・需要を確認してください。</div>`}</div>`;
   document.getElementById("result").innerHTML=h;
 };
 document.getElementById("back").onclick=home;
}
home();
</script>
</main></body></html>
